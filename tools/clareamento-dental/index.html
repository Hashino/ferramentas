<meta name="description" content="Estime o preço do clareamento dental: consultório, moldeira caseira ou combinado, com faixa real. Grátis, sem cadastro.">

<meta property="og:title" content="Quanto Custa Clareamento Dental — Calculadora">
<meta property="og:description" content="Consultório × caseiro: faixa de preço do clareamento dental.">
<meta property="og:type" content="website">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Clareamento Dental</h1>
  <section class="app">
<label for="tipo">Tipo de clareamento</label>
    <select id="tipo">
      <option value="800" selected>No consultório — 1 a 3 sessões</option>
      <option value="350">Caseiro com moldeira — 2 a 4 semanas</option>
      <option value="1100">Combinado (consultório + moldeira)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.5);
  detalhe.textContent = "clareamento " + (nome === "Caseiro com moldeira" ? "caseiro com moldeira" : nome.toLowerCase()) + "\n" +
    "exige avaliação: cárie ou restauração velha precisam tratar antes\n" +
    "sensibilidade nos dias seguintes é comum\n" +
    "resultado cai com café, vinho e cigarro — retoque a cada 1 ou 2 anos";
});
</script>
</body>
</html>
