<body data-footer>
<main>
  <h1>Quanto Custa Abrir uma Empresa</h1>
  <section class="app">
<label for="tipo">Tipo de empresa</label>
    <select id="tipo">
      <option value="mei" selected>MEI — registro grátis, taxa fixa mensal</option>
      <option value="simples">ME no Simples Nacional</option>
      <option value="presumido">ME no Lucro Presumido</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var tipo = document.getElementById("tipo").value;
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var abre, mes, nome;
  if (tipo === "mei") { abre = 0; mes = 0; nome = "MEI"; }
  else if (tipo === "simples") { abre = 450; mes = 250; nome = "ME no Simples"; }
  else { abre = 1200; mes = 450; nome = "ME no Lucro Presumido"; }
  var abreTxt = abre === 0 ? "R$ 0 (grátis no gov.br)" : "R$ " + br(abre * 0.6) + " a R$ " + br(abre * 1.8);
  var mesTxt = mes === 0 ? "DAS fixo por atividade (~R$ 75)" : "contador R$ " + br(mes * 0.7) + " a R$ " + br(mes * 1.5) + "/mês";
  saida.textContent = "Abertura: " + abreTxt + " — mensal: " + mesTxt;
  detalhe.textContent = nome + "\n" +
    "MEI: limite de faturamento de R$ 81 mil/ano, 1 funcionário\n" +
    "ME: junta comercial, alvarás e licenças variam por cidade\n" +
    "várias contabilidades abrem de graça para fidelizar o mensal";
});
</script>
