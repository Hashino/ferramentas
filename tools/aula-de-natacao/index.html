<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Aula de Natação — Calculadora</title>
<meta name="description" content="Estime o preço da natação: mensal em academia, clube ou aula particular, com faixa real. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/aula-de-natacao/">
<meta property="og:title" content="Quanto Custa Aula de Natação — Calculadora">
<meta property="og:description" content="Academia × clube × particular: faixa de preço da natação.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de aula de natação","url":"https://hashino.github.io/ferramentas/tools/aula-de-natacao/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa aula de natação."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Aula de Natacao</h1>
  <section class="app">
<label for="tipo">Formato</label>
    <select id="tipo">
      <option value="250" selected>Mensal em academia (2× na semana)</option>
      <option value="350">Mensal em clube</option>
      <option value="90">Aula particular (por hora)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.7);
  detalhe.textContent = nome + "\n" +
    "prefeitura e SESC têm aulas mais baratas ou de graça\n" +
    "turma pequena (até 4 alunos) custa mais que turma cheia\n" +
    "matrícula anual é comum — pergunte antes\n" +
    "hidroginástica costuma ter o mesmo preço da natação";
});
</script>
</body>
</html>
