<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Dura um Toner — Calculadora por Páginas</title>
<meta name="description" content="Calcule quanto tempo dura o toner: impressões por mês e rendimento do cartucho, em meses. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/dura-toner/">
<meta property="og:title" content="Quanto Dura um Toner — Calculadora por Páginas">
<meta property="og:description" content="Impressões/mês × rendimento do toner: duração em meses.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de duração de toner","url":"https://hashino.github.io/ferramentas/tools/dura-toner/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto dura um toner."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Dura um Toner</h1>
  <section class="app">
    <label for="mes">Impressões por mês</label>
    <input type="number" id="mes" step="50" min="10" value="500">
<label for="rend">Rendimento do toner</label>
    <select id="rend">
      <option value="2000" selected>Padrão — ~2.000 páginas</option>
      <option value="5000">Alto rendimento — ~5.000 páginas</option>
      <option value="12000">Extra alto — ~12.000 páginas</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var mes = Number(document.getElementById("mes").value);
  var rend = Number(document.getElementById("rend").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (mes < 10) { saida.textContent = "Informe as impressões por mês."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d === undefined ? 0 : d }); };
  var meses = rend / mes;
  saida.textContent = "≈ " + br(meses, 1) + " meses por toner (" + br(rend / mes, 1) + " toners por ano)";
  detalhe.textContent = br(rend) + " páginas ÷ " + br(mes) + "/mês\n" +
    "rendimento considera 5% de cobertura de tinta na folha\n" +
    "impressões cheias de imagem gastam 5 a 10x mais tinta\n" +
    "toner parado dura ~2 anos na embalagem fechada";
});
</script>
</body>
</html>
