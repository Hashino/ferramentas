<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Colocar Aparelho no Dente</h1>
  <section class="app">
<label for="tipo">Tipo de aparelho</label>
    <select id="tipo">
      <option value="3500" selected>Metálico — o mais barato</option>
      <option value="5000">Autoligável — menos consultas</option>
      <option value="6500">Estético (porcelana/safira)</option>
      <option value="12000">Invisalign / alinhadores</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Total: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.4) +
    " — ~R$ " + br(med / 24 * 0.7) + " a R$ " + br(med / 24 * 1.4) + "/mês em 24x";
  detalhe.textContent = "aparelho " + nome.toLowerCase() + "\n" +
    "tratamento típico dura 18 a 24 meses\n" +
    "clínicas de plano cobram mensalidade fixa; consultórios, por etapa\n" +
    "consultas de manutenção e aparelhos de contenção entram à parte";
});
</script>
</body>
</html>
