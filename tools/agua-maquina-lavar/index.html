<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantos Litros Gasta uma Máquina de Lavar — Calculadora</title>
<meta name="description" content="Calcule a água que a máquina de lavar consome por mês: litros por ciclo e lavagens por semana. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/agua-maquina-lavar/">
<meta property="og:title" content="Quantos Litros Gasta uma Máquina de Lavar — Calculadora">
<meta property="og:description" content="Litros por ciclo × lavagens: o consumo de água da máquina no mês.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de água da máquina de lavar","url":"https://hashino.github.io/ferramentas/tools/agua-maquina-lavar/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quantos litros gasta uma máquina de lavar."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quantos Litros Gasta uma Máquina de Lavar</h1>
  <section class="app">
<label for="ciclo">Consumo por ciclo</label>
    <select id="ciclo">
      <option value="55">55 L — inverter/econômica</option>
      <option value="80" selected>80 L — máquina comum</option>
      <option value="110">110 L — máquina antiga</option>
    </select>
    <label for="ciclos">Lavagens por semana</label>
    <input type="number" id="ciclos" step="1" min="1" value="4">

    <label for="tarifa">Tarifa de água (R$/m³)</label>
    <input type="number" id="tarifa" step="0.5" min="1" value="7">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var l = Number(document.getElementById("ciclo").value);
  var ciclos = Math.floor(Number(document.getElementById("ciclos").value));
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (ciclos < 1) { saida.textContent = "Informe as lavagens por semana."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d || 0 }); };
  var litrosMes = l * ciclos * 4.3;
  var m3 = litrosMes / 1000;
  var custo = m3 * tarifa;
  saida.textContent = br(litrosMes) + " litros por mês (≈ R$ " + br(custo, 2) + " de água)";
  detalhe.textContent = l + " L por ciclo × " + ciclos + " lavagens/semana × 4,3 semanas = " + br(litrosMes) + " L\n" +
    br(m3, 1) + " m³ × R$ " + br(tarifa, 2) + "/m³ = R$ " + br(custo, 2) + "/mês\n" +
    "juntar roupa para lavar menos vezes economiza mais que qualquer ciclo";
});
</script>
</body>
</html>
