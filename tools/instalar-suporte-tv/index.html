<body data-footer>
<main>
  <h1>Quanto Custa Instalar Suporte de TV</h1>
  <section class="app">
<label for="tv">Tamanho da TV</label>
    <select id="tv">
      <option value="150" selected>Até 55 polegadas — R$ 100 a 200</option>
      <option value="220">65 polegadas ou mais / painel pesado — R$ 150 a 300</option>
    </select>
<label for="parede">Tipo de parede</label>
    <select id="parede">
      <option value="1.0" selected>Alvenaria / tijolo — padrão</option>
      <option value="1.3">Drywall ou gesso — precisa reforço</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o preço de instalar o suporte de TV na parede: tamanho da TV e tipo de parede, com faixa real. Grátis, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../instalar-calha/">Quanto Custa Instalar Calha</a> · <a href="../instalar-aquecedor-gas/">Quanto Custa Instalar Aquecedor a Gas</a> · <a href="../instalar-ventilador-teto/">Quanto Custa Instalar Ventilador de Teto</a></p>
  </details>

<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tv").value);
  var fator = Number(document.getElementById("parede").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med2 = med * fator;
  saida.textContent = "Estimativa: R$ " + brl(med2 * 0.8) + " a R$ " + brl(med2 * 1.35);
  detalhe.textContent = document.getElementById("tv").selectedOptions[0].textContent.split("—")[0].trim() +
    " em " + document.getElementById("parede").selectedOptions[0].textContent.split("—")[0].trim().toLowerCase() + "\n" +
    "o suporte entra à parte (R$ 50 a 150)\n" +
    "esconder a fiação dentro da parede sobe o preço\n" +
    "TV de 65\"+ em drywall exige barras de reforço: não pule essa";
});
</script>
