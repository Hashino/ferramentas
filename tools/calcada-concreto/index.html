<body data-footer>
<main>
  <h1>Quanto Custa Fazer uma Calçada de Concreto</h1>
  <section class="app">
    <label for="area">Área da calçada (m²)</label>
    <input type="number" id="area" step="0.5" min="1" value="20">
<label for="espessura">Espessura</label>
    <select id="espessura">
      <option value="6">6 cm — passeio de residência</option>
      <option value="8" selected>8 cm — padrão recomendado</option>
      <option value="10">10 cm — entrada de carro</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o custo da calçada de concreto: área em m², espessura e sacos de concreto necessários. Grátis, sem cadastro.</p>

<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var area = Number(document.getElementById("area").value);
  var esp = Number(document.getElementById("espessura").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (area <= 0) { saida.textContent = "Informe a área em m²."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var vol = area * esp / 100;
  var sacos = vol * 6;
  var precoM2 = esp === 6 ? 70 : esp === 8 ? 90 : 110;
  var custo = area * precoM2;
  saida.textContent = "≈ " + brl(Math.ceil(sacos)) + " sacos de concreto — R$ " + brl(custo * 0.85) + " a R$ " + brl(custo * 1.2);
  detalhe.textContent = area.toLocaleString("pt-BR") + " m² × " + esp + " cm = " + brl(vol * 1000) + " litros de concreto\n" +
    "≈ " + brl(sacos) + " sacos (6 sacos por m³)\n" +
    "faixa de custo com material e mão de obra (R$ " + precoM2 + "/m² médio)\n" +
    "só o material: divida a faixa por 2";
});
</script>
