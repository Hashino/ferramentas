<meta property="og:title" content="Quanto Custa uma Ressonância — Calculadora">
<meta property="og:description" content="Crânio × coluna × joelho: faixa de preço da ressonância magnética.">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de ressonância magnética","url":"https://hashino.github.io/ferramentas/tools/custo-ressonancia/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa uma ressonância magnética."}

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa uma Ressonancia Magnetica</h1>
  <section class="app">
<label for="tipo">Região do corpo</label>
    <select id="tipo">
      <option value="450">Crânio / encéfalo</option>
      <option value="500" selected>Coluna (cervical ou lombar)</option>
      <option value="450">Joelho / ombro</option>
      <option value="700">Abdome total</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.8);
  detalhe.textContent = "ressonância magnética — " + nome + "\n" +
    "com contraste (medicamento na veia) soma cerca de 40%\n" +
    "pelo SUS é de graça, com fila que pode levar meses\n" +
    "quem tem marca-passo ou prótese metálica deve avisar antes\n" +
    "clínicas com aparelho mais moderno cobram mais";
});
</script>
</body>
</html>
