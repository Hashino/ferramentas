<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Gasta uma Televisão por Mês — Calculadora</title>
<meta name="description" content="Calcule o gasto mensal da TV na conta de luz: tamanho, horas ligada por dia e tarifa da sua região. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/gasto-televisao/">
<meta property="og:title" content="Quanto Gasta uma Televisão por Mês — Calculadora">
<meta property="og:description" content="Tamanho da TV × horas por dia × tarifa: o custo real de assistir.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de Quanto Gasta uma Televisão por Mês","url":"https://hashino.github.io/ferramentas/tools/gasto-televisao/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto gasta uma televisão por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Gasta uma Televisão por Mês</h1>
  <section class="app">
<label for="potencia">Tamanho da TV</label>
    <select id="potencia">
      <option value="55">TV LED 32 polegadas (~55 W)</option>
      <option value="75" selected>TV LED 43 polegadas (~75 W)</option>
      <option value="110">TV LED 55 polegadas (~110 W)</option>
      <option value="140">TV LED 65 polegadas (~140 W)</option>
    </select>
    <label for="horas">Horas ligada por dia</label>
    <input type="number" id="horas" step="0.5" min="0.5" value="5">
    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular gasto</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var w = Number(document.getElementById("potencia").value);
  var h = Number(document.getElementById("horas").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (h <= 0 || tarifa <= 0) { saida.textContent = "Informe as horas por dia e a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = w * h * 30 / 1000;
  var mes = kwhMes * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes);
  detalhe.textContent = w + " W × " + h + " h/dia × 30 dias = " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh/mês\n" +
    "custo: " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh × R$ " + brl(tarifa) + " = R$ " + brl(mes) + "/mês";
});
</script>
</body>
</html>
