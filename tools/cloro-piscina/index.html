<body data-footer>
<main>
  <h1>Quantos Litros de Cloro para Piscina</h1>
  <section class="app">
    <label for="litros">Volume da piscina (litros)</label>
    <input type="number" id="litros" step="500" min="1000" value="30000">
<label for="produto">Cloro granulado</label>
    <select id="produto">
      <option value="2" selected>Manutenção diária — ~2 g por m³</option>
      <option value="15">Choque — ~15 g por m³</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o cloro da piscina: granulado de manutenção e choque pelo volume em litros. Doses por dia e por choque. Grátis.</p>
    <p class="relacionadas">Veja também: <a href="../custo-casamento/">Quanto Custa um Casamento Simples</a> · <a href="../construir-casa/">Quanto Custa Construir uma Casa</a> · <a href="../instalar-piso/">Quanto Custa Instalar Piso</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var litros = Number(document.getElementById("litros").value);
  var gm3 = Number(document.getElementById("produto").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (litros <= 0) { saida.textContent = "Informe o volume em litros."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d || 0 }); };
  var m3 = litros / 1000;
  var dose = m3 * gm3;
  var freq = gm3 === 2 ? " por dia" : " por choque";
  saida.textContent = br(dose) + " g de cloro" + freq;
  detalhe.textContent = br(m3, 1) + " m³ × " + gm3 + " g/m³ = " + br(dose) + " g\n" +
    (gm3 === 2 ? "semana: ≈ " + br(dose * 7) + " g (meio pote de 5 kg)" : "dissolva no balão, ligue a bomba e espere 12 h para entrar") + "\n" +
    "meça o cloro livre com fita test: ideal 1 a 3 ppm";
});
</script>
