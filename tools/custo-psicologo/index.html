<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Psicólogo — Calculadora de Sessões</title>
<meta name="description" content="Calcule o gasto mensal com psicólogo: sessões por mês, presencial, online ou preço social, com faixa real. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/custo-psicologo/">
<meta property="og:title" content="Quanto Custa Psicólogo — Calculadora de Sessões">
<meta property="og:description" content="Sessões/mês × presencial ou online: gasto mensal com terapia.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de psicólogo","url":"https://hashino.github.io/ferramentas/tools/custo-psicologo/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto custa psicólogo por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Psicologo</h1>
  <section class="app">
    <label for="sessoes">Sessões por mês</label>
    <input type="number" id="sessoes" step="1" min="1" value="4">
<label for="tipo">Tipo de atendimento</label>
    <select id="tipo">
      <option value="180">Presencial particular — R$ 120 a 300 por sessão</option>
      <option value="110" selected>Online — R$ 60 a 200 por sessão</option>
      <option value="80">Preço social / clínicas-escola — R$ 50 a 120</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var sess = Math.floor(Number(document.getElementById("sessoes").value));
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (sess < 1) { saida.textContent = "Informe as sessões por mês."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "R$ " + br(sess * med * 0.65) + " a R$ " + br(sess * med * 1.5) + " por mês";
  detalhe.textContent = sess + " sessões/mês, " + nome.toLowerCase() + "\n" +
    "o CFP usa R$ 120 a 200 como referência de honorário\n" +
    "pacote mensal fechado costuma sair mais barato\n" +
    "SUS (CAPS) e universidades públicas atendem de graça";
});
</script>
</body>
</html>
