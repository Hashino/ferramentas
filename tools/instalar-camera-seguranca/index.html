<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Estime o preço da instalação de câmeras: quantidade e tipo (Wi-Fi ou com fio com DVR), com faixa real. Grátis.">

<meta property="og:title" content="Quanto Custa Instalar Câmera de Segurança — Preço">
<meta property="og:description" content="Câmeras × tipo: faixa de preço da instalação de segurança.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de preço de instalação de câmeras","url":"https://hashino.github.io/ferramentas/tools/instalar-camera-seguranca/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa instalar câmera de segurança."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Instalar Camera de Seguranca</h1>
  <section class="app">
    <label for="cameras">Quantas câmeras</label>
    <input type="number" id="cameras" step="1" min="1" value="4">
<label for="tipo">Tipo de câmera</label>
    <select id="tipo">
      <option value="140">Wi-Fi sem fio — ~R$ 100 a 180 por ponto</option>
      <option value="180" selected>Com fio + DVR — ~R$ 150 a 220 por ponto</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("cameras").value));
  var unit = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe a quantidade de câmeras."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * unit;
  saida.textContent = "Estimativa: R$ " + brl(total * 0.8) + " a R$ " + brl(total * 1.3);
  detalhe.textContent = n + " câmera(s), " + document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim().toLowerCase() + "\n" +
    "as câmeras, DVR e HD entram à parte da instalação\n" +
    "passar conduíte e cabeamento externo sobe o preço\n" +
    "configurar celular e gravador costuma entrar no pacote";
});
</script>
</body>
</html>
