<body data-footer>
<main>
  <h1>Quanto Custa Pintar um Quarto</h1>
  <section class="app">
    <label for="m2">Metros quadrados de parede</label>
    <input type="number" id="m2" step="1" min="1" value="35">
<label for="tinta">Tipo de tinta</label>
    <select id="tinta">
      <option value="30">Econômica — ~R$ 30 por litro</option>
      <option value="45" selected>Padrão (acrílica) — ~R$ 45 por litro</option>
      <option value="70">Premium (lavável/acetinada) — ~R$ 70 por litro</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var brl_l = Number(document.getElementById("tinta").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 1) { saida.textContent = "Informe os metros quadrados de parede."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d === undefined ? 0 : d }); };
  var litros = m2 * 2 / 10;
  var custo = litros * brl_l;
  var latas18 = Math.ceil(litros / 18);
  saida.textContent = "≈ " + br(litros, 1) + " L de tinta (" + latas18 + " lata(s) de 18 L) — R$ " + br(custo);
  detalhe.textContent = m2 + " m² × 2 demãos ÷ 10 m²/L = " + br(litros, 1) + " litros\n" +
    "quarto 3×4: paredes ≈ 36 m² menos porta e janela\n" +
    "mão de obra de pintor: R$ 10 a 20 por m², à parte\n" +
    "textura ou massa corrida em paredes danificadas custa mais";
});
</script>
