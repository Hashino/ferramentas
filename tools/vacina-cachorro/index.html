<body data-footer>
<main>
  <h1>Quanto Custa a Vacina do Cachorro</h1>
  <section class="app">
<label for="vac">Vacina</label>
    <select id="vac">
      <option value="100">V8 / múltipla — o básico</option>
      <option value="130" selected>V10 — múltipla com mais proteções</option>
      <option value="60">Antirrábica — obrigatória</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("vac").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("vac").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Dose: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.7) +
    " — ciclo do filhote (3 doses): R$ " + br(med * 3 * 0.6) + " a R$ " + br(med * 3 * 1.7);
  detalhe.textContent = "vacina " + nome.toLowerCase() + "\n" +
    "filhote: 3 doses a partir dos 45 dias + antirrábica\n" +
    "adulto: reforço anual da múltipla e da antirrábica\n" +
    "consulta do veterinário pode entrar à parte na primeira visita";
});
</script>
