<body data-footer>
<main>
  <h1>Quanto Custa Pintar um Portao</h1>
  <section class="app">
<label for="tipo">Tipo de portão</label>
    <select id="tipo">
      <option value="220">Porta social de ferro — R$ 150 a 320</option>
      <option value="450" selected>Portão de garagem — R$ 300 a 650</option>
      <option value="650">Grade ou portão duplo grande — R$ 450 a 900</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o preço da pintura do portão: porta social, portão de garagem ou grade, com lixamento e esmalte. Grátis, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../pintar-cabelo/">Quanto Custa Pintar o Cabelo no Salao</a> · <a href="../pintar-quarto/">Quanto Custa Pintar um Quarto</a> · <a href="../pintar-casa/">Quanto Custa Pintar uma Casa</a></p>
  </details>

<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.75) + " a R$ " + brl(med * 1.4);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "inclui lixamento, fundo anticorrosivo e 2 demãos de esmalte\n" +
    "pintura sobre ferrugem pesada ou textura artesanal custa mais";
});
</script>
