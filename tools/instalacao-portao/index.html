<meta property="og:title" content="Quanto Custa Instalar um Portão Eletrônico — Estimativa">

</head>
<body>
<main>
  <h1>Quanto Custa Instalar um Portão Eletrônico</h1>
  <section class="app">
<label for="tipo">Tipo de portão</label>
    <select id="tipo">
      <option value="1400" selected>Deslizante — kit + instalação R$ 1.100 a 1.900</option>
      <option value="1150">Basculante — kit + instalação R$ 900 a 1.500</option>
      <option value="950">Porta social / batente — R$ 700 a 1.200</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var min = med * 0.78;
  var max = med * 1.35;
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(min) + " a R$ " + brl(max);
  detalhe.textContent = "portão " + nome.toLowerCase() + " motorizado\n" +
    "inclui motor, controle, trilho e mão de obra média 2026\n" +
    "portões acima de 4 m, ou com obra civil, ficam mais caros";
});
</script>
</body>
</html>
