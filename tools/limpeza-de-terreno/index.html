<meta name="description" content="Calcule o custo da limpeza do terreno pelo tamanho, com faixa real de serviços. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/limpeza-de-terreno/">
<meta property="og:title" content="Quanto Custa Limpeza de Terreno — Calculadora">
<meta property="og:description" content="M² × serviço: faixa de preço da limpeza de terreno.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de limpeza de terreno","url":"https://hashino.github.io/ferramentas/tools/limpeza-de-terreno/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa limpeza de terreno."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Limpeza de Terreno</h1>
  <section class="app">
    <label for="m2">Área do terreno (m²)</label>
    <input type="number" id="m2" step="50" min="50" value="300">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 50) { saida.textContent = "Informe a área em m²."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = m2 * 1.5;
  saida.textContent = "Estimativa: R$ " + br(med * 0.55) + " a R$ " + br(med * 2) +
    " (" + m2 + " m² × R$ 0,80 a 3/m²)";
  detalhe.textContent = m2 + " m² de terreno\n" +
    "mato alto, entulho e árvores para derrubar aumentam o preço\n" +
    "a retirada do material entra à parte (ou como caçamba — tem calculadora)\n" +
    "manutenção mensal sai bem mais barato que limpeza pesada\n" +
    "terreno com declive ou acesso ruim encarece a mão de obra";
});
</script>
</body>
</html>
