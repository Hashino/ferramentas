<body data-footer>
<main>
  <h1>Calculadora de Hora Extra Noturna</h1>
  <section class="app">
    <label for="sm">Salário mensal bruto (R$)</label>
    <input type="number" id="sm" step="0.01" min="0" placeholder="ex.: 2200">
    <label for="hn">Horas extras noturnas no mês (horas de relógio)</label>
    <input type="number" id="hn" step="0.5" min="0" placeholder="ex.: 20">
    <label for="pct">Percentual da hora extra</label>
    <select id="pct">
      <option value="50">50% (até 2h extras)</option>
      <option value="100">100% (acima de 2h / acordo)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="passos" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule a hora extra noturna: adicional de 50% ou 100%, adicional noturno de 20% e hora reduzida de 52min30s. Grátis, sem cadastro.</p>
    <p class="relacionadas">Veja também: <a href="../fazer-testamento/">Quanto Custa Fazer um Testamento</a> · <a href="../polimento-automotivo/">Quanto Custa Polimento Automotivo</a> · <a href="../gasto-umidificador/">Quanto Gasta um Umidificador</a></p>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var sm = Number(document.getElementById("sm").value);
  var hn = Number(document.getElementById("hn").value);
  var pct = Number(document.getElementById("pct").value) / 100;
  var saida = document.getElementById("resultado");
  var passos = document.getElementById("passos");
  saida.hidden = false;
  passos.textContent = "";
  if (sm <= 0 || hn <= 0) {
    saida.textContent = "Preencha salário mensal e horas extras noturnas.";
    return;
  }
  var vh = sm / 220;
  var fatorReducao = 60 / 52.5; // hora noturna urbana dura 52min30s
  var horasNoturnas = hn * fatorReducao;
  var valorHoraNoturna = vh * (1 + pct) * 1.2; // HE + adicional noturno de 20%
  var total = valorHoraNoturna * horasNoturnas;
  var brl = function (n) {
    return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  saida.textContent = "Total das horas extras noturnas: R$ " + brl(total);
  passos.textContent =
    "valor da hora: R$ " + brl(vh) + " (salário ÷ 220)\n" +
    "horas noturnas equivalentes: " + horasNoturnas.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " h (" + hn + " h de relógio × 60 ÷ 52,5)\n" +
    "valor da hora extra noturna: R$ " + brl(valorHoraNoturna) + " (hora × " + (pct * 100) + "% + 20% noturno)\n" +
    "total: " + horasNoturnas.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " h × R$ " + brl(valorHoraNoturna);
});
</script>
