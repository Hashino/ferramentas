<main>
  <h1>Quanto Custa Montar um Aquario</h1>
  <section class="app">
<label for="tipo">Tipo de aquário</label>
    <select id="tipo">
      <option value="900">Água doce nano (até 60 L)</option>
      <option value="1500" selected>Água doce 100 L — completo</option>
      <option value="4500">Marinho 100 L — completo</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Montagem completa: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.4);
  detalhe.textContent = "aquário " + nome.toLowerCase() + "\n" +
    "inclui vidro, filtro, termostato, luz, cascalho e peixes iniciais\n" +
    "marinho: sal, rocha viva e teste de parâmetros triplicam o custo\n" +
    "gasto elétrico mensal: veja nossa calculadora de aquário";
});
</script>
