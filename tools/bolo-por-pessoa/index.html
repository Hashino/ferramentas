<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto de Bolo por Pessoa — Calculadora</title>
<meta name="description" content="Calcule quantos quilos de bolo por pessoa: festa com ou sem salgados, com fatias e tamanho da forma. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/bolo-por-pessoa/">
<meta property="og:title" content="Quanto de Bolo por Pessoa — Calculadora">
<meta property="og:description" content="Convidados → kg de bolo e fatias. Com ou sem salgados na festa.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de bolo por pessoa","url":"https://hashino.github.io/ferramentas/tools/bolo-por-pessoa/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto de bolo por pessoa."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto de Bolo por Pessoa</h1>
  <section class="app">
    <label for="pessoas">Convidados</label>
    <input type="number" id="pessoas" step="1" min="1" value="30">
<label for="tipo">Tipo de festa</label>
    <select id="tipo">
      <option value="100" selected>Com salgados — ~100 g por pessoa</option>
      <option value="150">Só bolo — ~150 g por pessoa</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("pessoas").value));
  var gpp = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe o número de convidados."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 1 }); };
  var kg = n * gpp / 1000;
  saida.textContent = brl(kg) + " kg de bolo (" + brl(kg * 1000 / 100) + " fatias de 100 g)";
  detalhe.textContent = n + " convidados × " + gpp + " g = " + brl(kg) + " kg\n" +
    "fatia média de 100 g\n" +
    "se sobrar, bolo de um dia vende ou congela bem; se faltar, ninguém esquece.";
});
</script>
</body>
</html>
