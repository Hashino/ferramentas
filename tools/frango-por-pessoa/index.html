<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantos Pedaços de Frango por Pessoa — Calculadora</title>
<meta name="description" content="Calcule o frango para o almoço: inteiro, filé ou desfiado, pela quantidade de pessoas. Gramas exatas. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/frango-por-pessoa/">
<meta property="og:title" content="Quantos Pedaços de Frango por Pessoa — Calculadora">
<meta property="og:description" content="Pessoas × tipo de corte → quilos de frango para o almoço.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de frango por pessoa","url":"https://hashino.github.io/ferramentas/tools/frango-por-pessoa/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quantos pedaços de frango por pessoa."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quantos Pecos de Frango por Pessoa</h1>
  <section class="app">
    <label for="pessoas">Quantas pessoas</label>
    <input type="number" id="pessoas" step="1" min="1" value="6">
<label for="corte">Tipo de frango</label>
    <select id="corte">
      <option value="inteiro">Frango inteiro — 1 serve 4 pessoas</option>
      <option value="file" selected>Filé — ~150 g por pessoa</option>
      <option value="desfiado">Desfiado — ~90 g por pessoa</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("pessoas").value));
  var corte = document.getElementById("corte").value;
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe o número de pessoas."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d || 0 }); };
  var saidaTxt, detalheTxt;
  if (corte === "inteiro") {
    var frangos = n / 4;
    saidaTxt = br(Math.ceil(frangos)) + " frango(s) inteiro(s)";
    detalheTxt = "1 frango serve 4 pessoas → " + n + " pessoas = " + br(frangos, 1) + " frangos\n" +
      "com acompanhamentos fartos, 1 frango chega a 5 pessoas";
  } else {
    var g = corte === "file" ? 150 : 90;
    var kg = n * g / 1000;
    saidaTxt = br(kg, 2) + " kg de frango";
    detalheTxt = n + " pessoas × " + g + " g = " + br(kg, 2) + " kg\n" +
      (corte === "desfiado" ? "desfiado rende mais: porções menores saciam" : "filé cru; cozido perde ~20% do peso");
  }
  saida.textContent = saidaTxt;
  detalhe.textContent = detalheTxt;
});
</script>
</body>
</html>
