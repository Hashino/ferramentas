<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Ter um Cachorro — Calculadora Mensal</title>
<meta name="description" content="Calcule o custo mensal de ter um cachorro: ração pelo porte, idas ao veterinário e banho. Faixa realista. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/custo-cachorro/">
<meta property="og:title" content="Quanto Custa Ter um Cachorro — Calculadora Mensal">
<meta property="og:description" content="Ração + veterinário + banho pelo porte: o custo mensal do cachorro.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de ter um cachorro","url":"https://hashino.github.io/ferramentas/tools/custo-cachorro/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto custa ter um cachorro por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Ter um Cachorro</h1>
  <section class="app">
<label for="porte">Porte do cachorro</label>
    <select id="porte">
      <option value="p">Pequeno (até 10 kg) — ~4 kg de ração/mês</option>
      <option value="m" selected>Médio (10 a 25 kg) — ~10 kg de ração/mês</option>
      <option value="g">Grande (25 kg ou mais) — ~18 kg de ração/mês</option>
    </select>
    <label for="preco_racao">Preço do kg da ração (R$)</label>
    <input type="number" id="preco_racao" step="0.5" min="2" value="18">
    <label for="vet">Veterinário e vermífugos por mês (R$)</label>
    <input type="number" id="vet" step="10" min="0" value="60">
    <label for="banho">Banho e tosa por mês (R$)</label>
    <input type="number" id="banho" step="10" min="0" value="80">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var racaoKg = {"p": 4, "m": 10, "g": 18}[document.getElementById("porte").value];
  var precoKg = Number(document.getElementById("preco_racao").value);
  var vet = Number(document.getElementById("vet").value) || 0;
  var banho = Number(document.getElementById("banho").value) || 0;
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (precoKg <= 0) { saida.textContent = "Informe o preço do kg da ração."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var racao = racaoKg * precoKg;
  var total = racao + vet + banho;
  saida.textContent = "Custo por mês: R$ " + brl(total) + " (R$ " + brl(total * 12) + " por ano)";
  detalhe.textContent = "ração: " + racaoKg + " kg × R$ " + brl(precoKg) + " = R$ " + brl(racao) + "\n" +
    "veterinário e vermífugos: R$ " + brl(vet) + " · banho e tosa: R$ " + brl(banho) + "\n" +
    "fora disso: vacinas anuais, brinquedos e imprevistos de saúde";
});
</script>
</body>
</html>
