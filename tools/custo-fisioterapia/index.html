<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Fisioterapia — Calculadora de Sessões</title>
<meta name="description" content="Calcule o gasto mensal com fisioterapia: sessões por semana, na clínica ou em domicílio, com faixa real. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/custo-fisioterapia/">
<meta property="og:title" content="Quanto Custa Fisioterapia — Calculadora de Sessões">
<meta property="og:description" content="Sessões/semana × clínica ou domicílio: gasto mensal.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de fisioterapia","url":"https://hashino.github.io/ferramentas/tools/custo-fisioterapia/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa fisioterapia por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Fisioterapia</h1>
  <section class="app">
    <label for="sessoes">Sessões por semana</label>
    <input type="number" id="sessoes" step="1" min="1" value="3">
<label for="tipo">Onde fazer</label>
    <select id="tipo">
      <option value="120" selected>Na clínica — R$ 80 a 180 por sessão</option>
      <option value="180">Domiciliar — R$ 130 a 260 por sessão</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var sess = Math.floor(Number(document.getElementById("sessoes").value));
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (sess < 1) { saida.textContent = "Informe as sessões por semana."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var mes = sess * 4.33 * med;
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "R$ " + br(mes * 0.65) + " a R$ " + br(mes * 1.45) + " por mês";
  detalhe.textContent = sess + " sessões/semana, " + nome.toLowerCase() + "\n" +
    "pacotes de 10 sessões costumam sair 10% a 20% mais barato\n" +
    "planos de saúde cobrem fisioterapia com autorização prévia\n" +
    "tratamento típico dura 8 a 12 semanas";
});
</script>
</body>
</html>
