<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Instalar Piso — Calculadora</title>
<meta name="description" content="Calcule o custo do piso instalado por m²: laminado, vinílico ou porcelanato, com faixa real. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/instalar-piso/">
<meta property="og:title" content="Quanto Custa Instalar Piso — Calculadora">
<meta property="og:description" content="M² × laminado × vinílico × porcelanato: faixa instalada.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de piso instalado por m²","url":"https://hashino.github.io/ferramentas/tools/instalar-piso/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa instalar piso."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Instalar Piso</h1>
  <section class="app">
    <label for="m2">Área (m²)</label>
    <input type="number" id="m2" step="1" min="1" value="30">
<label for="mat">Tipo de piso</label>
    <select id="mat">
      <option value="60">Laminado flutuante</option>
      <option value="90" selected>Vinílico em régua / click</option>
      <option value="130">Porcelanato assentado</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var med = Number(document.getElementById("mat").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 1) { saida.textContent = "Informe a área em m²."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = m2 * med;
  var nome = document.getElementById("mat").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(total * 0.75) + " a R$ " + br(total * 1.4) +
    " (" + m2 + " m² × R$ " + br(med) + "/m² instalado)";
  detalhe.textContent = "piso " + nome + "\n" +
    "inclui material e mão de obra; piso antigo para retirar soma\n" +
    "porcelanato pede rejunte e nivelamento de contrapiso\n" +
    "sobreponha 8% a 10% de área para perdas e recortes\n" +
    "ambientes pequenos têm preço por m² mais alto";
});
</script>
</body>
</html>
