<main>
  <h1>Quantas Doses Tem uma Garrafa de Vodka</h1>
  <section class="app">
<label for="garrafa">Tamanho da garrafa</label>
    <select id="garrafa">
      <option value="375|7.5">375 ml — mini</option>
      <option value="600|12">600 ml</option>
      <option value="750|15" selected>750 ml — padrão</option>
      <option value="1000|20">1 litro</option>
      <option value="1750|35">1,75 L — econômica</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var pv = document.getElementById("garrafa").value.split("|");
  var ml = Number(pv[0]);
  var doses = Number(pv[1]);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  saida.textContent = br(doses) + " doses de 50 ml" +
    (ml >= 1000 ? " (~" + br(doses / 5) + " doses por pessoa numa festa de 5)" : "");
  detalhe.textContent = br(ml) + " ml ÷ 50 ml = " + br(doses) + " doses\n" +
    "com gelo e refrigerante, cada dose rende 1 copo longo\n" +
    "regra de festa: 1 garrafa de 1 L a cada 5 pessoas\n" +
    "dose de bar custa 5 a 10x o custo da dose em casa";
});
</script>
