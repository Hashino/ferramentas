<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
<style>
@media print {
  body * { visibility: hidden; }
  #folha, #folha * { visibility: visible; }
  #folha { position: absolute; top: 0; left: 0; width: 100%; }
}
#folha { font-family: Georgia, "Times New Roman", serif; }
#folha .linha-cal { margin: 0 0 1.1rem; }
#folha .modelo {
  font-size: 1.6rem; color: #b9b9b9; letter-spacing: .12em;
  line-height: 1.9; border-bottom: 2px solid #999; padding-bottom: .15rem;
  min-height: 2.6rem;
}
#folha .linha-livre { border-bottom: 1px dashed #aaa; height: 2.2rem; margin: 0 0 .9rem; }
</style>
</head>
<body>
<main>
  <h1>Gerador de Atividade de Caligrafia</h1>
  <section class="app">
    <label for="texto">Palavra, nome ou frase</label>
    <input type="text" id="texto" placeholder="ex.: Maria Eduarda">
    <label for="linhas">Linhas de treino</label>
    <input type="number" id="linhas" min="4" max="30" value="12">
    <label for="estilo">Estilo da linha</label>
    <select id="estilo">
      <option value="livre" selected>Modelo + linha livre para copiar</option>
      <option value="so-modelo">Só o modelo (palavra em cinza)</option>
      <option value="so-livre">Só linhas livres</option>
    </select>
    <button id="gerar">Gerar folha</button>
    <div id="folha" hidden style="margin-top:1.25rem"></div>
    <button id="imprimir" hidden style="margin-top:1rem">Imprimir</button>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("gerar").addEventListener("click", function () {
  var texto = document.getElementById("texto").value.trim();
  var linhas = Math.min(30, Math.max(4, Math.floor(Number(document.getElementById("linhas").value) || 12)));
  var estilo = document.getElementById("estilo").value;
  var folha = document.getElementById("folha");
  if (!texto) { alert("Informe a palavra ou o nome."); return; }
  folha.innerHTML = "";
  for (var i = 0; i < linhas; i++) {
    if (estilo !== "so-livre") {
      var m = document.createElement("div");
      m.className = "linha-cal modelo";
      m.textContent = texto;
      folha.appendChild(m);
    }
    if (estilo === "livre" || estilo === "so-livre") {
      var l = document.createElement("div");
      l.className = "linha-livre";
      folha.appendChild(l);
    }
  }
  folha.hidden = false;
  document.getElementById("imprimir").hidden = false;
});

document.getElementById("imprimir").addEventListener("click", function () {
  window.print();
});
</script>
</body>
</html>
