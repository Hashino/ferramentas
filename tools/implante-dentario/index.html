<body data-footer>
<main>
  <h1>Quanto Custa um Implante Dentario</h1>
  <section class="app">
    <label for="dentes">Quantos implantes</label>
    <input type="number" id="dentes" step="1" min="1" value="1">
<label for="tipo">O dente precisa de enxerto ósseo?</label>
    <select id="tipo">
      <option value="2800" selected>Não — implante convencional</option>
      <option value="4200">Sim — enxerto + implante</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o preço do implante dentário: quantidade de dentes e necessidade de enxerto, com faixa real de mercado. Grátis.</p>
    <p class="relacionadas">Veja também: <a href="../implante-capilar/">Quanto Custa Implante Capilar</a> · <a href="../custo-mecanico/">Quanto Custa um Mecanico</a> · <a href="../ponto-de-luz/">Quanto Custa um Ponto de Luz</a></p>
  </details>

<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("dentes").value));
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe a quantidade."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * med;
  saida.textContent = n + " implante(s): R$ " + br(total * 0.6) + " a R$ " + br(total * 1.5);
  detalhe.textContent = "por dente: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.5) + "\n" +
    "inclui implante + coroa + cirurgia, em clínica padrão\n" +
    "clínicas de rede parcelam; consultório de professor universitário sai mais barato\n" +
    "protocolo de boca inteira é outro orçamento (R$ 30 mil a 80 mil)";
});
</script>
