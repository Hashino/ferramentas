<meta property="og:title" content="Quanto Custa um Divórcio — Calculadora">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa um Divorcio</h1>
  <section class="app">
<label for="tipo">Tipo de divórcio</label>
    <select id="tipo">
      <option value="2500" selected>Consensual em cartório</option>
      <option value="6000">Judicial consensual</option>
      <option value="15000">Litigioso (com briga)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.9);
  detalhe.textContent = "divórcio " + nome + "\n" +
    "partilha de bens pode custar à parte do divórcio\n" +
    "sem filhos menores e com acordo, o cartório é o caminho mais barato\n" +
    "a justiça gratuita isenta quem comprovar não poder pagar\n" +
    "o advogado é obrigatório no judicial; no cartório também em SP";
});
</script>
</body>
</html>
