<meta property="og:title" content="Quanto Custa Alugar Salão de Festas — Calculadora">

{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de aluguel de salão de festas","url":"https://hashino.github.io/ferramentas/tools/alugar-salao-de-festas/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa alugar salão de festas."}

<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Alugar Salao de Festas</h1>
  <section class="app">
<label for="tipo">Porte do evento</label>
    <select id="tipo">
      <option value="700">Até 50 convidados</option>
      <option value="1300" selected>Até 100 convidados</option>
      <option value="2500">200 convidados ou mais</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Por período: R$ " + br(med * 0.5) + " a R$ " + br(med * 2);
  detalhe.textContent = "salão " + nome + "\n" +
    "caução (sinal) e limpeza pós-festa são comuns no contrato\n" +
    "salões de condomínio custam metade da faixa\n" +
    "som, cozinha e ar-condicionado variam por local — confira\n" +
    "fim de semana e dezembro são mais caros";
});
</script>
</body>
</html>
