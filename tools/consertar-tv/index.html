<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Estime o preço do conserto de TV por defeito: não liga, sem imagem, sem som, com faixa real. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/consertar-tv/">
<meta property="og:title" content="Quanto Custa Consertar TV — Calculadora">
<meta property="og:description" content="Não liga × sem imagem × sem som: faixa de preço do conserto de TV.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de conserto de TV","url":"https://hashino.github.io/ferramentas/tools/consertar-tv/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa consertar TV."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Consertar TV</h1>
  <section class="app">
<label for="tipo">Qual o defeito</label>
    <select id="tipo">
      <option value="300" selected>Não liga (placa de fonte)</option>
      <option value="550">Liga mas sem imagem (backlight)</option>
      <option value="200">Sem som ou sem entrada</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent;
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "defeito: " + nome.toLowerCase() + "\n" +
    "tela de LCD quebrada não compensa: o vidro custa mais que a TV nova\n" +
    "conserto de backlight renovou muitas TVs de 2014 a 2019\n" +
    "TV grande (55 pol ou mais) tem visita e frete mais caros";
});
</script>
</body>
</html>
