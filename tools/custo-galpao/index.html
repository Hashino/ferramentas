<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Construir um Galpão — Calculadora</title>
<meta name="description" content="Calcule o custo do galpão: metros quadrados, estrutura leve pré-fabricada, alvenaria ou industrial, com faixa real. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/custo-galpao/">
<meta property="og:title" content="Quanto Custa Construir um Galpão — Calculadora">
<meta property="og:description" content="M² × padrão de construção: faixa de custo total do galpão.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de galpão","url":"https://hashino.github.io/ferramentas/tools/custo-galpao/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto custa construir um galpão."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Construir um Galpao</h1>
  <section class="app">
    <label for="m2">Metros quadrados do galpão</label>
    <input type="number" id="m2" step="50" min="50" value="300">
<label for="padrao">Padrão de construção</label>
    <select id="padrao">
      <option value="1100" selected>Leve pré-fabricado — estoque simples</option>
      <option value="1500">Alvenaria com estrutura de concreto</option>
      <option value="2200">Industrial pesado — ponte rolante, piso alta resistência</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var med = Number(document.getElementById("padrao").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 50) { saida.textContent = "Informe os metros quadrados."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = m2 * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.8) + " a R$ " + br(total * 1.25);
  detalhe.textContent = m2 + " m² × R$ " + br(med) + "/m² médio\n" +
    "inclui fundação, estrutura, cobertura, fechamento e piso\n" +
    "instalações (elétrica, hidráulica, SPDA) somam de 8% a 15%\n" +
    "terreno, projeto e alvará entram fora da conta";
});
</script>
</body>
</html>
