<meta property="og:title" content="Quanto Custa Alugar Palco — Calculadora">

<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Alugar Palco</h1>
  <section class="app">
<label for="tipo">Tamanho do palco</label>
    <select id="tipo">
      <option value="400" selected>Mini palco (8 m²) — diária</option>
      <option value="1200">Palco médio (24 m²) — diária</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Diária: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.8);
  detalhe.textContent = "palco " + nome.toLowerCase() + "\n" +
    "montagem, desmontagem e frete costumam somar à parte\n" +
    "cobertura e forração de carpete são itens separados\n" +
    "altura padrão: 30 a 60 cm; eventos grandes pedem mais\n" +
    "confirme se a locadora emite ART ou responsabilidade técnica se exigido";
});
</script>
</body>
</html>
