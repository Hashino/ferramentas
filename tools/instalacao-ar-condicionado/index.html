<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Instalar um Ar Condicionado — Estimativa</title>
<meta name="description" content="Estime o custo de instalação do ar-condicionado: tipo e BTU, com faixa de preço 2026. Grátis, sem cadastro, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/instalacao-ar-condicionado/">
<meta property="og:title" content="Quanto Custa Instalar um Ar Condicionado — Estimativa">
<meta property="og:description" content="Tipo × BTU: faixa de preço da instalação do ar-condicionado em 2026.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de custo de instalação de ar-condicionado","url":"https://hashino.github.io/ferramentas/tools/instalacao-ar-condicionado/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa instalar um ar condicionado."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Instalar um Ar Condicionado</h1>
  <section class="app">
<label for="tipo">Tipo de aparelho</label>
    <select id="tipo">
      <option value="janela">Janela — instalação simples</option>
      <option value="hiwall" selected>Split hiwall (parede) — o mais comum</option>
      <option value="cassete">Cassete / piso-teto — forro ou comercial</option>
    </select>
<label for="btu">Capacidade (BTU)</label>
    <select id="btu">
      <option value="9000">9.000 BTU</option>
      <option value="12000" selected>12.000 BTU</option>
      <option value="18000">18.000 BTU</option>
      <option value="24000">24.000 BTU</option>
      <option value="30000">30.000 BTU</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
var BASE = {"janela": 350, "hiwall": 500, "cassete": 900};
var FATOR_BTU = {"9000": 1, "12000": 1.1, "18000": 1.25, "24000": 1.45, "30000": 1.65};
document.getElementById("calcular").addEventListener("click", function () {
  var tipo = document.getElementById("tipo").value;
  var btu = document.getElementById("btu").value;
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var base = BASE[tipo] * FATOR_BTU[btu];
  var min = base * 0.8;
  var max = base * 1.35;
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  saida.textContent = "Estimativa: R$ " + brl(min) + " a R$ " + brl(max);
  detalhe.textContent = "instalação de split " + tipo + " de " + btu + " BTU\n" +
    "inclui suporte, vácuo e testes; tubulação padrão de 3 m\n" +
    "a mais de 3 m de tubo, andares altos ou obra de forro, o preço sobe";
});
</script>
</body>
</html>
