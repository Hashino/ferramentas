document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";

  saida.textContent = "Mensal: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "box de " + nome.toLowerCase() + "\n" +
    "climatizado custa 20% a 30% mais que box comum\n" +
    "cadeado e seguro dos itens costumam ser por conta do cliente\n" +
    "mudança em bloco (guarda móveis com transporte) é alternativa\n" +
    "contratos mensais sem multa são o padrão do setor";
