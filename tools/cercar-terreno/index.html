<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m = Number(document.getElementById("metros").value);
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m < 10) { saida.textContent = "Informe os metros lineares."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = m * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.75) + " a R$ " + br(total * 1.35);
  detalhe.textContent = m + " m × R$ " + br(med) + "/m médio\n" +
    "inclui mourões, material e mão de obra\n" +
    "cerca elétrica em cima da tela sombra adiciona R$ 60 a 120/m\n" +
    "terreno em declive gera desperdício de material: meça o real";
});
