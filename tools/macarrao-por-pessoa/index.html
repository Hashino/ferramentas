</head>
<body>
<main>
  <h1>Quanto de Macarrão por Pessoa</h1>
  <section class="app">
    <label for="pessoas">Quantas pessoas vão comer</label>
    <input type="number" id="pessoas" step="1" min="1" value="4">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("pessoas").value));
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe o número de pessoas."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var cru = 100 * n;
  saida.textContent = brl(cru) + " g de macarrão seco (" + brl(cru * 2.2) + " g prontos)";
  detalhe.textContent = "100 g secos por pessoa × " + n + " pessoa" + (n > 1 ? "s" : "") + " = " + brl(cru) + " g\n" +
    "o macarrão cozido pesa cerca de 2,2× o peso seco\n" +
    "aproximação: 1 kg de massa serve 10 pessoas";
});
</script>
</body>
</html>
