<meta name="description" content="Estime o custo do testamento público em cartório, pelo valor dos bens, com faixa real. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/fazer-testamento/">
<meta property="og:title" content="Quanto Custa Fazer um Testamento — Calculadora">
<meta property="og:description" content="Cartório × tipo: custo estimado para fazer testamento.">
<meta property="og:type" content="website">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Fazer um Testamento</h1>
  <section class="app">
    <label for="bens">Valor aproximado dos bens (R$)</label>
    <input type="number" id="bens" step="10000" min="0" value="200000">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var bens = Number(document.getElementById("bens").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = 1500 + bens * 0.015;
  saida.textContent = "Testamento público: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.6);
  detalhe.textContent = "emolumentos do cartório crescem com o valor dos bens\n" +
    "testamento particular e cerrado custam mais (advogado à parte)\n" +
    "herdeiros necessários recebem metade por lei — testamento cobre a outra\n" +
    "o testamento pode ser alterado ou revogado a qualquer momento\n" +
    "confira a tabela de emolumentos do seu estado";
});
</script>
</body>
</html>
