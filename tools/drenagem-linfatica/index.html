<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Drenagem Linfatica</h1>
  <section class="app">
<label for="tipo">Como fazer</label>
    <select id="tipo">
      <option value="150">Sessão avulsa (1 hora)</option>
      <option value="1200" selected>Pacote de 10 sessões</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.55) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "drenagem linfática — " + nome + "\n" +
    "pós-operatório de cirurgia pede drenagem diária nas primeiras semanas\n" +
    "fisioterapeutas e esteticistas fazem; no pós-cirúrgico, prefira fisio\n" +
    "pressoterapia (aparelho) custa menos que a manual\n" +
    "pacotes têm desconto, mas confira o prazo de validade das sessões";
});
</script>
</body>
</html>
