<body>
<main>
  <h1>Calculadora de Degraus de Escada</h1>
  <section class="app">
    <label for="altura">Altura total a vencer (cm)</label>
    <input type="number" id="altura" step="1" min="1" placeholder="ex.: 280">
    <label for="piso">Piso desejado (cm)</label>
    <input type="number" id="piso" step="0.5" min="20" value="28">
    <button id="calcular">Calcular degraus</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
// Fórmula de Blondel: 2 × espelho + 1 × piso entre 60 e 64 cm (conforto)
document.getElementById("calcular").addEventListener("click", function () {
  var h = Number(document.getElementById("altura").value);
  var piso = Number(document.getElementById("piso").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false;
  detalhe.textContent = "";
  if (h <= 0 || piso < 20) {
    saida.textContent = "Informe a altura total e um piso de pelo menos 20 cm.";
    return;
  }
  var brl = function (n) {
    return n.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  };
  // parte do piso: espelho ideal ≈ (63 − piso) / 2, clamp 16–20 cm
  var espelhoIdeal = (63 - piso) / 2;
  espelhoIdeal = Math.min(20, Math.max(16, espelhoIdeal));
  var n = Math.max(2, Math.round(h / espelhoIdeal));
  var espelho = h / n;
  var blondel = 2 * espelho + piso;
  var conforto = blondel >= 60 && blondel <= 64 ? "dentro da faixa de conforto (60–64 cm)" :
    (blondel < 60 ? "escada confortável, passo mais longo que o usual" : "passo curto: aumente o piso ou reduza o nº de degraus");
  saida.textContent = n + " degraus de " + brl(espelho) + " cm de espelho";
  detalhe.textContent =
    "espelho: " + brl(espelho) + " cm (" + n + " × " + brl(espelho) + " = " + brl(n * espelho) + " cm)\n" +
    "piso: " + brl(piso) + " cm\n" +
    "Blondel: 2 × " + brl(espelho) + " + " + brl(piso) + " = " + brl(blondel) + " cm — " + conforto;
});
</script>
