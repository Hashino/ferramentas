<main>
  <h1>Quanto Custa Tirar CNH</h1>
  <section class="app">
<label for="cat">Categoria</label>
    <select id="cat">
      <option value="2200">A — moto</option>
      <option value="3000" selected>B — carro</option>
      <option value="3600">A + B — carro e moto</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("cat").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("cat").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa total: R$ " + br(med * 0.75) + " a R$ " + br(med * 1.35);
  detalhe.textContent = "primeira habilitação categoria " + nome + "\n" +
    "inclui taxas DETRAN, exames médico e psicotécnico, autoescola e prova\n" +
    "taxas variam por estado: consulte o DETRAN do seu\n" +
    "pagar por aula avulsa e reprovar no exame aumentam o total";
});
</script>
