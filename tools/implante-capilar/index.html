<body>
<main>
  <h1>Quanto Custa Implante Capilar</h1>
  <section class="app">
<label for="tipo">Extensão do transplante</label>
    <select id="tipo">
      <option value="10000">Entradas / têmporas</option>
      <option value="18000" selected>Coroa ou frente completa</option>
      <option value="30000">Reconstrução extensa</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.8);
  detalhe.textContent = "transplante capilar — " + nome + "\n" +
    "o preço acompanha as unidades foliculares transplantadas\n" +
    "FUE e DHI custam mais que a técnica de fita\n" +
    "procure só clínicas com médico dermatologista ou cirurgião à frente\n" +
    "pós-operatório e retoque devem estar no contrato";
});
</script>
