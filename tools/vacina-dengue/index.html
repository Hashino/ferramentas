<head>

<meta name="description" content="Estime o preço da vacina Qdenga na rede privada: por dose ou esquema completo. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/vacina-dengue/">
<meta property="og:title" content="Quanto Custa Vacina da Dengue — Calculadora">
<meta property="og:description" content="Por dose × esquema de 2 doses: faixa de preço da vacina.">
<meta property="og:type" content="website">
<script type="application/ld+json">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Vacina da Dengue</h1>
  <section class="app">
<label for="tipo">Esquema</label>
    <select id="tipo">
      <option value="500">Por dose</option>
      <option value="1000" selected>Esquema completo (2 doses)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.8) + " a R$ " + br(med * 1.3);
  detalhe.textContent = "vacina Qdenga — " + nome + "\n" +
    "as doses são aplicadas com 3 meses de intervalo\n" +
    "indicação atual: 4 a 59 anos, com dengue prévia confirmada\n" +
    "na rede pública a vacinação segue campanha do SUS, de graça\n" +
    "aplicação da dose às vezes entra no preço — confirme ao agendar";
});
</script>
</body>
</html>
