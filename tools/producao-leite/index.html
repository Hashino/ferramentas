<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantos Litros de Leite Produz uma Vaca — Calculadora</title>
<meta name="description" content="Calcule a produção de leite do lote: vacas, litros por dia por raça e a renda com o preço do litro. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/producao-leite/">
<meta property="og:title" content="Quantos Litros de Leite Produz uma Vaca — Calculadora">
<meta property="og:description" content="Vacas × litros/dia por raça → produção mensal e renda bruta.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de produção de leite","url":"https://hashino.github.io/ferramentas/tools/producao-leite/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quantos litros de leite produz uma vaca."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quantos Litros de Leite Produz uma Vaca</h1>
  <section class="app">
    <label for="vacas">Quantas vacas em lactação</label>
    <input type="number" id="vacas" step="1" min="1" value="10">
<label for="raca">Produção por vaca (L/dia)</label>
    <select id="raca">
      <option value="15">Mestiza / meio-sangue — ~15 L/dia</option>
      <option value="20" selected>Girolando — ~20 L/dia</option>
      <option value="28">Holandesa — ~28 L/dia</option>
    </select>
    <label for="preco">Preço do litro (R$)</label>
    <input type="number" id="preco" step="0.1" min="0.5" value="3.2">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var vacas = Math.floor(Number(document.getElementById("vacas").value));
  var l = Number(document.getElementById("raca").value);
  var preco = Number(document.getElementById("preco").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (vacas < 1 || preco <= 0) { saida.textContent = "Informe as vacas e o preço do litro."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d || 0 }); };
  var lDia = vacas * l;
  var lMes = lDia * 30;
  var renda = lMes * preco;
  saida.textContent = br(lMes) + " litros por mês (renda bruta ≈ R$ " + br(renda) + ")";
  detalhe.textContent = vacas + " vacas × " + l + " L/dia = " + br(lDia) + " L/dia\n" +
    "mês: " + br(lMes) + " L × R$ " + br(preco, 2) + " = R$ " + br(renda) + "\n" +
    "renda bruta: descontue ração, sal, veterinário e inseminação";
});
</script>
</body>
</html>
