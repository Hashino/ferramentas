<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Instalar uma Tomada — Estimativa</title>
<meta name="description" content="Estime o preço de instalar tomadas: quantos pontos, simples ou com USB, feita por eletricista. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/instalar-tomada/">
<meta property="og:title" content="Quanto Custa Instalar uma Tomada — Estimativa">
<meta property="og:description" content="Pontos × tipo: faixa de preço da instalação por eletricista.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de custo de instalação de tomada","url":"https://hashino.github.io/ferramentas/tools/instalar-tomada/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa instalar uma tomada."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Instalar uma Tomada</h1>
  <section class="app">
    <label for="pontos">Quantos pontos</label>
    <input type="number" id="pontos" step="1" min="1" value="4">
<label for="tipo">Tipo de tomada</label>
    <select id="tipo">
      <option value="110" selected>Simples 10A — R$ 80 a 150 por ponto</option>
      <option value="180">Com USB / 20A — R$ 130 a 250 por ponto</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var pontos = Math.floor(Number(document.getElementById("pontos").value));
  var unit = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (pontos < 1) { saida.textContent = "Informe o número de pontos."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = pontos * unit;
  saida.textContent = "Estimativa: R$ " + brl(total * 0.75) + " a R$ " + brl(total * 1.35);
  detalhe.textContent = pontos + " ponto(s) × R$ " + brl(unit) + " médio\n" +
    "inclui material básico e mão de obra do eletricista\n" +
    "passar fio por parede de concreto ou obra nova aumenta o preço";
});
</script>
</body>
</html>
