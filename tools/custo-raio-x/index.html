<main>
  <h1>Quanto Custa um Raio-X</h1>
  <section class="app">
<label for="tipo">Tipo de radiografia</label>
    <select id="tipo">
      <option value="80" selected>Tórax ou membros</option>
      <option value="100">Coluna</option>
      <option value="120">Panorâmica dental</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent;
  saida.textContent = "Estimativa: R$ " + br(med * 0.5) + " a R$ " + br(med * 1.9);
  detalhe.textContent = "radiografia " + nome.toLowerCase() + "\n" +
    "clínicas populares fazem raio-X por R$ 45 a 60\n" +
    "pelo SUS e nos UPAs é de graça\n" +
    "o laudo do radiologista deve estar incluso — confirme\n" +
    "leve exames anteriores para comparação";
});
</script>
