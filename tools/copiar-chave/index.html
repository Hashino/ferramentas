<meta name="description" content="Estime o preço da cópia de chave: comum, tecod, com chip de carro ou controle remoto. Faixa por tipo. Grátis, na hora.">

<meta property="og:title" content="Quanto Custa Copiar uma Chave — Estimativa">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Copiar uma Chave</h1>
  <section class="app">
<label for="tipo">Tipo de chave</label>
    <select id="tipo">
      <option value="20" selected>Comum de porta — R$ 12 a 30</option>
      <option value="60">Tecod /-segurança — R$ 40 a 90</option>
      <option value="120">Controle remoto — R$ 70 a 200</option>
      <option value="350">Carro com chip — R$ 150 a 700</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.65) + " a R$ " + brl(med * 1.6);
  detalhe.textContent = "cópia de chave " + nome.toLowerCase() + "\n" +
    "chave de carro com chip exige programação — só em oficinas especializadas\n" +
    "leve o documento do veículo; chaveiros confiáveis sempre pedem";
});
</script>
</body>
</html>
