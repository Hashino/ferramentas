<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Instalar Calha — Calculadora</title>
<meta name="description" content="Calcule o custo de instalar calha: metros lineares e material (PVC, galvanizada ou alumínio), instalada. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/instalar-calha/">
<meta property="og:title" content="Quanto Custa Instalar Calha — Calculadora">
<meta property="og:description" content="Metros × material: faixa de preço da calha instalada.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de instalação de calha","url":"https://hashino.github.io/ferramentas/tools/instalar-calha/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa instalar calha."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Instalar Calha</h1>
  <section class="app">
    <label for="metros">Metros lineares de calha</label>
    <input type="number" id="metros" step="1" min="2" value="20">
<label for="mat">Material</label>
    <select id="mat">
      <option value="60">PVC — leve e barata</option>
      <option value="90" selected>Galvanizada — resistente</option>
      <option value="120">Alumínio — não enferruja</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m = Number(document.getElementById("metros").value);
  var med = Number(document.getElementById("mat").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m < 2) { saida.textContent = "Informe os metros lineares."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = m * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.75) + " a R$ " + br(total * 1.4);
  detalhe.textContent = m + " m × R$ " + br(med) + "/m instalado\n" +
    "inclui calha, rufos e instaladores; condutores verticais à parte\n" +
    "rufo de amarração no beiral soma de 10% a 20%\n" +
    "telhado de duas águas usa menos metros que quatro águas";
});
</script>
</body>
</html>
