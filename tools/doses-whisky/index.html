<body data-footer>
<main>
  <h1>Quantas Doses Tem uma Garrafa de Whisky</h1>
  <section class="app">
<label for="garrafa">Tamanho da garrafa</label>
    <select id="garrafa">
      <option value="50">50 ml — miniatura</option>
      <option value="180">180 ml — pequena</option>
      <option value="700" selected>700 ml — padrão</option>
      <option value="1000">1 litro</option>
      <option value="1750">1,75 L — garrafão</option>
    </select>
<label for="dose">Tamanho da dose</label>
    <select id="dose">
      <option value="40">40 ml — dose curta</option>
      <option value="50" selected>50 ml — dose padrão</option>
      <option value="60">60 ml — dose generosa</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var ml = Number(document.getElementById("garrafa").value);
  var dose = Number(document.getElementById("dose").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d || 0 }); };
  var doses = ml / dose;
  saida.textContent = br(doses, 1) + " doses de " + dose + " ml";
  detalhe.textContent = br(ml) + " ml ÷ " + dose + " ml por dose = " + br(doses, 1) + " doses\n" +
    "garrafa padrão de 700 ml: " + br(700 / 50, 0) + " doses de 50 ml\n" +
    "dose de bar costuma ser 50 ml (uma dose medida)";
});
</script>
