<label for="tipo">Tipo de prótese</label>
    <select id="tipo">
      <option value="800">Removível parcial (arcos com dentes)</option>
      <option value="1500" selected>Dentadura completa</option>

    </select>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.55) + " a R$ " + br(med * 1.9);
  detalhe.textContent = "prótese " + nome.toLowerCase() + "\n" +
    "protocolo fixo exige implantes antes — verifique a calculadora de implante\n" +
    "molde e prova costumam entrar no preço — confirme\n" +
    "clínicas de universidade e SUS fazem prótese por menos\n" +
    "ajustes nos primeiros meses devem estar inclusos";
});
