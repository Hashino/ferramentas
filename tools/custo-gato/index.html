<body data-footer>
<main>
  <h1>Quanto Custa Ter um Gato</h1>
  <section class="app">
    <label for="racao_kg">Ração por mês (kg)</label>
    <input type="number" id="racao_kg" step="0.5" min="0.5" value="2">
    <label for="preco_racao">Preço do kg da ração (R$)</label>
    <input type="number" id="preco_racao" step="0.5" min="2" value="30">
    <label for="areia">Areia sanitária por mês (R$)</label>
    <input type="number" id="areia" step="5" min="0" value="60">
    <label for="vet">Veterinário e vermífugos por mês (R$)</label>
    <input type="number" id="vet" step="10" min="0" value="50">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o custo mensal de ter um gato: ração, areia sanitária e veterinário. Faixa realista por mês e por ano. Grátis.</p>

<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var kg = Number(document.getElementById("racao_kg").value);
  var precoKg = Number(document.getElementById("preco_racao").value);
  var areia = Number(document.getElementById("areia").value) || 0;
  var vet = Number(document.getElementById("vet").value) || 0;
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (kg <= 0 || precoKg <= 0) { saida.textContent = "Informe o consumo e o preço da ração."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var racao = kg * precoKg;
  var total = racao + areia + vet;
  saida.textContent = "Custo por mês: R$ " + brl(total) + " (R$ " + brl(total * 12) + " por ano)";
  detalhe.textContent = "ração: " + kg.toLocaleString("pt-BR") + " kg × R$ " + brl(precoKg) + " = R$ " + brl(racao) + "\n" +
    "areia: R$ " + brl(areia) + " · veterinário: R$ " + brl(vet) + "\n" +
    "fora: vacinas anuais e imprevistos de saúde";
});
</script>
