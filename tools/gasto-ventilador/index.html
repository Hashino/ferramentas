<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Gasta um Ventilador — Calculadora de Conta de Luz</title>
<meta name="description" content="Calcule o custo mensal do ventilador na conta de luz: tipo (mesa, coluna ou teto), horas ligado por dia e tarifa. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/gasto-ventilador/">
<meta property="og:title" content="Quanto Gasta um Ventilador — Calculadora de Conta de Luz">
<meta property="og:description" content="Mesa, coluna ou teto × horas por dia × tarifa: o gasto real do ventilador.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de Quanto Gasta um Ventilador","url":"https://hashino.github.io/ferramentas/tools/gasto-ventilador/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto gasta um ventilador por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Gasta um Ventilador</h1>
  <section class="app">
<label for="potencia">Tipo de ventilador</label>
    <select id="potencia">
      <option value="60">60 W — ventilador de mesa</option>
      <option value="80" selected>80 W — ventilador de coluna</option>
      <option value="120">120 W — ventilador de teto</option>
    </select>
    <label for="horas">Horas ligado por dia</label>
    <input type="number" id="horas" step="0.5" min="0.5" value="8">
    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular gasto</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var w = Number(document.getElementById("potencia").value);
  var h = Number(document.getElementById("horas").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (h <= 0 || tarifa <= 0) { saida.textContent = "Informe as horas por dia e a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = w * h * 30 / 1000;
  var mes = kwhMes * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes);
  detalhe.textContent = w + " W × " + h + " h/dia × 30 dias = " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh/mês\n" +
    kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh × R$ " + brl(tarifa) + " = R$ " + brl(mes) + "/mês";
});
</script>
</body>
</html>
