<body>
<div id="stars"></div><div id="stars2"></div><div id="stars3"></div>
<nav class="top-nav"><div class="nav-container">
  <a class="nav-title" href="../../">Ferramentas</a>
  <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema"></button>
</div></nav>
<main>
  <h1>Calculadora de Bhaskara</h1>
  <section class="app">
    <p style="margin:.2rem 0 1rem;color:var(--muted)">Equação: <strong>ax² + bx + c = 0</strong></p>
    <label for="a">a</label>
    <input type="number" id="a" step="any" placeholder="ex.: 1">
    <label for="b">b</label>
    <input type="number" id="b" step="any" placeholder="ex.: -3">
    <label for="c">c</label>
    <input type="number" id="c" step="any" placeholder="ex.: 2">
    <button id="calcular">Resolver</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="passos" style="margin-top:1rem;font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../ads.js"></script>
<script src="../../theme.js"></script>
<script>
function fmt(n) {
  var r = Math.round(n * 10000) / 10000;
  return String(r);
}

document.getElementById("calcular").addEventListener("click", function () {
  var a = Number(document.getElementById("a").value);
  var b = Number(document.getElementById("b").value);
  var c = Number(document.getElementById("c").value);
  var saida = document.getElementById("resultado");
  var passos = document.getElementById("passos");
  if (!a) {
    saida.hidden = false;
    saida.textContent = "O coeficiente 'a' não pode ser zero (senão não é equação do 2º grau).";
    passos.textContent = "";
    return;
  }
  var delta = b * b - 4 * a * c;
  var txt = "Δ = b² − 4ac = " + fmt(b) + "² − 4·" + fmt(a) + "·" + fmt(c) + " = " + fmt(delta);
  saida.hidden = false;
  if (delta < 0) {
    saida.textContent = "Δ = " + fmt(delta) + " → sem raízes reais";
    txt += "\n\nComo Δ < 0, a equação não tem raízes reais.";
  } else if (delta === 0) {
    var x = -b / (2 * a);
    saida.textContent = "x = " + fmt(x) + " (raiz única, Δ = 0)";
    txt += "\n\nx = −b / 2a = " + fmt(-b) + " / " + fmt(2 * a) + " = " + fmt(x);
  } else {
    var x1 = (-b + Math.sqrt(delta)) / (2 * a);
    var x2 = (-b - Math.sqrt(delta)) / (2 * a);
    saida.textContent = "x₁ = " + fmt(x1) + "   e   x₂ = " + fmt(x2);
    txt += "\n\nx₁ = (−b + √Δ) / 2a = (" + fmt(-b) + " + " + fmt(Math.sqrt(delta)) + ") / " + fmt(2 * a) + " = " + fmt(x1);
    txt += "\nx₂ = (−b − √Δ) / 2a = (" + fmt(-b) + " − " + fmt(Math.sqrt(delta)) + ") / " + fmt(2 * a) + " = " + fmt(x2);
  }
  passos.textContent = txt;
});
</script>
</body>
</html>
