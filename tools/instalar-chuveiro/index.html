<meta property="og:title" content="Quanto Custa Instalar um Chuveiro Elétrico — Estimativa">
<meta property="og:description" content="Troca simples ou instalação nova: a faixa de preço do serviço.">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Instalar um Chuveiro Elétrico</h1>
  <section class="app">
<label for="servico">Tipo de serviço</label>
    <select id="servico">
      <option value="140" selected>Troca de chuveiro (mesmo ponto) — R$ 90 a 200</option>
      <option value="350">Instalação nova (disjuntor + fiação) — R$ 250 a 500</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("servico").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("servico").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.75) + " a R$ " + brl(med * 1.4);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "chuveiro novo não incluído — some o preço do aparelho\n" +
    "fio fino ou disjuntor subdimensionado queimam chuveiro: peça o laudo simples";
});
</script>
</body>
</html>
