<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Gasta um Carregador de Celular — Calculadora</title>
<meta name="description" content="Calcule o gasto mensal do carregador de celular na tomada: potência, horas e quantos aparelhos. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/gasto-carregador/">
<meta property="og:title" content="Quanto Gasta um Carregador de Celular — Calculadora">
<meta property="og:description" content="Potência × horas × aparelhos: quanto custa carregar o celular.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de Gasto do Carregador de Celular","url":"https://hashino.github.io/ferramentas/tools/gasto-carregador/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto gasta um carregador de celular por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Gasta um Carregador de Celular</h1>
  <section class="app">
<label for="potencia">Potência do carregador</label>
    <select id="potencia">
      <option value="5">5 W — carregador simples</option>
      <option value="18" selected>18 W — fast charge</option>
      <option value="25">25 W — turbo</option>
      <option value="65">65 W — notebook/celular (GaN)</option>
    </select>
    <label for="celulares">Quantos carregadores na casa</label>
    <input type="number" id="celulares" step="1" min="1" value="3">
    <label for="horas">Horas na tomada por dia</label>
    <input type="number" id="horas" step="1" min="1" value="8">

    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var w = Number(document.getElementById("potencia").value);
  var qtd = Math.floor(Number(document.getElementById("celulares").value));
  var h = Number(document.getElementById("horas").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (h <= 0 || tarifa <= 0) { saida.textContent = "Informe as horas por dia e a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = w * qtd * h * 30 / 1000;
  var mes = kwhMes * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes) + " para " + qtd + " carregador(es)";
  detalhe.textContent = w + " W × " + qtd + " carregadores × " + h + " h/dia × 30 = " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " kWh/mês\n" +
    "custo: R$ " + brl(mes) + "/mês\n" +
    "carregador sem celular consome bem menos, mas ainda soma — tire da tomada";
});
</script>
</body>
</html>
