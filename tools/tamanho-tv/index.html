<body data-footer>
<main>
  <h1>Calculadora de Tamanho de TV</h1>
  <section class="app">
    <label for="dist">Distância do sofá à TV (metros)</label>
    <input type="number" id="dist" step="0.1" min="0.5" placeholder="ex.: 2.5">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Descubra o tamanho ideal de TV em polegadas pela distância do sofá à tela, para resoluções HD, Full HD e 4K. Grátis, sem cadastro.</p>
    <p class="relacionadas">Veja também: <a href="../trocar-amortecedor/">Quanto Custa Trocar Amortecedor</a> · <a href="../abrir-empresa/">Quanto Custa Abrir uma Empresa</a> · <a href="../blocos-casa/">Quantos Blocos para Construir uma Casa</a></p>
  </details>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
// Regras usuais: distância mínima = diagonal × fator, fator cai com a resolução.
// HD: 2,4 · Full HD: 1,6 · 4K: 1,2 (distância em metros ÷ fator = polegadas máx.)
document.getElementById("calcular").addEventListener("click", function () {
  var m = Number(document.getElementById("dist").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false;
  detalhe.textContent = "";
  if (!m || m < 0.5) {
    saida.textContent = "Informe a distância em metros (mínimo 0,5).";
    return;
  }
  var comuns = [32, 43, 50, 55, 65, 75, 85];
  var max4k = m / 1.2;
  var escolhida = null;
  for (var i = comuns.length - 1; i >= 0; i--) {
    if (comuns[i] <= max4k) { escolhida = comuns[i]; break; }
  }
  if (!escolhida) escolhida = 32;
  saida.textContent = "Tamanho ideal: " + escolhida + "\" (4K, a " + m.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " m)";
  detalhe.textContent =
    "limite pela resolução:\n" +
    "  4K: até " + Math.floor(m / 1.2) + "\"\n" +
    "  Full HD: até " + Math.floor(m / 1.6) + "\"\n" +
    "  HD: até " + Math.floor(m / 2.4) + "\"\n" +
    "tamanhos comerciais que cabem em 4K: " + comuns.filter(function (t) { return t <= max4k; }).join("\", ") + "\"";
});
</script>
