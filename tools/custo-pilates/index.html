<main>
  <h1>Quanto Custa Pilates</h1>
  <section class="app">
<label for="tipo">Formato das aulas</label>
    <select id="tipo">
      <option value="400" selected>Estúdio com equipamentos (mensal)</option>
      <option value="250">Mat pilates na academia (mensal)</option>
      <option value="120">Aula avulsa</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "pilates — " + nome.toLowerCase() + "\n" +
    "turmas pequenas (até 3) em estúdio custam mais que na academia\n" +
    "pilates é fisioterapia quando indicado: planos às vezes cobrem\n" +
    "avalie o número de aulas por semana no pacote\n" +
    "profissional com registro (CREFITO) é obrigatório para fins terapêuticos";
});
</script>
