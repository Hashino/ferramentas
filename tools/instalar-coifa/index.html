<label for="tipo">Tipo de coifa</label>

      <option value="200" selected>Coifa de parede / depurador — R$ 140 a 300</option>
      <option value="650">Coifa de ilha — R$ 450 a 950</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.75) + " a R$ " + brl(med * 1.4);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "coifa de ilha precisa de duto no teto: por isso o preço maior\n" +
    "em cozinha já preparada, a instalação é rápida\n" +
    "a coifa entra à parte — muitas lojas instalam de graça na compra";
});
</script>
