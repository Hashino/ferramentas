<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Construir um Muro — Calculadora</title>
<meta name="description" content="Estime o custo do muro: metros lineares, altura, tijolos e sacos de cimento necessários, com faixa de preço. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/construir-muro/">
<meta property="og:title" content="Quanto Custa Construir um Muro — Calculadora">
<meta property="og:description" content="Metros × altura → tijolos, cimento e faixa de custo do muro.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de muro","url":"https://hashino.github.io/ferramentas/tools/construir-muro/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto custa construir um muro."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Construir um Muro</h1>
  <section class="app">
    <label for="metros">Metros lineares do muro</label>
    <input type="number" id="metros" step="1" min="1" value="20">
<label for="altura">Altura do muro</label>
    <select id="altura">
      <option value="1.8" selected>1,80 m — padrão de quintal</option>
      <option value="2.2">2,20 m — segurança</option>
      <option value="3.0">3,00 m — muro alto / muro de divisa</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m = Number(document.getElementById("metros").value);
  var h = Number(document.getElementById("altura").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m <= 0) { saida.textContent = "Informe os metros lineares."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d || 0 }); };
  var area = m * h;
  var tijolos = area * 76 * 1.1;
  var sacos = area * 0.6;
  var custo = area * 320;
  saida.textContent = "≈ " + br(tijolos) + " tijolos e " + br(sacos) + " sacos de cimento — R$ " + br(custo * 0.85) + " a R$ " + br(custo * 1.25);
  detalhe.textContent = "área de parede: " + br(area, 1) + " m² (" + m + " m × " + h.toLocaleString("pt-BR") + " m)\n" +
    "tijolo baiano (76 un/m² + 10% de perda) e ~0,6 saco/m²\n" +
    "faixa de custo com fundação, reboco e mão de obra — varia por região";
});
</script>
</body>
</html>
