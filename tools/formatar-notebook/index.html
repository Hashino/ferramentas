<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("local").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("local").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "formatação " + (med < 150 ? "na assistência" : "em domicílio") + "\n" +
    "backup dos arquivos é sua responsabilidade — confirme antes\n" +
    "licença do Windows e Office à parte, se precisar\n" +
    "peça atualização de drivers e antivírus no mesmo serviço";
});
