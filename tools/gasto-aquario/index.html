<body data-footer>
<main>
  <h1>Quanto Gasta um Aquário</h1>
  <section class="app">
<label for="tamanho">Tamanho do aquário</label>
    <select id="tamanho">
      <option value="n">Nano / até 60 L — bomba 6 W, aquecedor 50 W, LED 10 W</option>
      <option value="m" selected>Médio (60 a 150 L) — bomba 12 W, aquecedor 100 W, LED 18 W</option>
      <option value="g">Grande (150 L ou mais) — bomba 25 W, aquecedor 200 W, LED 30 W</option>
    </select>
    <label for="horas_led">Horas de luz por dia</label>
    <input type="number" id="horas_led" step="1" min="4" value="8">

    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o gasto mensal do aquário na conta de luz: aquecedor, bomba e luz, pelo tamanho do aquário. Grátis, sem cadastro.</p>
    <p class="relacionadas">Veja também: <a href="../gasto-televisao/">Quanto Gasta uma Televisão por Mês</a> · <a href="../gasto-cafeteira/">Quanto Gasta uma Cafeteira Elétrica</a> · <a href="../gasto-micro-ondas/">Quanto Gasta um Micro-ondas</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
var COMP = {"n": [6, 50, 10], "m": [12, 100, 18], "g": [25, 200, 30]};
document.getElementById("calcular").addEventListener("click", function () {
  var bomW, aqW, ledW;
  var c = COMP[document.getElementById("tamanho").value];
  bomW = c[0]; aqW = c[1]; ledW = c[2];
  var hLed = Number(document.getElementById("horas_led").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (tarifa <= 0) { saida.textContent = "Informe a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhBomba = bomW * 24 * 30 / 1000;
  var kwhAq = aqW * 12 * 30 / 1000;
  var kwhLed = ledW * hLed * 30 / 1000;
  var kwhMes = kwhBomba + kwhAq + kwhLed;
  var mes = kwhMes * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes);
  detalhe.textContent = "bomba " + bomW + " W (24 h): " + kwhBomba.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh\n" +
    "aquecedor " + aqW + " W (~12 h/dia com termostato): " + kwhAq.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh\n" +
    "LED " + ledW + " W × " + hLed + " h: " + kwhLed.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh\n" +
    "total " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh × R$ " + brl(tarifa) + " = R$ " + brl(mes) + "/mês";
});
</script>
</body>
</html>
