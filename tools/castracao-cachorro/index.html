<body data-footer>
<main>
  <h1>Quanto Custa Castrar um Cachorro</h1>
  <section class="app">
<label for="porte">Porte do cachorro</label>
    <select id="porte">
      <option value="350" selected>Pequeno (até 10 kg)</option>
      <option value="500">Médio (10 a 25 kg)</option>
      <option value="700">Grande (25 kg ou mais)</option>
    </select>
<label for="sexo">Sexo</label>
    <select id="sexo">
      <option value="1.0" selected>Macho — cirurgia mais simples</option>
      <option value="1.3">Fêmea — cirurgia mais invasiva</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("porte").value);
  var fator = Number(document.getElementById("sexo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.6);
  detalhe.textContent = "castração, porte " + document.getElementById("porte").selectedOptions[0].textContent.split(" ")[0].trim().toLowerCase() + "\n" +
    "inclui anestesia e cirurgia; colar e remédios somam R$ 50 a 150\n" +
    "prefeituras e ONGs castram de graça ou a baixo custo — procure\n" +
    "exames pré-anestésicos para pets idosos somam à conta";
});
</script>
