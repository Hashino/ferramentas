<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Hotel para Cachorro — Calculadora</title>
<meta name="description" content="Calcule o custo do hotel para cachorro: diária por porte e dias de hospedagem, com faixa real. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/hotel-cachorro/">
<meta property="og:title" content="Quanto Custa Hotel para Cachorro — Calculadora">
<meta property="og:description" content="Porte × dias: faixa de preço da hospedagem pet.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de hotel para cachorro","url":"https://hashino.github.io/ferramentas/tools/hotel-cachorro/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa hotel para cachorro."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Hotel para Cachorro</h1>
  <section class="app">
<label for="porte">Porte do cachorro</label>
    <select id="porte">
      <option value="70">Pequeno (até 10 kg) — ~R$ 45 a 110/dia</option>
      <option value="90" selected>Médio (10 a 25 kg) — ~R$ 60 a 140/dia</option>
      <option value="120">Grande (25 kg ou mais) — ~R$ 80 a 180/dia</option>
    </select>
    <label for="dias">Quantos dias</label>
    <input type="number" id="dias" step="1" min="1" value="7">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var dia = Number(document.getElementById("porte").value);
  var dias = Math.floor(Number(document.getElementById("dias").value));
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (dias < 1) { saida.textContent = "Informe os dias."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = dia * dias;
  saida.textContent = "R$ " + br(med * 0.65) + " a R$ " + br(med * 1.55) +
    " (" + dias + " diárias × R$ " + br(dia) + " médio)";
  detalhe.textContent = document.getElementById("porte").selectedOptions[0].textContent.split("—")[0].trim() + ", " + dias + " dias\n" +
    "feriados e alta temporada ficam no topo da faixa\n" +
    "ração própria costuma dar desconto; banho de volta à parte\n" +
    "exija vacinas em dia — hotel sério pede carteira";
});
</script>
</body>
</html>
