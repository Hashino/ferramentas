<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Construir uma Piscina — Estimativa 2026</title>
<meta name="description" content="Estime o custo de construir uma piscina: tipo (vinil, fibra ou alvenaria) e tamanho em m². Faixa de preço na hora. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/custo-piscina/">
<meta property="og:title" content="Quanto Custa Construir uma Piscina — Estimativa 2026">
<meta property="og:description" content="Tipo × tamanho: faixa de preço estimada da piscina em 2026.">
<meta property="og:type" content="website">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Construir uma Piscina</h1>
  <section class="app">
<label for="tipo">Tipo de piscina</label>
    <select id="tipo">
      <option value="650">Vinil — R$ 500 a 800/m²</option>
      <option value="1000" selected>Fibra — R$ 800 a 1200/m²</option>
      <option value="1600">Alvenaria — R$ 1200 a 2000/m²</option>
    </select>
    <label for="area">Tamanho da piscina (m²)</label>
    <input type="number" id="area" step="1" min="4" value="32">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var area = Number(document.getElementById("area").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (area <= 0) { saida.textContent = "Informe o tamanho em m²."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  var min = area * med * 0.8;
  var max = area * med * 1.25;
  saida.textContent = "Estimativa: R$ " + brl(min) + " a R$ " + brl(max);
  detalhe.textContent = "piscina de " + nome.toLowerCase() + " (" + area.toLocaleString("pt-BR") + " m²)\n" +
    "faixa por m²: R$ " + brl(med * 0.8) + " a R$ " + brl(med * 1.25) + "\n" +
    "estimativa de obra completa (escavação, estrutura, filtragem e acabamento). Valores variam por região e acessória.";
});
</script>
</body>
</html>
