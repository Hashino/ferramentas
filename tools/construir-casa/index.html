<body data-footer>
<main>
  <h1>Quanto Custa Construir uma Casa</h1>
  <section class="app">
    <label for="m2">Área da casa (m²)</label>
    <input type="number" id="m2" step="10" min="20" value="100">
<label for="padrao">Padrão de acabamento</label>
    <select id="padrao">
      <option value="1500">Popular — material simples</option>
      <option value="2200" selected>Médio — piso e bancada melhores</option>
      <option value="3500">Alto — acabamento premium</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o custo de construir a casa pelo tamanho e padrão de acabamento, com faixa real por m². Grátis, na hora.</p>

<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var med = Number(document.getElementById("padrao").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 20) { saida.textContent = "Informe a área em m²."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("padrao").selectedOptions[0].textContent.split("—")[0].trim();
  var total = m2 * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.8) + " a R$ " + br(total * 1.3) +
    " (" + m2 + " m² × R$ " + br(med) + "/m²)";
  detalhe.textContent = "padrão " + nome.toLowerCase() + "\n" +
    "terreno, projeto e taxas da prefeitura entram à parte\n" +
    "capitais e regiões caras passam do topo da faixa\n" +
    "lote em declive e solo ruim aumentam o custo da fundação\n" +
    "reserva 10% do orçamento para imprevistos de obra";
});
</script>
