<meta name="description" content="Estime o preço da animação da festa infantil: horas de recreação e extras como pintura facial, com faixa real. Grátis.">

<meta property="og:title" content="Quanto Custa Animação de Festa Infantil — Calculadora">
<meta property="og:description" content="Horas × recreadores × extras: faixa de preço da animação infantil.">
<meta property="og:type" content="website">

{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de animação de festa infantil","url":"https://hashino.github.io/ferramentas/tools/animacao-festa-infantil/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa animação de festa infantil."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Animacao de Festa Infantil</h1>
  <section class="app">
<label for="horas">Duração da animação</label>
    <select id="horas">
      <option value="600" selected>3 horas — 1 ou 2 recreadores</option>
      <option value="800">4 horas — 2 recreadores</option>
    </select>
<label for="extra">Extras</label>
    <select id="extra">
      <option value="1.0" selected>Só a animação</option>
      <option value="1.3">Pintura facial + bolhas + brincadeiras extras</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("horas").value);
  var fator = Number(document.getElementById("extra").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.7);
  detalhe.textContent = document.getElementById("horas").selectedOptions[0].textContent.split("—")[0].trim() +
    (fator > 1 ? ", com extras" : ", sem extras") + "\n" +
    "mais de 20 crianças pede 3+ recreadores: some à equipe\n" +
    "personagem temático soma R$ 200 a 400\n" +
    "fim de semana e feriado ficam no topo da faixa";
});
</script>
</body>
</html>
