<body data-footer>
<main>
  <h1>Quanto Custa uma Troca de Pneu</h1>
  <section class="app">
    <label for="pneus">Quantos pneus</label>
    <input type="number" id="pneus" step="1" min="1" value="4">
<label for="servico">Serviço por pneu</label>
    <select id="servico">
      <option value="50">Só montagem — ~R$ 35 a 65 por pneu</option>
      <option value="90" selected>Montagem + balanceamento — ~R$ 70 a 110 por pneu</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o preço da troca de pneus: quantidade, só montagem ou montagem com balanceamento. Faixa de preço. Grátis, na hora.</p>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("pneus").value));
  var unit = Number(document.getElementById("servico").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe a quantidade de pneus."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * unit;
  saida.textContent = "Estimativa: R$ " + brl(total * 0.8) + " a R$ " + brl(total * 1.3);
  detalhe.textContent = n + " pneu(s) × R$ " + brl(unit) + " médio\n" +
    "o pneu novo entra à parte\n" +
    "vala de pneu, válvulas e calibragem costumam entrar no pacote";
});
</script>
