<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m = Number(document.getElementById("metros").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m < 4) { saida.textContent = "Informe os metros do perímetro."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = m * 35;
  saida.textContent = "Instalada: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.6) +
    " (" + m + " m × R$ 25 a 55/m)";
  detalhe.textContent = m + " metros de perímetro\n" +
    "inclui central, cabos e instalação; hastes extras em muro alto\n" +
    "sirene e ligação com alarme ou app somam à parte\n" +
    "choque deve ser não letal (norma NBR) — exija certificado\n" +
    "condomínios e empresas pagam mais pelo tamanho da central";
});
</script>
