<main>
  <h1>Quanto Custa um Pedreiro por Dia</h1>
  <section class="app">
<label for="prof">Profissional</label>
    <select id="prof">
      <option value="220" selected>Pedreiro — mão de obra qualificada</option>
      <option value="150">Ajudante / servente</option>
      <option value="300">Empreiteiro (meirinho) — com equipe</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("prof").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("prof").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Diária: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.5);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "capitais ficam no topo da faixa; interior custa menos\n" +
    "material é à parte — combine quem compra\n" +
    "empreitada por m² costuma sair mais barato em serviço grande\n" +
    "peça referências e defina o escopo por escrito";
});
