<body data-footer>
<main>
  <h1>Quanto Custa um Inventario</h1>
  <section class="app">
    <label for="bens">Valor total dos bens (R$)</label>
    <input type="number" id="bens" step="10000" min="1000" value="300000">
<label for="tipo">Tipo de inventário</label>
    <select id="tipo">
      <option value="0.07" selected>Extrajudicial (cartório) — 7% do valor</option>
      <option value="0.1">Judicial — 10% do valor</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o custo do inventário: extrajudicial em cartório ou judicial, pelo valor dos bens. Grátis, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../custo-ressonancia/">Quanto Custa uma Ressonancia Magnetica</a> · <a href="../custo-galpao/">Quanto Custa Construir um Galpao</a> · <a href="../custo-eletrica-casa/">Quanto Custa a Eletrica de uma Casa</a></p>
  </details>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var bens = Number(document.getElementById("bens").value);
  var pct = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (bens < 1000) { saida.textContent = "Informe o valor dos bens."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Custo total estimado: R$ " + br(bens * pct * 0.8) + " a R$ " + br(bens * pct * 1.3) +
    " (" + Math.round(pct * 100) + "% de R$ " + br(bens) + ")";
  detalhe.textContent = "inventário " + nome.toLowerCase() + "\n" +
    "inclui cartório/tributo e advogado — o ITCMD é o maior item\n" +
    "extrajudicial exige herdeiros maiores e acordo, e sai em semanas\n" +
    "sem imóvel e sem conflito, o cartório é sempre mais barato\n" +
    "iniciar até 60 dias após o óbito evita multa do ITCMD";
});
</script>
