<body data-footer>
<main>
  <h1>Quanto Custa uma Procuracao</h1>
  <section class="app">
<label for="tipo">Tipo de procuração</label>
    <select id="tipo">
      <option value="200">Particular (registrada em cartório)</option>
      <option value="400" selected>Por instrumento público (poderes gerais)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o custo da procuração em cartório: particular ou por instrumento público, com faixa real. Grátis, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../custo-creche/">Quanto Custa Creche Particular por Mes</a> · <a href="../custo-contador/">Quanto Custa um Contador</a> · <a href="../custo-uti/">Quanto Custa a UTI por Dia</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.5) + " a R$ " + br(med * 2);
  detalhe.textContent = "procuração " + nome + "\n" +
    "os emolumentos variam por estado — cada tabela de cartório manda\n" +
    "poderes para vender imóvel exigem instrumento público\n" +
    "e-CAC e cartórios digitais emitem com assinatura eletrônica\n" +
    "a procuração pode ser revogada a qualquer momento em cartório";
});
</script>
