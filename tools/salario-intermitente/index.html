<meta property="og:title" content="Como Calcular Salário Intermitente — Calculadora Grátis">
<meta property="og:description" content="Horas trabalhadas × valor da hora acordado: o pagamento do trabalho intermitente em segundos.">

<script type="application/ld+json">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Calculadora de Salário Intermitente</h1>
  <section class="app">
    <label for="vh">Valor da hora acordado (R$)</label>
    <input type="number" id="vh" step="0.01" min="0" placeholder="ex.: 14,00">
    <label for="ht">Horas trabalhadas no mês</label>
    <input type="number" id="ht" step="0.5" min="0" placeholder="ex.: 92">
    <button id="calcular">Calcular pagamento</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var vh = Number(document.getElementById("vh").value);
  var ht = Number(document.getElementById("ht").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false;
  if (vh <= 0 || ht <= 0) {
    saida.textContent = "Preencha o valor da hora e as horas trabalhadas.";
    detalhe.textContent = "";
    return;
  }
  var total = vh * ht;
  saida.textContent = "Pagamento do mês: R$ " + total.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  detalhe.textContent = ht.toLocaleString("pt-BR") + " h × R$ " + vh.toLocaleString("pt-BR", { minimumFractionDigits: 2 }) + "/h";
});
</script>
</body>
</html>
