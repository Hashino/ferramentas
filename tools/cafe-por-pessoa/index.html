<body data-footer>
<main>
  <h1>Quanto de Café por Pessoa</h1>
  <section class="app">
    <label for="pessoas">Quantas pessoas</label>
    <input type="number" id="pessoas" step="1" min="1" value="10">
    <label for="xicaras">Xícaras por pessoa</label>
    <input type="number" id="xicaras" step="1" min="1" value="2">
<label for="forca">Força do café</label>
    <select id="forca">
      <option value="60">Suave — 6 colheres de pó por litro</option>
      <option value="80" selected>Tradicional — 8 colheres por litro</option>
      <option value="100">Forte — 10 colheres por litro</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o café para o grupo: litros, xícaras e colheres de pó pela quantidade de pessoas e xícaras cada uma. Grátis.</p>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("pessoas").value));
  var xic = Math.floor(Number(document.getElementById("xicaras").value)) || 2;
  var gpl = Number(document.getElementById("forca").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe o número de pessoas."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 2 }); };
  var br0 = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var litros = n * xic * 0.1;
  var po = litros * gpl;
  saida.textContent = brl(litros) + " litros de café (" + br0(n * xic) + " xícaras)";
  detalhe.textContent = n + " pessoas × " + xic + " xícaras de 100 ml = " + brl(litros) + " L\n" +
    "pó necessário: ≈ " + br0(po) + " g (" + gpl + " g por litro ≈ " + (gpl / 10) + " colheres de sopa)\n" +
    "1 colher de sopa cheia de café moído ≈ 10 g";
});
</script>
