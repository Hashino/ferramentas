<script>
var G_POR_PESSOA = 90, G_XICARA = 160, FATOR_COZIDO = 2.7;
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("pessoas").value));
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe o número de pessoas."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var cru = G_POR_PESSOA * n;
  var xic = cru / G_XICARA;
  saida.textContent = brl(cru) + " g crus (" + xic.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " xícaras)";
  detalhe.textContent = G_POR_PESSOA + " g por pessoa × " + n + " pessoa" + (n > 1 ? "s" : "") + " = " + brl(cru) + " g crus\n" +
