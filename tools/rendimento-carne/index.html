<body data-footer>
<main>
  <h1>Quanto Rende 1 kg de Carne Cozida</h1>
  <section class="app">
<label for="corte">Tipo de carne</label>
    <select id="corte">
      <option value="72">Patinho / coxão mole — rende ~72%</option>
      <option value="65" selected>Acém / carne de panela — rende ~65%</option>
      <option value="75">Frango desfiado — rende ~75%</option>
      <option value="55">Costela / músculo — rende ~55%</option>
    </select>
    <label for="cru">Carne crua (kg)</label>
    <input type="number" id="cru" step="0.5" min="0.5" value="1">
    <label for="porcao">Porção por pessoa (g)</label>
    <input type="number" id="porcao" step="10" min="50" value="150">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var rend = Number(document.getElementById("corte").value) / 100;
  var cru = Number(document.getElementById("cru").value);
  var porcao = Number(document.getElementById("porcao").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (cru <= 0 || porcao <= 0) { saida.textContent = "Informe o peso cru e a porção."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d === 0 ? 0 : (d || 2) }); };
  var cozida = cru * rend;
  var porcoes = cozida * 1000 / porcao;
  saida.textContent = br(cozida, 2) + " kg de carne cozida (≈ " + br(porcoes, 0) + " porções)";
  detalhe.textContent = br(cru, 2) + " kg crus × " + br(rend * 100, 0) + "% de rendimento = " + br(cozida, 2) + " kg cozidos\n" +
    "porções de " + porcao + " g: ≈ " + br(porcoes, 0) + "\n" +
    "rendimento médio: carne perde água e gordura ao cozinhar";
});
</script>
