<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Consertar um Notebook — Estimativa</title>
<meta name="description" content="Estime o preço do conserto do notebook: tela quebrada, não liga, teclado ou bateria, com faixa real. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/consertar-notebook/">
<meta property="og:title" content="Quanto Custa Consertar um Notebook — Estimativa">
<meta property="og:description" content="Tela × placa × teclado × bateria: faixa de preço do conserto.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de preço de conserto de notebook","url":"https://hashino.github.io/ferramentas/tools/consertar-notebook/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa consertar um notebook."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Consertar um Notebook</h1>
  <section class="app">
<label for="defeito">Qual o problema</label>
    <select id="defeito">
      <option value="500" selected>Tela quebrada ou com linhas</option>
      <option value="500" selected>Não liga — suspeita de placa</option>
      <option value="300">Teclado com tecla falhando</option>
      <option value="350">Bateria viciada / não segura carga</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("defeito").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("defeito").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.8);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "orçamento da assistência costuma ser cobrado se você desistir\n" +
    "conserto de placa acima de R$ 1.000: pesa comprar outro\n" +
    "SSD novo resolve lentidão por menos que conserto";
});
</script>
</body>
</html>
