<body>
<main>
  <h1>Calculadora de Arcano Pessoal</h1>
  <section class="app">
    <label for="dia">Dia de nascimento</label>
    <input type="number" id="dia" min="1" max="31" placeholder="ex.: 25">
    <label for="mes">Mês de nascimento</label>
    <input type="number" id="mes" min="1" max="12" placeholder="ex.: 12">
    <label for="ano">Ano de nascimento</label>
    <input type="number" id="ano" min="1900" max="2100" placeholder="ex.: 1990">
    <button id="calcular">Descobrir meu arcano</button>
    <div class="resultado" id="resultado" hidden></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
var ARCANOS = {1:"O Mago",2:"A Papisa",3:"A Imperatriz",4:"O Imperador",5:"O Hierofante",6:"Os Namorados",7:"O Carro",8:"A Justiça",9:"O Eremita",10:"A Roda da Fortuna",11:"A Força",12:"O Pendurado",13:"A Morte",14:"A Temperança",15:"O Diabo",16:"A Torre",17:"A Estrela",18:"A Lua",19:"O Sol",20:"O Julgamento",21:"O Mundo",22:"O Louco"};

function reduzir(n) {
  while (n > 22) {
    n = String(n).split("").reduce(function (a, d) { return a + Number(d); }, 0);
  }
  return n;
}

document.getElementById("calcular").addEventListener("click", function () {
  var d = Number(document.getElementById("dia").value);
  var m = Number(document.getElementById("mes").value);
  var a = Number(document.getElementById("ano").value);
  var saida = document.getElementById("resultado");
  if (!d || !m || !a || d < 1 || d > 31 || m < 1 || m > 12) {
    saida.hidden = false;
    saida.textContent = "Preencha uma data de nascimento válida.";
    return;
  }
  var soma = d + m + a;
  var arcano = reduzir(soma);
  saida.hidden = false;
  saida.textContent =
    "Seu Arcano Pessoal é o " + arcano + " — " + ARCANOS[arcano] +
    " (soma bruta: " + soma + ")";
});
</script>
</body>
</html>
