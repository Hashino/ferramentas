<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Trocar a Correia Dentada — Estimativa</title>
<meta name="description" content="Estime o preço da troca da correia dentada: só a correia ou kit completo com tensor, por motor. Faixa real. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/troca-correia-dentada/">
<meta property="og:title" content="Quanto Custa Trocar a Correia Dentada — Estimativa">
<meta property="og:description" content="Correia × kit completo × motor: faixa de preço da troca.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de preço de correia dentada","url":"https://hashino.github.io/ferramentas/tools/troca-correia-dentada/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa trocar a correia dentada."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Trocar a Correia Dentada</h1>
  <section class="app">
<label for="kit">O que trocar</label>
    <select id="kit">
      <option value="350">Só a correia dentada</option>
      <option value="700" selected>Kit completo (correia + tensor + polias)</option>
    </select>
<label for="motor">Motor</label>
    <select id="motor">
      <option value="1.0">1.0 — popular (Gol, Onix, HB20)</option>
      <option value="1.3" selected>1.3 a 1.6 — sedãs e SUVs compactos</option>
      <option value="1.6">Turbo / motor grande</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("kit").value);
  var fator = Number(document.getElementById("motor").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + brl(med * 0.75) + " a R$ " + brl(med * 1.4);
  detalhe.textContent = document.getElementById("kit").selectedOptions[0].textContent.toLowerCase() + "\n" +
    "intervalo típico: 40 mil a 60 mil km (veja o manual)\n" +
    "deixar estourar pode entortar válvulas: prejuízo de milhares\n" +
    "se o tensor tem a mesma idade, troque junto";
});
</script>
</body>
</html>
