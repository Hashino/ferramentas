    <label for="m2">Área da fachada (m²)</label>
    <input type="number" id="m2" step="1" min="2" value="20">
<label for="tipo">Acabamento</label>
    <select id="tipo">
      <option value="450">Chapas lisas instaladas</option>
      <option value="650" selected>Com letras caixa ou adesivo</option>
    </select>
    <button id="calcular">Calcular</button>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 2) { saida.textContent = "Informe a área em m²."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  var total = m2 * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.75) + " a R$ " + br(total * 1.4) +
    " (" + m2 + " m² instalados)";
  detalhe.textContent = "fachada em ACM — " + nome + "\n" +
    "altura e andaime para fachadas altas somam à parte\n" +
    "iluminação em led deixa a fachada mais cara\n" +
    "exija chapa original (Alucomaxx, Alcopla) com nota\n" +
    "projeto com registro evita problema com a prefeitura";
});
