<body data-footer>
<main>
  <h1>Quantos Litros Gasta um Banho</h1>
  <section class="app">
    <label for="minutos">Minutos de banho</label>
    <input type="number" id="minutos" step="1" min="1" value="10">
<label for="vazao">Tipo de ducha/chuveiro</label>
    <select id="vazao">
      <option value="3">Chuveiro econômico — ~3 L/min</option>
      <option value="5" selected>Chuveiro comum — ~5 L/min</option>
      <option value="10">Ducha forte — ~10 L/min</option>
    </select>
    <label for="banhos">Banhos por dia na casa</label>
    <input type="number" id="banhos" step="1" min="1" value="3">

    <label for="tarifa">Tarifa de água (R$/m³)</label>
    <input type="number" id="tarifa" step="0.5" min="1" value="7">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule quantos litros de água gasta um banho: minutos, tipo de chuveiro ou ducha e a tarifa de água local. Grátis, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../banho-cachorro/">Quanto Custa um Banho no Cachorro</a> · <a href="../troca-pneu/">Quanto Custa uma Troca de Pneu</a> · <a href="../custo-raio-x/">Quanto Custa um Raio-X</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var min = Number(document.getElementById("minutos").value);
  var v = Number(document.getElementById("vazao").value);
  var banhos = Math.floor(Number(document.getElementById("banhos").value));
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (min <= 0 || banhos < 1) { saida.textContent = "Informe os minutos e os banhos por dia."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d || 0 }); };
  var litrosBanho = min * v;
  var litrosMes = litrosBanho * banhos * 30;
  var m3 = litrosMes / 1000;
  var custo = m3 * tarifa;
  saida.textContent = br(litrosBanho) + " litros por banho (" + br(m3, 1) + " m³/mês na casa)";
  detalhe.textContent = min + " min × " + v + " L/min = " + br(litrosBanho) + " L por banho\n" +
    "mês: " + br(litrosMes) + " L (" + br(m3, 1) + " m³) ≈ R$ " + br(custo, 2) + " de água\n" +
    "cada minuto a menos economiza " + br(v * banhos * 30) + " L por mês";
});
</script>
