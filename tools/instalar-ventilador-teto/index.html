<link rel="stylesheet" href="../../style.css">

<body>
<main>
  <h1>Quanto Custa Instalar Ventilador de Teto</h1>
  <section class="app">
<label for="ponto">Situação do ponto elétrico</label>
    <select id="ponto">
      <option value="150" selected>Ponto elétrico já existe — só pendurar e ligar</option>
      <option value="320">Precisa criar o ponto (fiação + interruptor)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("ponto").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("ponto").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.75) + " a R$ " + brl(med * 1.4);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "controle remoto ou luminária embutida podem subir o preço\n" +
    "teto duplo ou muito alto dificulta: peça orçamento no local\n" +
    "o ventilador entra à parte, não está incluído";
});
</script>
</body>
</html>
