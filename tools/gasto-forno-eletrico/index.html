<body data-footer>
<main>
  <h1>Quanto Gasta um Forno Elétrico</h1>
  <section class="app">
<label for="potencia">Potência do forno</label>
    <select id="potencia">
      <option value="1000">1000 W — forno pequeno</option>
      <option value="1300" selected>1300 W — forno médio</option>
      <option value="1700">1700 W — forno grande</option>
      <option value="2200">2200 W — forno embutido</option>
    </select>
    <label for="minutos">Minutos de uso por dia</label>
    <input type="number" id="minutos" step="5" min="5" value="45">
    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular gasto</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o gasto mensal do forno elétrico na conta de luz: potência e minutos de uso por dia. Grátis, sem cadastro, resultado na hora.</p>

  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var w = Number(document.getElementById("potencia").value);
  var min = Number(document.getElementById("minutos").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (min <= 0 || tarifa <= 0) { saida.textContent = "Informe os minutos por dia e a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = w * min * 30 / 60 / 1000;
  var mes = kwhMes * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes);
  detalhe.textContent = w + " W × " + min + " min/dia × 30 dias ÷ 60 = " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " kWh/mês\n" +
    "custo: " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " kWh × R$ " + brl(tarifa) + " = R$ " + brl(mes) + "/mês";
});
</script>
