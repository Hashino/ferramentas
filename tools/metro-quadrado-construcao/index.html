<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa o Metro Quadrado de Construção — Estimativa</title>
<meta name="description" content="Estime o custo de construir pelo metro quadrado: padrão popular, normal ou alto padrão e área da obra. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/metro-quadrado-construcao/">
<meta property="og:title" content="Quanto Custa o Metro Quadrado de Construção — Estimativa">
<meta property="og:description" content="m² × padrão de acabamento: faixa de custo total da construção.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de custo por metro quadrado de construção","url":"https://hashino.github.io/ferramentas/tools/metro-quadrado-construcao/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa o metro quadrado de construção."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa o Metro Quadrado de Construção</h1>
  <section class="app">
    <label for="area">Área da obra (m²)</label>
    <input type="number" id="area" step="1" min="20" value="100">
<label for="padrao">Padrão de acabamento</label>
    <select id="padrao">
      <option value="1600">Popular — ~R$ 1.600/m²</option>
      <option value="2400" selected>Normal — ~R$ 2.400/m²</option>
      <option value="3500">Alto padrão — ~R$ 3.500/m²</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var area = Number(document.getElementById("area").value);
  var med = Number(document.getElementById("padrao").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (area <= 0) { saida.textContent = "Informe a área da obra em m²."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var min = area * med * 0.85;
  var max = area * med * 1.2;
  saida.textContent = "Estimativa: R$ " + brl(min) + " a R$ " + brl(max);
  detalhe.textContent = area.toLocaleString("pt-BR") + " m² × R$ " + brl(med) + "/m² (médio nacional)\n" +
    "faixa de ±15/20% por região, terreno e acabamento\n" +
    "valores de referência 2026 para obra nova padrão";
});
</script>
</body>
</html>
