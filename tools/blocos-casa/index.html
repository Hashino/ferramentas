<body data-footer>
<main>
  <h1>Quantos Blocos para Construir uma Casa</h1>
  <section class="app">
    <label for="area">Área construída da casa (m²)</label>
    <input type="number" id="area" step="1" min="10" value="70">
<label for="tipo">Tipo de bloco</label>
    <select id="tipo">
      <option value="b14" selected>Bloco de concreto 14×19×39 — 12,5/m²</option>
      <option value="b9">Bloco de concreto 9×19×39 — 12,5/m²</option>
      <option value="ceramico">Bloco cerâmico 19×19×39 — 25/m²</option>
    </select>
    <label for="fator">Fator de parede (m² de parede por m² de casa)</label>
    <input type="number" id="fator" step="0.1" min="1.5" value="2.5">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime quantos blocos de concreto ou cerâmicos para construir uma casa pelo tamanho em m². Grátis, sem cadastro, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../gado-por-hectare/">Quantas Cabeças de Gado por Hectare</a> · <a href="../arcano-pessoal-anual/">Calculadora de Arcano Pessoal Anual</a> · <a href="../cafe-por-pessoa/">Quanto de Café por Pessoa</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
var POR_M2 = {"b14": 12.5, "b9": 12.5, "ceramico": 25};
document.getElementById("calcular").addEventListener("click", function () {
  var area = Number(document.getElementById("area").value);
  var fator = Number(document.getElementById("fator").value) || 2.5;
  var unm2 = POR_M2[document.getElementById("tipo").value];
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (area <= 0) { saida.textContent = "Informe a área construída em m²."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var paredes = area * fator;
  var total = paredes * unm2 * 1.1;
  saida.textContent = "≈ " + brl(Math.ceil(total)) + " blocos";
  detalhe.textContent = area.toLocaleString("pt-BR") + " m² × " + fator.toLocaleString("pt-BR") + " = " +
    brl(paredes) + " m² de parede\n" + brl(paredes) + " m² × " + unm2.toLocaleString("pt-BR") + " un/m² + 10% de perda = " +
    brl(Math.ceil(total)) + "\n" +
    "estimativa típica; o fator varia com pé-direito, quartos e vãos.";
});
</script>
