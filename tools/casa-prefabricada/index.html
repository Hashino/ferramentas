<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa uma Casa Pré-fabricada — Calculadora</title>
<meta name="description" content="Calcule o custo da casa pré-fabricada: madeira, pré-moldada de concreto ou kit wood frame, por m². Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/casa-prefabricada/">
<meta property="og:title" content="Quanto Custa uma Casa Pré-fabricada — Calculadora">
<meta property="og:description" content="M² × sistema (madeira, concreto, wood frame): faixa de custo.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de casa pré-fabricada","url":"https://hashino.github.io/ferramentas/tools/casa-prefabricada/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa uma casa pré-fabricada."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa uma Casa Pre-fabricada</h1>
  <section class="app">
    <label for="m2">Metros quadrados da casa</label>
    <input type="number" id="m2" step="10" min="20" value="70">
<label for="tipo">Sistema construtivo</label>
    <select id="tipo">
      <option value="1300" selected>Pré-fabricada de madeira</option>
      <option value="1500">Pré-moldada de concreto</option>
      <option value="1100">Kit wood frame (você monta com equipe)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 20) { saida.textContent = "Informe os metros quadrados."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = m2 * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.75) + " a R$ " + br(total * 1.3);
  detalhe.textContent = m2 + " m² × R$ " + br(med) + "/m² médio\n" +
    "fora da conta: terreno, fundação, muro e paisagismo\n" +
    "kit só considera a estrutura: mão de obra local à parte\n" +
    "prazo médio de obra: 2 a 4 meses, bem menos que alvenaria";
});
</script>
</body>
</html>
