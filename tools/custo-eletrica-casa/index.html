<body data-footer>
<main>
  <h1>Quanto Custa a Eletrica de uma Casa</h1>
  <section class="app">
    <label for="m2">Metros quadrados da casa</label>
    <input type="number" id="m2" step="5" min="20" value="70">
<label for="tipo">Tipo de serviço</label>
    <select id="tipo">
      <option value="90" selected>Obra nova — elétrica do zero</option>
      <option value="126">Reforma completa — trocar tudo</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 20) { saida.textContent = "Informe os metros quadrados."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = m2 * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.75) + " a R$ " + br(total * 1.35);
  detalhe.textContent = m2 + " m² × R$ " + br(med) + "/m² médio\n" +
    "inclui fiação, quadro, disjuntores e pontos de luz/tomada\n" +
    "padrão novo exige DR e DPS: não economize neles\n" +
    "ar-condicionado, chuveiro eaquecedor pedem circuitos próprios";
});
</script>
