<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Aula Particular — Calculadora Mensal</title>
<meta name="description" content="Calcule o gasto mensal com aula particular: aulas por semana e professor autônomo ou plataforma, com faixa real. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/aula-particular/">
<meta property="og:title" content="Quanto Custa Aula Particular — Calculadora Mensal">
<meta property="og:description" content="Aulas/semana × autônomo × plataforma: gasto mensal.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de aula particular","url":"https://hashino.github.io/ferramentas/tools/aula-particular/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa aula particular por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Aula Particular</h1>
  <section class="app">
    <label for="aulas">Aulas por semana</label>
    <input type="number" id="aulas" step="1" min="1" value="2">
<label for="tipo">Tipo de professor</label>
    <select id="tipo">
      <option value="60" selected>Autônomo direto — R$ 40 a 100 a hora</option>
      <option value="90">Plataforma / agência — R$ 60 a 150 a hora</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var aulas = Math.floor(Number(document.getElementById("aulas").value));
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (aulas < 1) { saida.textContent = "Informe as aulas por semana."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var mes = aulas * 4.33 * med;
  saida.textContent = "R$ " + br(mes * 0.65) + " a R$ " + br(mes * 1.6) + " por mês";
  detalhe.textContent = aulas + " aulas/semana, " + document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim().toLowerCase() + "\n" +
    "aula em domicílio costuma custar 20% a 30% mais\n" +
    "aula em dupla divide o valor por 2\n" +
    "pré-vestibular e idiomas ficam no topo da faixa";
});
</script>
</body>
</html>
