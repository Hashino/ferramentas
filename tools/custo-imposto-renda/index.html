<meta property="og:title" content="Quanto Custa a Declaração de Imposto de Renda — Preço">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa a Declaracao de Imposto de Renda</h1>
  <section class="app">
<label for="tipo">Sua declaração</label>
    <select id="tipo">
      <option value="150" selected>Simples — um emprego, poucas deduções</option>
      <option value="350">Complexa — investimentos, aluguéis, várias fontes</option>
      <option value="100">Retificadora / segunda via</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.6);
  detalhe.textContent = "declaração " + nome.toLowerCase() + "\n" +
    "declarar sozinho no programa da Receita é grátis\n" +
    "o contador cobra pelo serviço e pela conferência\n" +
    "quanto mais informes de rendimento, mais caro e demorado\n" +
    "MEI precisa da DASN-Simei separada, também grátis";
});
</script>
</body>
</html>
