<body data-footer>
<main>
  <h1>Gerador de Nome de Fazenda</h1>
  <section class="app">
    <label for="estilo">Estilo do nome</label>
    <select id="estilo">
      <option value="tradicional" selected>Tradicional</option>
      <option value="engracado">Engraçado</option>
      <option value="games">Para games (Stardew, Minecraft, FS)</option>
      <option value="regional">Rústico / regional</option>
    </select>
    <label for="prefixo">Tipo de propriedade</label>
    <select id="prefixo">
      <option value="aleatorio" selected>Aleatório</option>
      <option value="Fazenda">Fazenda</option>
      <option value="Sítio">Sítio</option>
      <option value="Chácara">Chácara</option>
      <option value="Granja">Granja</option>
      <option value="Rancho">Rancho</option>
    </select>
    <button id="gerar">Gerar nomes</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="lista" style="margin-top:1rem"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Gere nomes de fazenda, sítio ou chácara: tradicional, engraçado ou para games. Sorteio aleatório na hora. Grátis, sem cadastro.</p>

<script>
var NOMES = {
  tradicional: {
    um: ["Boa Esperança", "São João", "Santa Rita", "Bela Vista", "Sol Nascente", "Águas Claras", "Boa Sorte", "Verde Vale", "Paraíso", "Bom Jesus", "Santa Luzia", "Flor do Campo", "Beira Rio", "Alto Alegre", "Nova Aurora", "Bom Retiro", "Santo Antônio", "Bela Aurora", "Cachoeira", "Primavera"],
    dois: ["Boa Vista", "Pé da Serra", "Fim de Tarde", "Lua Cheia", "Céu Aberto", "Rio Fundo", "Morro Alto", "Vale Verde", "Sonho Dourado", "Vento Sul"]
  },
  engracado: {
    um: ["Não É Mais Minha", "Sem Dinheiro", "Quase Próspera", "Última Chance", "Herança de Tio", "Só o Pé", "Fundo de Quintal", "Aposentadoria", "Décimo Terceiro", "Coração de Galinha", "Vaca Véia", "Ovo de Ouro", "Do Jeito Que Dá", "Pé de Manga", "Empenho Feliz"],
    dois: ["Vai Que Vai", "Deixa o Boi Dormir", "Cadê o Lucro", "Rende Mais Que Banco", "Muito Bem Obrigado", "Um Dia Nós Chegamos", "Até Que enfim"]
  },
  games: {
    um: ["Pixel Verde", "Blocos & Colheitas", "Estande de Trigo", "Ilha dos Cogumelos", "Baú Duplo", "Nível Um", "Vale dos Slimes", "Portão de Ferro", "Fardos Saltitantes", "Cobre Antigo", "Aldeia Próxima", "Semente Rara", "Enxada de Diamante", "Celeiro Central", "Lote 42"],
    dois: ["Colheita Infinita", "Onde os PvNs Dormem", "Fila do Minério", "Fazenda do Mago", "Estufa Secreta"]
  },
  regional: {
    um: ["Pé de Serra", "Brejo Velho", "Barreiro", "Grota Funda", "Laje Grande", "Cocais", "Carrapato", "Mata Fome", "Catinga de Mucura", "Volta do Rio", "Covoal", "Olho d'Água", "Serra Branca", "Tabuleiro", "Vargem"],
    dois: ["Casa de Taipa", "Vaqueiro Cansado", "Lua de Agosto", "Boi de Sela", "Farinha Boa", "Casa de Farinha"]
  }
};
var PREFIXOS = ["Fazenda", "Sítio", "Chácara", "Granja", "Rancho"];

document.getElementById("gerar").addEventListener("click", function () {
  var estilo = document.getElementById("estilo").value;
  var pref = document.getElementById("prefixo").value;
  var banco = NOMES[estilo].um.concat(NOMES[estilo].dois);
  var principal = banco[Math.floor(Math.random() * banco.length)];
  var p = pref === "aleatorio" ? PREFIXOS[Math.floor(Math.random() * PREFIXOS.length)] : pref;
  document.getElementById("resultado").hidden = false;
  document.getElementById("resultado").textContent = p + " " + principal;
  var lista = document.getElementById("lista");
  lista.innerHTML = "";
  var usados = [principal];
  for (var i = 0; i < 5; i++) {
    var nome;
    var tentativas = 0;
    do {
      nome = banco[Math.floor(Math.random() * banco.length)];
      tentativas++;
    } while (usados.indexOf(nome) !== -1 && tentativas < 40);
    if (usados.indexOf(nome) !== -1) continue;
    usados.push(nome);
    var p2 = pref === "aleatorio" ? PREFIXOS[Math.floor(Math.random() * PREFIXOS.length)] : pref;
    var div = document.createElement("div");
    div.style.cssText = "padding:.35rem 0;color:var(--muted);font-size:1rem;border-bottom:1px dashed var(--border)";
    div.textContent = p2 + " " + nome;
    lista.appendChild(div);
  }
});
</script>
