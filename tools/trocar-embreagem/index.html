<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Trocar a Embreagem — Calculadora</title>
<meta name="description" content="Estime o preço da troca da embreagem: só disco e placa ou kit completo, por porte do carro, com faixa real. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/trocar-embreagem/">
<meta property="og:title" content="Quanto Custa Trocar a Embreagem — Calculadora">
<meta property="og:description" content="Disco × kit completo × porte: faixa de preço da troca da embreagem.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de troca de embreagem","url":"https://hashino.github.io/ferramentas/tools/trocar-embreagem/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa trocar a embreagem."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Trocar a Embreagem</h1>
  <section class="app">
<label for="kit">O que trocar</label>
    <select id="kit">
      <option value="700">Disco + placa</option>
      <option value="1200" selected>Kit completo (disco, placa, rolamento)</option>
    </select>
<label for="motor">Motor</label>
    <select id="motor">
      <option value="1.0">1.0 — popular</option>
      <option value="1.3" selected>1.3 a 1.6</option>
      <option value="1.6">2.0 ou mais</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("kit").value);
  var fator = Number(document.getElementById("motor").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.5);
  detalhe.textContent = document.getElementById("kit").selectedOptions[0].textContent.toLowerCase() + "\n" +
    "inclui peças e mão de obra (retirada do câmbio)\n" +
    "volante de motor usinado ou novo soma de R$ 300 a 800\n" +
    "embreagem durável: 80 a 150 mil km com bom uso\n" +
    "câmbio automático tem embreagens internas: preço outro";
});
</script>
</body>
</html>
