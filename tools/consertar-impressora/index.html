<meta name="description" content="Estime o preço do conserto de impressora por defeito: papel, cabeçote ou placa, com faixa real. Grátis, na hora.">

<meta property="og:title" content="Quanto Custa Consertar Impressora — Calculadora">
<meta property="og:description" content="Papel × cabeçote × placa: faixa de preço do conserto.">

{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de conserto de impressora","url":"https://hashino.github.io/ferramentas/tools/consertar-impressora/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa consertar impressora."}

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Consertar Impressora</h1>
  <section class="app">
<label for="tipo">Qual o defeito</label>
    <select id="tipo">
      <option value="120" selected>Não pega papel / entalamento</option>
      <option value="180">Manchando ou cabeçote entupido</option>
      <option value="350">Não liga (placa eletrônica)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.9);
  detalhe.textContent = "defeito: " + nome + "\n" +
    "impressora barata (até R$ 400 nova) às vezes não compensa consertar\n" +
    "use tinta original ou de confiança: tinta ruim entope o cabeçote\n" +
    "peça o orçamento por escrito antes de autorizar\n" +
    "multifuncionais a laser têm peças mais caras";
});
</script>
</body>
</html>
