<body data-footer>
<main>
  <h1>Quanto Gasta uma Lâmpada de LED</h1>
  <section class="app">
<label for="tipo">Tipo de lâmpada (mesma luminosidade)</label>
    <select id="tipo">
      <option value="9" selected>LED 9 W</option>
      <option value="15">Fluorescente 15 W</option>
      <option value="27">Halógena 27 W</option>
      <option value="60">Incandescente 60 W</option>
    </select>
    <label for="qtd">Quantas lâmpadas assim na casa</label>
    <input type="number" id="qtd" step="1" min="1" value="6">
    <label for="horas">Horas acesas por dia</label>
    <input type="number" id="horas" step="0.5" min="0.5" value="5">
    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular gasto</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule quanto gasta uma lâmpada de LED (e compare com incandescente) na conta de luz: potência, quantidade e horas por dia. Grátis.</p>
    <p class="relacionadas">Veja também: <a href="../gasto-ventilador/">Quanto Gasta um Ventilador</a> · <a href="../gasto-cafeteira/">Quanto Gasta uma Cafeteira Elétrica</a> · <a href="../gasto-umidificador/">Quanto Gasta um Umidificador</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var w = Number(document.getElementById("tipo").value);
  var qtd = Number(document.getElementById("qtd").value);
  var h = Number(document.getElementById("horas").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (qtd < 1 || h <= 0 || tarifa <= 0) { saida.textContent = "Preencha quantidade, horas e tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = w * qtd * h * 30 / 1000;
  var mes = kwhMes * tarifa;
  var kwhInc = 60 * qtd * h * 30 / 1000;
  var mesInc = kwhInc * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes) + " (LED) — R$ " + brl(mesInc) + " se fossem incandescentes";
  detalhe.textContent = w + " W × " + qtd + " lâmpadas × " + h + " h/dia × 30 = " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh/mês\n" +
    "LED: R$ " + brl(mes) + "/mês · incandescente equivalente: R$ " + brl(mesInc) + "/mês";
});
</script>
