<meta property="og:title" content="Quanto Custa Tratamento de Canal — Calculadora">
<meta property="og:description" content="Incisivo × pré-molar × molar: faixa de preço do canal.">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Tratamento de Canal</h1>
  <section class="app">
<label for="tipo">Qual dente</label>
    <select id="tipo">
      <option value="900">Incisivo (1 raiz)</option>
      <option value="1200" selected>Pré-molar (2 raízes)</option>
      <option value="1500">Molar (3 ou mais raízes)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.9);
  detalhe.textContent = "canal em dente " + nome.toLowerCase() + "\n" +
    "a coroa de proteção depois do canal entra à parte\n" +
    "casos com retratamento ou obliteração custam mais\n" +
    "clínicas populares e faculdades de odontologia cobram menos\n" +
    "levantamento de preço por raiz é a forma usual de orçar";
});
</script>
</body>
</html>
