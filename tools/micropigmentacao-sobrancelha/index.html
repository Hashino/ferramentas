<body>
<main>
  <h1>Quanto Custa Micropigmentacao de Sobrancelha</h1>
  <section class="app">
<label for="tec">Técnica</label>
    <select id="tec">
      <option value="500" selected>Fio a fio</option>
      <option value="450">Shadow / microshading</option>
      <option value="700">Nanoblading</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tec").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tec").selectedOptions[0].textContent;
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.7);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "o retoque de 30 dias deve estar incluso — confirme\n" +
    "dura 1 a 2 anos até o retoque\n" +
    "profissional com biossegurança e registro é imprescindível";
});
</script>
