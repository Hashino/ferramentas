<body data-footer>
<main>
  <h1>Quanto Gasta um Desumidificador</h1>
  <section class="app">
<label for="potencia">Potência do desumidificador</label>
    <select id="potencia">
      <option value="150">150 W — compacto</option>
      <option value="250" selected>250 W — médio</option>
      <option value="350">350 W — grande</option>
    </select>
    <label for="horas">Horas ligado por dia</label>
    <input type="number" id="horas" step="0.5" min="0.5" value="6">

    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o gasto mensal do desumidificador de ar na conta de luz: potência e horas ligado por dia. Grátis, sem cadastro.</p>

  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var w = Number(document.getElementById("potencia").value);
  var h = Number(document.getElementById("horas").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (h <= 0 || tarifa <= 0) { saida.textContent = "Informe as horas por dia e a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = w * h * 30 / 1000;
  var mes = kwhMes * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes);
  detalhe.textContent = w + " W × " + h + " h/dia × 30 dias = " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " kWh/mês\n" +
    "custo: " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " kWh × R$ " + brl(tarifa) + " = R$ " + brl(mes) + "/mês";
});
</script>
