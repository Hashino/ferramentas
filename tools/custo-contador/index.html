<head>
<meta charset="utf-8">

<meta name="description" content="Estime o preço do contador mensal: MEI, Simples Nacional ou Lucro Presumido, com faixa real. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/custo-contador/">
<meta property="og:title" content="Quanto Custa um Contador — Calculadora">
<meta property="og:description" content="MEI × Simples × Presumido: faixa do contador mensal.">
<meta property="og:type" content="website">
<script type="application/ld+json">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa um Contador</h1>
  <section class="app">
<label for="tipo">Regime da empresa</label>
    <select id="tipo">
      <option value="50">MEI</option>
      <option value="250" selected>Simples Nacional (ME/EPP)</option>
      <option value="600">Lucro Presumido</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Mensal: R$ " + br(med * 0.4) + " a R$ " + br(med * 2);
  detalhe.textContent = "contabilidade para " + nome + "\n" +
    "MEI paga só o DAS mensal; muita contabilidade online é grátis\n" +
    "notas fiscais extras e folha de funcionários somam ao valor\n" +
    "abertura de empresa costuma vir grátis ao fechar o mensal\n" +
    "confira se o pacote inclui certificado digital e pró-labore";
});
</script>
</body>
</html>
