<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Desentupir um Vaso — Estimativa</title>
<meta name="description" content="Estime o preço do desentupimento: vaso, pia, ralo ou esgoto, em horário normal ou de emergência. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/desentupir-vaso/">
<meta property="og:title" content="Quanto Custa Desentupir um Vaso — Estimativa">
<meta property="og:description" content="Tipo de entupimento × urgência: a faixa de preço do serviço.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de custo de desentupimento","url":"https://hashino.github.io/ferramentas/tools/desentupir-vaso/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa desentupir um vaso."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Desentupir um Vaso</h1>
  <section class="app">
<label for="tipo">O que está entupido</label>
    <select id="tipo">
      <option value="250" selected>Vaso sanitário — R$ 150 a 400</option>
      <option value="180">Pia ou ralo — R$ 100 a 300</option>
      <option value="350">Esgoto / coluna — R$ 200 a 600</option>
    </select>
<label for="urgencia">Atendimento</label>
    <select id="urgencia">
      <option value="1.0" selected>Horário normal</option>
      <option value="1.7">Emergência (noite/fim de semana)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("tipo").value);
  var fator = Number(document.getElementById("urgencia").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + brl(med * 0.7) + " a R$ " + brl(med * 1.5);
  detalhe.textContent = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim() +
    (fator > 1 ? ", atendimento de emergência" : ", horário normal") + "\n" +
    "desentupidoras sérias cobram por serviço fechado, não por metro\n" +
    "desconfie de orçamento por metro após a visita — é o golpe clássico";
});
</script>
</body>
</html>
