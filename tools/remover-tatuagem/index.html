<meta property="og:title" content="Quanto Custa Remover Tatuagem — Calculadora">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Remover Tatuagem</h1>
  <section class="app">
<label for="tam">Tamanho da tatuagem</label>
    <select id="tam">
      <option value="250">Pequena — até 5 cm</option>
      <option value="400" selected>Média — até 10 cm</option>
      <option value="650">Grande — 20 cm ou mais</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tam").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tam").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Por sessão: R$ " + br(med * 0.55) + " a R$ " + br(med * 1.6) +
    "\nTratamento completo (8 sessões): R$ " + br(med * 8 * 0.6) + " a R$ " + br(med * 8 * 1.5);
  detalhe.textContent = "tatuagem " + nome.toLowerCase() + ", laser por sessão\n" +
    "leva 6 a 12 sessões, com 45 dias entre cada uma\n" +
    "tinta preta sai mais fácil; colorida custa mais\n" +
    "descanso total entre sessões é obrigatório (pele precisa curar)\n" +
    "procure dermatologista ou clínica com equipamento homologado";
});
</script>
</body>
</html>
