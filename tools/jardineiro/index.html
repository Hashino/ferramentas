<body data-footer>
<main>
  <h1>Quanto Custa um Jardineiro</h1>
  <section class="app">
<label for="freq">Frequência</label>
    <select id="freq">
      <option value="avulsa">Diária avulsa</option>
      <option value="semanal">Semanal — 4 diárias por mês</option>
      <option value="quinzenal" selected>Quinzenal — 2 diárias por mês</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o preço do jardineiro: diária avulsa ou manutenção semanal/quinzenal, com faixa real. Grátis, sem cadastro.</p>

  </details>

<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var freq = document.getElementById("freq").value;
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var diaria = 180;
  var txt, nome;
  if (freq === "avulsa") { txt = "R$ " + br(diaria * 0.7) + " a R$ " + br(diaria * 1.5) + " a diária"; nome = "diária avulsa"; }
  else if (freq === "semanal") { txt = "R$ " + br(diaria * 4 * 0.75) + " a R$ " + br(diaria * 4 * 1.4) + " por mês"; nome = "semanal (4 diárias)"; }
  else { txt = "R$ " + br(diaria * 2 * 0.75) + " a R$ " + br(diaria * 2 * 1.4) + " por mês"; nome = "quinzenal (2 diárias)"; }
  saida.textContent = txt;
  detalhe.textContent = "jardinagem — " + nome + "\n" +
    "diária típica de 4 horas inclui poda, capina e adubação leve\n" +
    "grama, mudas e terra são materiais à parte\n" +
    "contrato mensal costuma sair mais barato que avulso";
});
</script>
