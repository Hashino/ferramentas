<meta name="description" content="Estime o preço da revisão do carro: 10 mil, 20 mil ou 40 mil km, com óleo, filtros e mão de obra. Faixa real. Grátis.">

<meta property="og:title" content="Quanto Custa uma Revisão do Carro — Estimativa">
<meta property="og:description" content="Revisão de 10/20/40 mil km: faixa de preço com peças e mão de obra.">

<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa uma Revisao do Carro</h1>
  <section class="app">
<label for="tipo">Tipo de revisão</label>
    <select id="tipo">
      <option value="500" selected>10 mil km — leve (óleo, filtros,check-up)</option>
      <option value="900">20 mil km — completa (óleo, filtros, velas)</option>
      <option value="1400">40 mil km ou mais — pesada (correias, fluidos)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.7) + " a R$ " + brl(med * 1.45);
  detalhe.textContent = "revisão " + nome.toLowerCase() + " — inclui óleo, filtros e mão de obra\n" +
    "concessionária custa 30% a 50% mais que oficina independente\n" +
    "peça de marca premium (óleo sintético, filtro original) sobe a conta\n" +
    "estrica o carro na garantia: revise dentro do prazo do manual";
});
</script>
</body>
</html>
