<link rel="stylesheet" href="../../style.css">
<style>
@media print {
  body * { visibility: hidden; }
  #recibo, #recibo * { visibility: visible; }
  #recibo { position: absolute; top: 0; left: 0; width: 100%; border: none; }
}

<body>
<main>
  <h1>Gerador de Recibo de Salário</h1>
  <section class="app">
    <label for="valor">Valor do pagamento (R$)</label>
    <input type="number" id="valor" step="0.01" min="0" placeholder="ex.: 2200">
    <label for="pagador">Quem paga (nome)</label>
    <input type="text" id="pagador" placeholder="ex.: Maria Souza MEI">
    <label for="cpf1">CPF/CNPJ de quem paga</label>
    <input type="text" id="cpf1" placeholder="ex.: 000.000.000-00">
    <label for="recebedor">Quem recebe (nome)</label>
    <input type="text" id="recebedor" placeholder="ex.: João da Silva">
    <label for="cpf2">CPF/CNPJ de quem recebe</label>
    <input type="text" id="cpf2" placeholder="ex.: 111.111.111-11">
    <label for="ref">Mês de referência</label>
    <input type="text" id="ref" placeholder="ex.: fevereiro de 2026">
    <label for="cidade">Cidade</label>
    <input type="text" id="cidade" placeholder="ex.: São Paulo">
    <button id="gerar">Gerar recibo</button>
    <div id="recibo" hidden style="margin-top:1.5rem;padding:1.25rem;border:1px solid currentColor;border-radius:8px;line-height:1.7;white-space:pre-line"></div>
    <button id="imprimir" hidden style="margin-top:1rem">Imprimir / salvar em PDF</button>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
var U = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
var DZ = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
var CZ = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];

function tres(n) {
  if (n === 100) return "cem";
  var c = Math.floor(n / 100), r = n % 100, p = [];
  if (c) p.push(CZ[c]);
  if (r) p.push(r < 20 ? U[r] : (r % 10 ? DZ[Math.floor(r / 10)] + " e " + U[r % 10] : DZ[Math.floor(r / 10)]));
  return p.join(" e ");
}

function juntar(p) {
  if (p.length <= 1) return p[0] || "";
  return p.slice(0, -1).join(", ") + " e " + p[p.length - 1];
}

function extenso(n) {
  if (n === 0) return "zero";
  var mi = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1e3), rest = n % 1e3, p = [];
  if (mi) p.push(mi === 1 ? "um milhão" : tres(mi) + " milhões");
  if (mil) p.push(mil === 1 ? "mil" : tres(mil) + " mil");
  if (rest) p.push(tres(rest));
  return juntar(p);
}

function valorExtenso(v) {
  var reais = Math.floor(v), cent = Math.round((v - reais) * 100);
  var s = extenso(reais) + (reais === 1 ? " real" : " reais");
  if (cent) s += " e " + extenso(cent) + (cent === 1 ? " centavo" : " centavos");
  return s;
}

document.getElementById("gerar").addEventListener("click", function () {
  var v = Number(document.getElementById("valor").value);
  var pagador = document.getElementById("pagador").value.trim();
  var recebedor = document.getElementById("recebedor").value.trim();
  var cpf1 = document.getElementById("cpf1").value.trim();
  var cpf2 = document.getElementById("cpf2").value.trim();
  var ref = document.getElementById("ref").value.trim();
  var cidade = document.getElementById("cidade").value.trim();
  var recibo = document.getElementById("recibo");
  if (v <= 0 || !pagador || !recebedor) {
    recibo.hidden = false;
    recibo.textContent = "Preencha valor, quem paga e quem recebe.";
    document.getElementById("imprimir").hidden = true;
    return;
  }
  var hoje = new Date().toLocaleDateString("pt-BR");
  var linhas = [
    "RECIBO DE PAGAMENTO DE SALÁRIO",
    "",
    "Recebi de " + pagador + (cpf1 ? " (CPF/CNPJ " + cpf1 + ")" : "") +
      ", a importância de R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) +
      " (" + valorExtenso(v) + ")," +
      (ref ? " referente ao salário de " + ref : " referente a salário") + ".",
    "",
    "Por ser verdade, firmo o presente recibo.",
    "",
    (cidade ? cidade + ", " : "") + hoje,
    "",
    "_________________________________",
    recebedor + (cpf2 ? " — CPF/CNPJ " + cpf2 : "")
  ];
  recibo.hidden = false;
  recibo.textContent = linhas.join("\n");
  document.getElementById("imprimir").hidden = false;
});

document.getElementById("imprimir").addEventListener("click", function () {
  window.print();
});
</script>
</body>
</html>
