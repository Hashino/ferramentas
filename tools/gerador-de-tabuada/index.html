<style>
@media print {
  body * { visibility: hidden; }
  #tabuada, #tabuada * { visibility: visible; }
  #tabuada { position: absolute; top: 0; left: 0; width: 100%; }
}
#tabuada { line-height: 1.9; font-size: 1.05rem; }

<body data-footer>
<main>
  <h1>Gerador de Tabuada</h1>
  <section class="app">
    <label for="num">Número da tabuada</label>
    <input type="number" id="num" step="1" min="0" max="1000" placeholder="ex.: 7">
    <label for="op">Operação</label>
    <select id="op">
      <option value="×">Multiplicação (×)</option>
      <option value="+">Adição (+)</option>
      <option value="−">Subtração (−)</option>
      <option value="÷">Divisão (÷)</option>
    </select>
    <label for="ate">Até quanto</label>
    <input type="number" id="ate" step="1" min="1" max="100" value="10">
    <button id="gerar">Gerar tabuada</button>
    <div id="tabuada" hidden style="margin-top:1.25rem;white-space:pre-line"></div>
    <button id="imprimir" hidden style="margin-top:1rem">Imprimir</button>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Gere a tabuada de qualquer número com as quatro operações: multiplicação, adição, subtração e divisão. Pronta para imprimir. Grátis.</p>
    <p class="relacionadas">Veja também: <a href="../gerador-cartela-bingo/">Gerador de Cartela de Bingo</a> · <a href="../gerador-escala-12x36/">Gerador de Escala de Trabalho</a> · <a href="../gerador-caligrafia/">Gerador de Atividade de Caligrafia</a></p>
  </details>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("gerar").addEventListener("click", function () {
  var n = Number(document.getElementById("num").value);
  var op = document.getElementById("op").value;
  var ate = Number(document.getElementById("ate").value);
  var out = document.getElementById("tabuada");
  var imp = document.getElementById("imprimir");
  if (isNaN(n) || isNaN(ate) || ate < 1 || ate > 100 || document.getElementById("num").value === "") {
    out.hidden = false;
    out.textContent = "Informe um número e o limite da tabuada (1 a 100).";
    imp.hidden = true;
    return;
  }
  var linhas = ["Tabuada do " + n + " (" + op + ")", ""];
  for (var i = 1; i <= ate; i++) {
    if (op === "×") linhas.push(n + " × " + i + " = " + (n * i));
    else if (op === "+") linhas.push(n + " + " + i + " = " + (n + i));
    else if (op === "−") linhas.push(n + " − " + i + " = " + (n - i));
    else linhas.push((n * i) + " ÷ " + n + " = " + i);
  }
  out.hidden = false;
  out.textContent = linhas.join("\n");
  imp.hidden = false;
});

document.getElementById("imprimir").addEventListener("click", function () {
  window.print();
});
</script>
</body>
