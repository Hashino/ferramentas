<script>
document.getElementById("calcular").addEventListener("click", function () {
  var centos = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Por cento: R$ " + br(centos * 0.65) + " a R$ " + br(centos * 1.7) +
    " — a conta usual é 5 a 8 doces por convidado";
  detalhe.textContent = "doces " + nome.toLowerCase() + "\n" +
    "encomende com 15 a 30 dias de antecedência\n" +
    "sabores mais caros (pistache, creme belga) sobem o cento\n" +
    "entrega e caixas decoradas somam à parte\n" +
    "prove antes: muita doceria faz kit degustação barato";
});
