<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Salário Proporcional aos Dias Trabalhados</title>
<meta name="description" content="Salário proporcional aos dias trabalhados: valor por dia e por hora a partir do salário mensal. Grátis, sem cadastro, resultado na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/salario-proporcional/">
<meta property="og:title" content="Calculadora de Salário Proporcional aos Dias Trabalhados">
<meta property="og:description" content="Salário proporcional: por dia trabalhado e por hora, a partir do salário mensal. Grátis.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de Salário Proporcional","url":"https://hashino.github.io/ferramentas/tools/salario-proporcional/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calcula o salário proporcional aos dias trabalhados, e o valor por dia e por hora."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Calculadora de Salário Proporcional</h1>
  <section class="app">
    <label for="sm">Salário mensal (R$)</label>
    <input type="number" id="sm" step="0.01" min="0" placeholder="ex.: 2200">
    <label for="dt">Dias trabalhados no mês</label>
    <input type="number" id="dt" min="1" max="31" placeholder="ex.: 18">
    <label for="hm">Horas trabalhadas no mês (opcional)</label>
    <input type="number" id="hm" step="0.5" min="0" placeholder="ex.: 120">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var sm = Number(document.getElementById("sm").value);
  var dt = Number(document.getElementById("dt").value);
  var hm = Number(document.getElementById("hm").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false;
  detalhe.textContent = "";
  if (sm <= 0 || dt < 1 || dt > 31) {
    saida.textContent = "Preencha salário mensal e dias trabalhados (1–31).";
    return;
  }
  var proporcional = (sm / 30) * dt;
  saida.textContent = "Salário proporcional: R$ " + proporcional.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var linhas = [
    "por dia: R$ " + (sm / 30).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " (mensal ÷ 30)"
  ];
  if (hm > 0) {
    linhas.unshift("por hora: R$ " + (sm / 220 * hm).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " pelas " + hm + " h (valor/hora = mensal ÷ 220)");
  }
  detalhe.textContent = linhas.join(" · ");
});
</script>
</body>
</html>
