<meta property="og:title" content="Quanto Custa Polimento Automotivo — Calculadora">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Polimento Automotivo</h1>
  <section class="app">
<label for="tipo">Tipo de polimento</label>
    <select id="tipo">
      <option value="280">Cristalização / verniz</option>
      <option value="550" selected>Polimento técnico</option>
      <option value="900">Polimento completo com verniz</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent;
  saida.textContent = "Estimativa: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.6);
  detalhe.textContent = "serviço: " + nome.toLowerCase() + "\n" +
    "SUV e picapes pagam 20% a 30% a mais que hatch/sedan\n" +
    "polimento corta verniz: não deve ser feito todo mês\n" +
    "cristalização só cobre riscos leves, não remove\n" +
    "veja fotos de trabalhos anteriores do estúdio";
});
</script>
</body>
</html>
