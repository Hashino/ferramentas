<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Extrair o Siso</h1>
  <section class="app">
<label for="tipo">Situação do dente</label>
    <select id="tipo">
      <option value="500">Nascido (erupcionado) — extração simples</option>
      <option value="900" selected>Incluso / impactado — cirurgia</option>
    </select>
<label for="qtd">Quantos sisos</label>
    <select id="qtd">
      <option value="1" selected>1 dente</option>
      <option value="2">2 dentes</option>
      <option value="4">Os 4 de uma vez</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("tipo").value);
  var qtd = Number(document.getElementById("qtd").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var fator = qtd === 4 ? 2.8 : qtd;
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.6);
  detalhe.textContent = qtd + " dente(s), " + document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim().toLowerCase() + "\n" +
    "tirar os 4 de uma vez sai mais barato por dente\n" +
    "sedação consciente soma R$ 800 a 2.000\n" +
    "rx panorâmico entra à parte (R$ 80 a 200)\n" +
    "incluso em osso horizontal é o caso mais caro";
});
</script>
</body>
</html>
