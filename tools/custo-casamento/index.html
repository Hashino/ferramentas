<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa um Casamento Simples — Calculadora</title>
<meta name="description" content="Calcule o custo do casamento pelo número de convidados: simples, intermediário ou luxo, com faixa real. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/custo-casamento/">
<meta property="og:title" content="Quanto Custa um Casamento Simples — Calculadora">
<meta property="og:description" content="Convidados × perfil: faixa de custo total do casamento.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de casamento","url":"https://hashino.github.io/ferramentas/tools/custo-casamento/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto custa um casamento simples."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa um Casamento Simples</h1>
  <section class="app">
    <label for="convidados">Quantos convidados</label>
    <input type="number" id="convidados" step="10" min="10" value="50">
<label for="perfil">Estilo da festa</label>
    <select id="perfil">
      <option value="180" selected>Simples — buffet simples, dia de semana, quintal</option>
      <option value="350">Intermediário — salão, buffet completo</option>
      <option value="700">Luxo — bufê premium, decoração, banda</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("convidados").value));
  var per = Number(document.getElementById("perfil").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 10) { saida.textContent = "Informe o número de convidados."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * per;
  var nome = document.getElementById("perfil").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Festa: R$ " + br(total * 0.8) + " a R$ " + br(total * 1.25) +
    " (" + br(n) + " convidados × R$ " + br(per) + "/pessoa)";
  detalhe.textContent = "estilo " + nome.toLowerCase() + "\n" +
    "inclui buffet, bebida, bolo e doces\n" +
    "fora da conta: vestido, ternos, álbum, som, decoração, cartório\n" +
    "cerimônia no cartório custa menos de R$ 500 — a festa é o gasto";
});
</script>
</body>
</html>
