<head>

<meta name="description" content="Estime o preço do óculos de grau: lente simples, multifocal ou com armação de grife. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/oculos-de-grau/">
<meta property="og:title" content="Quanto Custa um Óculos de Grau — Calculadora">
<meta property="og:description" content="Lente simples × multifocal × grife: faixa de preço do óculos.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de óculos de grau","url":"https://hashino.github.io/ferramentas/tools/oculos-de-grau/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa um óculos de grau."}

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa um Oculos de Grau</h1>
  <section class="app">
<label for="tipo">Tipo de óculos</label>
    <select id="tipo">
      <option value="400">Completo com lente simples</option>
      <option value="900" selected>Com lente multifocal</option>
      <option value="1500">Armação de grife + multifocal</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.5) + " a R$ " + br(med * 2);
  detalhe.textContent = nome + "\n" +
    "ópticas de Shopping custam mais que óticas de bairro\n" +
    "antirreflexo, filtro azul e AF somam 20% a 50% ao valor\n" +
    "a consulta com oftalmologista tem calculadora própria no site\n" +
    "armação nova em óculos antigo: só as lentes custam metade";
});
</script>
</body>
</html>
