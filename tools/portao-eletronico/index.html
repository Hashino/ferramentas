<meta property="og:title" content="Quanto Custa Instalar Portão Eletrônico — Calculadora">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de portão eletrônico instalado","url":"https://hashino.github.io/ferramentas/tools/portao-eletronico/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa instalar portão eletrônico."}

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Instalar Portao Eletronico</h1>
  <section class="app">
<label for="tipo">Tipo de portão</label>
    <select id="tipo">
      <option value="1400" selected>Deslizante (corre no trilho)</option>
      <option value="1800">Basculante (sobe inteiro)</option>
      <option value="1300">Pivô ou duas folhas</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Motor instalado: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "portão " + nome.toLowerCase() + "\n" +
    "inclui motor, central e controle; o portão físico é à parte\n" +
    "marca reconhecida (Intelbras, PPA, Peccinin) custa mais mas dura\n" +
    "cerca elétrica e fotocélulas somam à parte\n" +
    "confirme se a instalação inclui fiação e tomada";
});
</script>
</body>
</html>
