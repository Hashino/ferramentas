<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa um Ponto de Luz — Calculadora</title>
<meta name="description" content="Estime o preço de instalar ponto de luz: quantidade e tipo de laje ou forro, com fiação e interruptor. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/ponto-de-luz/">
<meta property="og:title" content="Quanto Custa um Ponto de Luz — Calculadora">
<meta property="og:description" content="Pontos × tipo de forro: faixa de preço com fiação.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de preço de ponto de luz","url":"https://hashino.github.io/ferramentas/tools/ponto-de-luz/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa um ponto de luz."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa um Ponto de Luz</h1>
  <section class="app">
    <label for="pontos">Quantos pontos de luz</label>
    <input type="number" id="pontos" step="1" min="1" value="1">
<label for="forro">Tipo de teto / forro</label>
    <select id="forro">
      <option value="150">Forro de gesso ou PVC</option>
      <option value="220" selected>Laje de concreto com fiação embutida</option>
      <option value="280">Concreto aparente ou paredão alto</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("pontos").value));
  var unit = Number(document.getElementById("forro").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe a quantidade de pontos."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * unit;
  saida.textContent = "Estimativa: R$ " + brl(total * 0.75) + " a R$ " + brl(total * 1.35);
  detalhe.textContent = n + " ponto(s), " + document.getElementById("forro").selectedOptions[0].textContent.toLowerCase() + "\n" +
    "inclui fiação, caixa e mão de obra — a luminária entra à parte\n" +
    "fazer tudo de uma vez sai mais barato por ponto\n" +
    "aproveite e peça tomadas junto: o eletricista já está lá";
});
</script>
</body>
</html>
