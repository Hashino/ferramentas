<body data-footer>
<main>
  <h1>Quanto Custa Manter uma Moto por Mes</h1>
  <section class="app">
    <label for="km">Quilômetros por mês</label>
    <input type="number" id="km" step="50" min="50" value="600">
<label for="porte">Porte da moto</label>
    <select id="porte">
      <option value="130|35" selected>Até 160cc (Pop, CG) — fixos ~R$ 130/mês, 35 km/L</option>
      <option value="220|28">200 a 400cc — fixos ~R$ 220/mês, 28 km/L</option>
      <option value="400|20">600cc ou mais — fixos ~R$ 400/mês, 20 km/L</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule a mensalidade da moto: quilometragem, consumo, combustível e custos fixos (IPVA, seguro, óleo). Grátis, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../custo-inventario/">Quanto Custa um Inventario</a> · <a href="../custo-cachorro/">Quanto Custa Ter um Cachorro</a> · <a href="../custo-lipoaspiracao/">Quanto Custa Lipoaspiracao</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var km = Number(document.getElementById("km").value);
  var pv = document.getElementById("porte").value.split("|");
  var fixos = Number(pv[0]);
  var kml = Number(pv[1]);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (km < 50) { saida.textContent = "Informe os quilômetros por mês."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var comb = km / kml * 6.2;
  var total = comb + fixos;
  saida.textContent = "R$ " + br(comb) + " de combustível + R$ " + br(fixos) + " de fixos = ~R$ " + br(total) + "/mês";
  detalhe.textContent = km + " km ÷ " + kml + " km/L × R$ 6,20\n" +
    "fixos incluem IPVA e licenciamento rateados, seguro, óleo e pneu\n" +
    "moto nova: revisões dos primeiros anos somam mais\n" +
    "app de entrega roda 2.000 km/mês: ajuste aí em cima";
});
</script>
