<body data-footer>
<main>
  <h1>Quanto Custa uma Diarista</h1>
  <section class="app">
<label for="tipo">Tipo de faxina</label>
    <select id="tipo">
      <option value="150" selected>Faxina simples (4 a 6 horas)</option>
      <option value="220">Faxina completa com passar roupa (8 horas)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "R$ " + brl(med * 0.8) + " a R$ " + brl(med * 1.35) + " a diária" +
    " — R$ " + brl(med * 4 * 0.8) + " a R$ " + brl(med * 4 * 1.35) + " por mês (1x/semana)";
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "capital grande (SP, Rio) fica no topo da faixa ou acima\n" +
    "faxina pesada (pós-obra, mudança) custa mais\n" +
    "produto de limpeza: combine antes se entra na diária";
});
</script>
