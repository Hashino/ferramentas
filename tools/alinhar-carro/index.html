<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Alinhar o Carro — Estimativa</title>
<meta name="description" content="Estime o preço do alinhamento e balanceamento: carro, SUV ou picape, só alinhamento ou combo completo. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/alinhar-carro/">
<meta property="og:title" content="Quanto Custa Alinhar o Carro — Estimativa">
<meta property="og:description" content="Veículo × serviço: faixa de preço do alinhamento e balanceamento.">
<meta property="og:type" content="website">
<script type="application/ld+json">

</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Alinhar o Carro</h1>
  <section class="app">
<label for="veiculo">Veículo</label>
    <select id="veiculo">
      <option value="170" selected>Carro — combo alinhamento + balanceamento R$ 120 a 240</option>
      <option value="220">SUV — combo R$ 160 a 300</option>
      <option value="250">Picape — combo R$ 180 a 340</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("veiculo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("veiculo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.75) + " a R$ " + brl(med * 1.35);
  detalhe.textContent = nome.toLowerCase() + " — combo alinhamento + balanceamento\n" +
    "só o alinhamento custa ~40% menos\n" +
    "carro puxando para o lado ou pneu comendo de um lado: alinhe já";
});
</script>
</body>
</html>
