<style>
@media print {
  body * { visibility: hidden; }
  #folha, #folha * { visibility: visible; }
  #folha { position: absolute; top: 0; left: 0; width: 100%; }
}
#folha { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
#folha .etiqueta {
  border: 2px dashed currentColor; border-radius: 8px;
  padding: .5rem; text-align: center; break-inside: avoid;
}
#folha .etiqueta .nome { font-weight: 700; font-size: 1rem; word-break: break-word; }
#folha .etiqueta .sub { font-size: .8rem; margin-top: .15rem; word-break: break-word; }
@media (max-width: 500px) { #folha { grid-template-columns: repeat(2, 1fr); } }
</style>

<body data-footer>
<main>
  <h1>Gerador de Etiqueta Escolar</h1>
  <section class="app">
    <label for="nome">Nome do aluno</label>
    <input type="text" id="nome" placeholder="ex.: Maria Oliveira">
    <label for="turma">Turma / ano (opcional)</label>
    <input type="text" id="turma" placeholder="ex.: 3º ano B">
    <label for="extra">Observação (opcional)</label>
    <input type="text" id="extra" placeholder="ex.: tel. (11) 90000-0000">
    <label for="qtd">Quantidade de etiquetas</label>
    <input type="number" id="qtd" min="3" max="60" value="24">
    <button id="gerar">Gerar etiquetas</button>
    <div id="folha" hidden style="margin-top:1.25rem"></div>
    <button id="imprimir" hidden style="margin-top:1rem">Imprimir</button>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Gere etiquetas escolares com nome e turma para colar em cadernos e materiais. Imprima em segundos. Grátis, sem cadastro.</p>
    <p class="relacionadas">Veja também: <a href="../custo-psicologo/">Quanto Custa Psicologo</a> · <a href="../calculadora-blocos/">Quantos Blocos por Metro Quadrado</a> · <a href="../instalar-chuveiro/">Quanto Custa Instalar um Chuveiro Elétrico</a></p>
  </details>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("gerar").addEventListener("click", function () {
  var nome = document.getElementById("nome").value.trim();
  var turma = document.getElementById("turma").value.trim();
  var extra = document.getElementById("extra").value.trim();
  var qtd = Math.min(60, Math.max(3, Math.floor(Number(document.getElementById("qtd").value) || 24)));
  var folha = document.getElementById("folha");
  if (!nome) {
    folha.hidden = true;
    document.getElementById("imprimir").hidden = true;
    alert("Informe o nome do aluno.");
    return;
  }
  folha.innerHTML = "";
  for (var i = 0; i < qtd; i++) {
    var div = document.createElement("div");
    div.className = "etiqueta";
    var nomeEl = document.createElement("div");
    nomeEl.className = "nome";
    nomeEl.textContent = nome;
    div.appendChild(nomeEl);
    var sub = [turma, extra].filter(Boolean).join(" · ");
    if (sub) {
      var subEl = document.createElement("div");
      subEl.className = "sub";
      subEl.textContent = sub;
      div.appendChild(subEl);
    }
    folha.appendChild(div);
  }
  folha.hidden = false;
  document.getElementById("imprimir").hidden = false;
});

document.getElementById("imprimir").addEventListener("click", function () {
  window.print();
});
</script>
</body>
