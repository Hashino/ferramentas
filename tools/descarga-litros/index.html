<body data-footer>
<main>
  <h1>Quantos Litros Gasta uma Descarga</h1>
  <section class="app">
<label for="litros">Tipo de vaso</label>
    <select id="litros">
      <option value="6">6 L — dual flush / moderno</option>
      <option value="10" selected>10 L — caixa acoplada comum</option>
      <option value="12">12 L — válvula antiga</option>
    </select>
    <label for="usos">Descargas por dia na casa</label>
    <input type="number" id="usos" step="1" min="1" value="10">

    <label for="tarifa">Tarifa de água (R$/m³)</label>
    <input type="number" id="tarifa" step="0.5" min="1" value="7">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule a água que o vaso sanitário consome por mês: litros por descarga e acionamentos por dia. Grátis, sem cadastro.</p>
    <p class="relacionadas">Veja também: <a href="../calculadora-degraus/">Calculadora de Degraus de Escada</a> · <a href="../manutencao-piscina/">Quanto Custa Manter uma Piscina</a> · <a href="../inspecao-veicular/">Quanto Custa Inspecao Veicular</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var l = Number(document.getElementById("litros").value);
  var usos = Number(document.getElementById("usos").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (usos < 1) { saida.textContent = "Informe as descargas por dia."; return; }
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d || 0 }); };
  var litrosDia = l * usos;
  var litrosMes = litrosDia * 30;
  var custo = litrosMes / 1000 * tarifa;
  saida.textContent = br(litrosMes) + " litros por mês (≈ R$ " + br(custo, 2) + ")";
  detalhe.textContent = l + " L × " + usos + " descargas/dia = " + br(litrosDia) + " L/dia\n" +
    "mês: " + br(litrosMes) + " L = " + br(litrosMes / 1000, 1) + " m³ × R$ " + br(tarifa, 2) + " = R$ " + br(custo, 2) + "\n" +
    "o vaso sanitário é o maior consumidor de água da casa";
});
</script>
