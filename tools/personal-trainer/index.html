<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa um Personal Trainer — Calculadora</title>
<meta name="description" content="Calcule a mensalidade do personal trainer: sessões por semana, presencial ou online, com faixa de preço real. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/personal-trainer/">
<meta property="og:title" content="Quanto Custa um Personal Trainer — Calculadora">
<meta property="og:description" content="Sessões/semana × presencial ou online: custo mensal do personal.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo do personal trainer","url":"https://hashino.github.io/ferramentas/tools/personal-trainer/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto custa um personal trainer."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa um Personal Trainer</h1>
  <section class="app">
    <label for="sessoes">Sessões por semana</label>
    <input type="number" id="sessoes" step="1" min="1" value="3">
<label for="modo">Modalidade</label>
    <select id="modo">
      <option value="1.0" selected>Presencial — ~R$ 80 a 140 por sessão</option>
      <option value="0.55">Online — ~R$ 45 a 80 por sessão</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var sess = Math.floor(Number(document.getElementById("sessoes").value));
  var modo = Number(document.getElementById("modo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (sess < 1) { saida.textContent = "Informe as sessões por semana."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var mes = sess * 4.33 * 90 * modo;
  saida.textContent = "R$ " + brl(mes * 0.7) + " a R$ " + brl(mes * 1.5) + " por mês";
  detalhe.textContent = sess + " sessões/semana, " + document.getElementById("modo").selectedOptions[0].textContent.split("—")[0].trim().toLowerCase() + "\n" +
    "pacote mensal fechado costuma sair 10% a 20% mais barato\n" +
    "domicílio ou treino em dupla mudam o preço por sessão\n" +
    "no Rio e em SP os valores ficam acima da média";
});
</script>
</body>
</html>
