<meta property="og:title" content="Quanto Custa Adestrar um Cachorro — Calculadora">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Adestrar um Cachorro</h1>
  <section class="app">
<label for="formato">Formato</label>
    <select id="formato">
      <option value="900" selected>Pacote de 10 aulas (1 mês)</option>
      <option value="120">Aula avulsa</option>
      <option value="2500">Hospedagem com treino — 15 dias</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("formato").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("formato").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "adestramento — " + nome.toLowerCase() + "\n" +
    "funciona melhor quando o tutor treina junto: pergunte se as aulas incluem isso\n" +
    "adestramento para guarda custa mais que obediência básica\n" +
    "filhotes aprendem mais rápido que adultos";
});
</script>
</body>
</html>
