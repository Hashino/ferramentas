<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa uma Dedetização — Calculadora</title>
<meta name="description" content="Estime o preço da dedetização: metros do imóvel e tipo de praga, com faixa real de mercado. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/dedetizacao/">
<meta property="og:title" content="Quanto Custa uma Dedetização — Calculadora">
<meta property="og:description" content="M² × tipo de praga: faixa de preço da dedetização residencial.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de preço de dedetização","url":"https://hashino.github.io/ferramentas/tools/dedetizacao/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa uma dedetização."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa uma Dedetizacao</h1>
  <section class="app">
    <label for="m2">Metros quadrados do imóvel</label>
    <input type="number" id="m2" step="5" min="10" value="80">
<label for="praga">Praga</label>
    <select id="praga">
      <option value="1.0" selected>Baratas, formigas e insetos comuns</option>
      <option value="1.5">Cupim</option>
      <option value="1.4">Escorpiões e aranhas</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var fator = Number(document.getElementById("praga").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 10) { saida.textContent = "Informe os metros quadrados."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = (140 + m2 * 2.2) * fator;
  saida.textContent = "Estimativa: R$ " + brl(med * 0.75) + " a R$ " + brl(med * 1.4);
  detalhe.textContent = m2 + " m², " + document.getElementById("praga").selectedOptions[0].textContent.toLowerCase() + "\n" +
    "a maioria das empresas cobra mínimo de deslocamento\n" +
    "cupim exige tratamento mais pesado: pode ser em 2 visitas\n" +
    "contrato trimestral sai mais barato que visita avulsa";
});
</script>
</body>
</html>
