<meta property="og:title" content="Quanto Custa Móveis Planejados — Calculadora">

<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Moveis Planejados</h1>
  <section class="app">
    <label for="ml">Metros lineares de móvel</label>
    <input type="number" id="ml" step="0.5" min="0.5" value="3">
<label for="mat">Material</label>
    <select id="mat">
      <option value="800" selected>MDF padrão — lâminas comuns</option>
      <option value="1500">MDF premium / Smith — acabamento fino</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var ml = Number(document.getElementById("ml").value);
  var med = Number(document.getElementById("mat").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (ml < 0.5) { saida.textContent = "Informe os metros lineares."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = ml * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.7) + " a R$ " + br(total * 1.4);
  detalhe.textContent = br(ml, 1) + " m lineares × R$ " + br(med) + "/m\n" +
    "inclui projeto, marcenaria e instalação\n" +
    "puxadores, vidro e iluminação embutida somam de 5% a 15%\n" +
    "modulado de loja custa metade, mas não aproveita o vão";
});
</script>
</body>
</html>
