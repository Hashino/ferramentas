<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Fazer um Aplicativo — Calculadora</title>
<meta name="description" content="Estime o custo de desenvolver um aplicativo por complexidade, com faixa real de mercado. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/custo-aplicativo/">
<meta property="og:title" content="Quanto Custa Fazer um Aplicativo — Calculadora">
<meta property="og:description" content="Simples × médio × complexo: faixa de custo do aplicativo.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de aplicativo","url":"https://hashino.github.io/ferramentas/tools/custo-aplicativo/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa fazer um aplicativo."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Fazer um Aplicativo</h1>
  <section class="app">
<label for="tipo">Complexidade do app</label>
    <select id="tipo">
      <option value="15000">Simples — poucas telas, sem servidor</option>
      <option value="60000" selected>Médio — login, pagamento, painel</option>
      <option value="150000">Complexo — marketplace ou rede social</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.9);
  detalhe.textContent = "app " + nome.toLowerCase() + "\n" +
    "iOS + Android juntos custam mais que uma plataforma só\n" +
    "manutenção anual custa 15% a 20% do valor inicial\n" +
    "publicar nas lojas: US$ 99/ano (Apple) e US$ 25 único (Google)\n" +
    "exija escopo por escrito e propriedade do código no contrato";
});
</script>
</body>
</html>
