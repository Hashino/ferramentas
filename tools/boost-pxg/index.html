<meta property="og:title" content="Calculadora de Boost PXG">
<meta property="og:description" content="Quantas boost stones faltam para o boost alvo no PokéXGames? Calcule do nível atual ao desejado. Grátis.">

<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<div id="stars"></div><div id="stars2"></div><div id="stars3"></div>
<nav class="top-nav"><div class="nav-container">
  <a class="nav-title" href="../../">Ferramentas</a>
  <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema"></button>
</div></nav>
<main>
  <h1>Calculadora de Boost PXG</h1>
  <section class="app">
    <label for="atual">Boost atual (0–50)</label>
    <input type="number" id="atual" min="0" max="50" placeholder="ex.: 20">
    <label for="alvo">Boost desejado (0–50)</label>
    <input type="number" id="alvo" min="0" max="50" placeholder="ex.: 35">
    <button id="calcular">Calcular stones</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../ads.js"></script>
<script src="../../theme.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var a = Number(document.getElementById("atual").value);
  var b = Number(document.getElementById("alvo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  if (isNaN(a) || isNaN(b) || a < 0 || b < 0 || a > 50 || b > 50 || a >= b) {
    saida.hidden = false;
    saida.textContent = "Informe níveis de 0 a 50, com o desejado maior que o atual.";
    detalhe.textContent = "";
    return;
  }
  var stones = (b * (b + 1) - a * (a + 1)) / 2;
  saida.hidden = false;
  saida.textContent = "Do boost " + a + " ao " + b + ": " + stones.toLocaleString("pt-BR") + " stones";
  var linhas = [];
  for (var n = a + 1; n <= Math.min(b, a + 5); n++) {
    linhas.push("nível " + n + " → " + n + " stones");
  }
  detalhe.textContent = "Detalhe: " + linhas.join(" · ") + (b > a + 5 ? " …" : "");
});
</script>
</body>
</html>
