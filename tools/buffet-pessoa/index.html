<main>
  <h1>Quanto Custa Buffet por Pessoa</h1>
  <section class="app">
    <label for="convidados">Quantos convidados</label>
    <input type="number" id="convidados" step="10" min="10" value="50">
<label for="tipo">Tipo de buffet</label>
    <select id="tipo">
      <option value="70">Coquetel volante — salgados e drinks</option>
      <option value="120" selected>Almoço/jantar completo com bebidas</option>
      <option value="110">Churrasco completo com equipe</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("convidados").value));
  var per = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 10) { saida.textContent = "Informe o número de convidados."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * per;
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "R$ " + br(total * 0.8) + " a R$ " + br(total * 1.25) +
    " (" + br(n) + " × R$ " + br(per) + "/pessoa)";
  detalhe.textContent = "buffet " + nome.toLowerCase() + "\n" +
    "salão e mobiliário entram à parte do buffet\n" +
    "menos de 30 convidados: preço por pessoa sobe\n" +
    "prova/menu degustação costuma ser grátis ao fechar";
});
</script>
