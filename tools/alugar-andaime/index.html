<body>
<main>
  <h1>Quanto Custa Alugar Andaime</h1>
  <section class="app">
<label for="tipo">Período por torre</label>
    <select id="tipo">
      <option value="15" selected>Diária (torre 1,5 × 1 m)</option>
      <option value="90">Mensal (torre 1,5 × 1 m)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Por torre (" + nome.toLowerCase() + "): R$ " + br(med * 0.65) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "andaime tubular em torre de 1,5 × 1 m\n" +
    "fachada de 10 m de frente e 3 m de pé-direito usa cerca de 20 torres\n" +
    "roda, base e guarda-corpo entram no kit da torre\n" +
    "frete de entrega e retirada soma à parte\n" +
    "NR-18 exige cinto e treinamento para trabalho em altura";
});
</script>
</body>
