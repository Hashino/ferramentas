<main>
  <h1>Quanto Custa Trocar Fechadura</h1>
  <section class="app">
<label for="tipo">O que fazer</label>
    <select id="tipo">
      <option value="150">Trocar o segredo (chaves novas)</option>
      <option value="350" selected>Trocar a fechadura completa</option>
      <option value="900">Fechadura eletrônica instalada</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.55) + " a R$ " + br(med * 1.9);
  detalhe.textContent = nome + "\n" +
    "mudou de casa ou perdeu a chave? troca o segredo, é mais barato\n" +
    "chamado do chaveiro emergencial soma taxa de deslocamento\n" +
    "fechadura eletrônica pede porta com espessura padrão\n" +
    "portas blindadas têm peças próprias e custo maior";
});
