<body data-footer>
<main>
  <h1>Quanto Custa Trocar o Oleo do Carro</h1>
  <section class="app">
<label for="oleo">Tipo de óleo</label>
    <select id="oleo">
      <option value="180">Mineral — troca a cada 5 mil km</option>
      <option value="250" selected>Semissintético — troca a cada 7.500 km</option>
      <option value="360">Sintético — troca a cada 10 mil km</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("oleo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("oleo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.5);
  detalhe.textContent = "óleo " + nome.toLowerCase() + " + filtro de óleo\n" +
    "concessionária custa 30% a 50% mais que centro automotivo\n" +
    "sempre troque o filtro junto — óleo novo com filtro velho não vale\n" +
    "veja o manual: cada motor pede uma especificação";
});
</script>
