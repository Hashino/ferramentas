<main>
  <h1>Quanto Custa Maquiagem para Festa</h1>
  <section class="app">
<label for="tipo">Tipo de maquiagem</label>
    <select id="tipo">
      <option value="180">Simples — saída para o dia</option>
      <option value="280" selected>Festa — com cílios postiços</option>
      <option value="800">Noiva — com teste prévio e deslocamento</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.6);
  detalhe.textContent = "maquiagem " + nome.toLowerCase() + "\n" +
    "cabelo junto com maquiagem: some o penteado (R$ 200 a 500)\n" +
    "noite e fim de semana ficam no topo da faixa\n" +
    "padrinho/madrinha em casamento costuma pagar à parte";
});
