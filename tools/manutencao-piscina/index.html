<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Manter uma Piscina — Calculadora Mensal</title>
<meta name="description" content="Calcule o custo mensal de manter a piscina: bomba, filtragem e tratamento (cloro ou sal), com a tarifa local. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/manutencao-piscina/">
<meta property="og:title" content="Quanto Custa Manter uma Piscina — Calculadora Mensal">
<meta property="og:description" content="Bomba × filtragem + tratamento: o custo real da piscina por mês.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de manutenção de piscina","url":"https://hashino.github.io/ferramentas/tools/manutencao-piscina/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto custa manter uma piscina por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Manter uma Piscina</h1>
  <section class="app">
<label for="tamanho">Tamanho da piscina</label>
    <select id="tamanho">
      <option value="p">Pequena (até 20 m²) — bomba 0,5 cv</option>
      <option value="m" selected>Média (20 a 40 m²) — bomba 0,75 cv</option>
      <option value="g">Grande (40 m² ou mais) — bomba 1,5 cv</option>
    </select>
<label for="tratamento">Tratamento</label>
    <select id="tratamento">
      <option value="70" selected>Cloro e produtos — R$ 50 a 90/mês</option>
      <option value="130">Sal / ionizador — R$ 100 a 160/mês</option>
    </select>
    <label for="horas">Horas de bomba por dia</label>
    <input type="number" id="horas" step="0.5" min="1" value="6">

    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
var BOMBA_W = {"p": 370, "m": 550, "g": 1100};
document.getElementById("calcular").addEventListener("click", function () {
  var w = BOMBA_W[document.getElementById("tamanho").value];
  var h = Number(document.getElementById("horas").value);
  var produtos = Number(document.getElementById("tratamento").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (h <= 0 || tarifa <= 0) { saida.textContent = "Informe as horas de bomba e a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = w * h * 30 / 1000;
  var luz = kwhMes * tarifa;
  var total = luz + produtos;
  saida.textContent = "Custo por mês: R$ " + brl(total) + " (luz R$ " + brl(luz) + " + produtos R$ " + brl(produtos) + ")";
  detalhe.textContent = "bomba de " + w + " W × " + h + " h/dia = " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + " kWh/mês = R$ " + brl(luz) + "\n" +
    document.getElementById("tratamento").selectedOptions[0].textContent.split("—")[1].trim() + "\n" +
    "fora disso: reposição de água e limpeza eventual";
});
</script>
</body>
</html>
