<body data-footer>
<main>
  <h1>Quanto Custa Limpeza de Ar Condicionado</h1>
  <section class="app">
    <label for="aparelhos">Quantos aparelhos</label>
    <input type="number" id="aparelhos" step="1" min="1" value="1">
<label for="btu">Capacidade do split</label>
    <select id="btu">
      <option value="130" selected>9000 BTUs — quarto</option>
      <option value="150">12000 BTUs — sala/quarto grande</option>
      <option value="180">18000 BTUs — sala grande</option>
      <option value="220">24000 BTUs ou mais</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o preço da limpeza do ar-condicionado split: BTUs e quantidade de aparelhos, com faixa real. Grátis, na hora.</p>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("aparelhos").value));
  var unit = Number(document.getElementById("btu").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe a quantidade de aparelhos."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * unit;
  saida.textContent = "Estimativa: R$ " + brl(total * 0.8) + " a R$ " + brl(total * 1.35);
  detalhe.textContent = n + " aparelho(s) × R$ " + brl(unit) + " médio\n" +
    "limpeza simples: filtros e serpentina; higienização completa custa mais\n" +
    "recomendado: 1x por ano (2x se o ambiente tem poeira ou pelos)\n" +
    "gás vazio ou defeito é outro serviço, à parte";
});
</script>
