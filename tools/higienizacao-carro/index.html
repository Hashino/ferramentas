<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Higienizacao Interna do Carro</h1>
  <section class="app">
<label for="tipo">Tipo de higienização</label>
    <select id="tipo">
      <option value="150">Simples — aspiração e limpeza de superfícies</option>
      <option value="350" selected>Completa — extração de bancos e carpete</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.5);
  detalhe.textContent = "higienização " + nome.toLowerCase() + "\n" +
    "SUVs e vans custam 20% a 30% mais que hatch/sedã\n" +
    "ozônio contra cheiro soma R$ 80 a 150\n" +
    "cristalização e polimento de vidros são serviços separados";
});
</script>
</body>
</html>
