<script>
const els = ["salario","admissao","saida"].map(id => document.getElementById(id));
const res = document.getElementById("resultado");
const det = document.getElementById("detalhe");
const real = n => n.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const dia = 86400000;

// Meses com 15 dias ou mais dentro da janela [ini, fim], contados mês a mês.
// É a regra de avos do 13º (art. 1º da Lei 4.090/62).
function avos(ini, fim, ano) {
  let n = 0, meses = [];
  for (let m = 0; m < 12; m++) {
    const pIni = new Date(ano, m, 1), pFim = new Date(ano, m + 1, 0);
    const a = ini > pIni ? ini : pIni, b = fim < pFim ? fim : pFim;
    if (b < a) continue;
    const dias = Math.round((b - a) / dia) + 1;
    if (dias >= 15) { n++; meses.push(m + 1); }
  }
  return {n, meses};
}

function calcular() {
  const salario = parseFloat(els[0].value);
  const admissao = new Date(els[1].value + "T00:00:00");
  const saida = new Date(els[2].value + "T00:00:00");
  if (!isFinite(salario) || salario <= 0 || isNaN(admissao) || isNaN(saida) || saida < admissao) {
    res.hidden = true; det.textContent = ""; return;
  }

  // Aviso prévio: 30 dias + 3 por ano completo, teto de 90 (Lei 12.506/2011).
  let anos = saida.getFullYear() - admissao.getFullYear();
  const aniv = new Date(admissao); aniv.setFullYear(admissao.getFullYear() + anos);
  if (aniv > saida) anos--;
  const diasAviso = Math.min(30 + 3 * Math.max(anos, 0), 90);

  // O aviso indenizado projeta o contrato: conta como tempo de serviço.
  const projetada = new Date(saida.getTime() + diasAviso * dia);

  const anoS = saida.getFullYear(), anoP = projetada.getFullYear();
  const fimNoAnoS = anoP > anoS ? new Date(anoS, 11, 31) : projetada;
  const iniNoAnoS = admissao > new Date(anoS, 0, 1) ? admissao : new Date(anoS, 0, 1);
  const a1 = avos(iniNoAnoS, fimNoAnoS, anoS);
  const semAviso = avos(iniNoAnoS, saida, anoS);

  const parcela = salario / 12;
  let total = parcela * a1.n;
  let linhas = [
    "Aviso pr\u00e9vio indenizado: " + diasAviso + " dias (30 + 3 por ano completo, " + Math.max(anos, 0) + " ano(s))",
    "Data projetada do fim do contrato: " + projetada.toLocaleDateString("pt-BR"),
    "",
    anoS + ": " + a1.n + "/12 avos \u2014 " + real(parcela * a1.n),
    "Sem a proje\u00e7\u00e3o do aviso seriam " + semAviso.n + "/12 avos (" + real(parcela * semAviso.n) + ")",
    "Diferen\u00e7a que o aviso indenizado gera: " + real(parcela * (a1.n - semAviso.n))
  ];

  if (anoP > anoS) {
    const a2 = avos(new Date(anoP, 0, 1), projetada, anoP);
    total += parcela * a2.n;
    linhas.push("", anoP + ": " + a2.n + "/12 avos \u2014 " + real(parcela * a2.n) +
                " (a proje\u00e7\u00e3o entrou no ano seguinte e gera 13\u00ba pr\u00f3prio)");
  }

  linhas.push("", "Valor bruto: o 13\u00ba tem desconto de INSS e IRRF na segunda parcela.");
  res.hidden = false;
  res.textContent = "13\u00ba proporcional: " + real(total);
  det.textContent = linhas.join("\n");
}

for (const el of els) el.addEventListener("input", calcular);
calcular();
</script>
