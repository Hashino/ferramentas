<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Gasta uma Geladeira por Mês — Calculadora</title>
<meta name="description" content="Calcule quanto a geladeira adiciona à conta de luz pelo consumo do selo INMETRO (kWh/mês). Grátis, sem cadastro, resultado na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/gasto-geladeira/">
<meta property="og:title" content="Quanto Gasta uma Geladeira por Mês — Calculadora">
<meta property="og:description" content="Informe o kWh/mês do selo INMETRO: veja o custo mensal e anual da geladeira.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de Gasto da Geladeira","url":"https://hashino.github.io/ferramentas/tools/gasto-geladeira/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto gasta uma geladeira por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Gasta uma Geladeira por Mês</h1>
  <section class="app">
<label for="selo">Consumo do selo INMETRO (kWh/mês)</label>
    <select id="selo">
      <option value="35">35 kWh — geladeira simples</option>
      <option value="55" selected>55 kWh — frost-free média</option>
      <option value="80">80 kWh — duplex grande</option>
    </select>
    <label for="selo2">Ou informe outro valor (kWh/mês)</label>
    <input type="number" id="selo2" step="1" min="1" placeholder="ex.: 62">
    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular gasto</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var kwh = Number(document.getElementById("selo2").value) || Number(document.getElementById("selo").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false;
  detalhe.textContent = "";
  if (kwh <= 0 || tarifa <= 0) {
    saida.textContent = "Informe o consumo (kWh/mês) e a tarifa.";
    return;
  }
  var brl = function (n) {
    return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  var mes = kwh * tarifa;
  var ano = mes * 12;
  saida.textContent = "Custo por mês: R$ " + brl(mes) + " (R$ " + brl(ano) + " por ano)";
  detalhe.textContent =
    kwh.toLocaleString("pt-BR") + " kWh/mês (selo INMETRO) × R$ " + brl(tarifa) + "/kWh = R$ " + brl(mes) + "/mês\n" +
    "por ano: R$ " + brl(ano);
});
</script>
</body>
</html>
