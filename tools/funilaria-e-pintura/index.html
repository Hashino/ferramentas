<meta property="og:title" content="Quanto Custa Funilaria e Pintura de Carro — Calculadora">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Funilaria e Pintura de um Carro</h1>
  <section class="app">
<label for="tipo">Tipo de serviço</label>
    <select id="tipo">
      <option value="450">Pintura de uma peça (porta, para-lama)</option>
      <option value="700" selected>Funilaria + pintura de uma peça</option>
      <option value="3500">Pintura completa do carro</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.9);
  detalhe.textContent = nome + "\n" +
    "peça com amassado no meio da chapa custa mais que na borda\n" +
    "para-choque plástico tem reparo próprio e mais barato\n" +
    "combinar cores com o resto do carro exige bom polidor\n" +
    "verifique se a oficina usa verniz e pintura com garantia";
});
</script>
</body>
</html>
