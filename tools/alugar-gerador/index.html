<meta property="og:title" content="Quanto Custa Alugar um Gerador — Calculadora">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Alugar um Gerador</h1>
  <section class="app">
<label for="tipo">Potência / uso</label>
    <select id="tipo">
      <option value="250">5 kVA — casa e obra pequena (diária)</option>
      <option value="500" selected>25 kVA — evento médio (diária)</option>
      <option value="1200">100 kVA ou mais (diária)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Diária: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.8);
  detalhe.textContent = "gerador " + nome.toLowerCase() + "\n" +
    "combustível (diesel) entra à parte — calcule 4 a 8 litros por hora\n" +
    "mensal sai bem mais barato que diárias somadas\n" +
    "evento precisa de gerador silencioso (insonorizado)\n" +
    "confirme quem leva e busca: o frete pode somar R$ 300 a 1.500";
});
</script>
</body>
</html>
