<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Dura um Botijao de Gas 13kg</h1>
  <section class="app">
<label for="uso">Uso de gás na casa</label>
    <select id="uso">
      <option value="0.3">Só fogão — ~0,3 kg por dia</option>
      <option value="0.8" selected>Fogão + chuveiro a gás — ~0,8 kg por dia</option>
      <option value="1.2">Fogão + chuveiro + aquecedor — ~1,2 kg por dia</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var dia = Number(document.getElementById("uso").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x, d) { return x.toLocaleString("pt-BR", { maximumFractionDigits: d === undefined ? 0 : d }); };
  var dias = 13 / dia;
  saida.textContent = "≈ " + br(dias) + " dias (~" + br(dias / 30, 1) + " meses) por botijão";
  detalhe.textContent = "13 kg ÷ " + br(dia, 1) + " kg/dia = " + br(dias) + " dias\n" +
    "banhos demorados e panelas grandes dobram o consumo do fogão\n" +
    "chama amarela ou cheiro de gás: chame assistência já\n" +
    "gás encanado (GNV residencial) costuma sair mais barato por kg";
});
</script>
</body>
</html>
