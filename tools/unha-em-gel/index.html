<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Unha em Gel</h1>
  <section class="app">
<label for="tipo">Tipo de serviço</label>
    <select id="tipo">
      <option value="90" selected>Esmaltação em gel — nas unhas naturais</option>
      <option value="160">Alongamento em gel</option>
      <option value="220">Fibra de vidro / acrígel</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Sessão: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.5) +
    " — manutenção mensal: R$ " + br(med * 0.8) + " a R$ " + br(med * 1.2);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "manutenção a cada 3 ou 4 semanas, senão a unha levanta\n" +
    "remoção feita em casa arranca a unha natural: pague a remoção\n" +
    "nail art e francesinha adicionam R$ 20 a 50";
});
</script>
</body>
