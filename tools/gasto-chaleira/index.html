<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Gasta uma Chaleira Elétrica — Calculadora</title>
<meta name="description" content="Calcule o gasto mensal da chaleira elétrica na conta de luz: potência e minutos de uso por dia. Grátis, sem cadastro, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/gasto-chaleira/">
<meta property="og:title" content="Quanto Gasta uma Chaleira Elétrica — Calculadora">
<meta property="og:description" content="Potência × minutos por dia × tarifa: o custo real de ferver água na chaleira.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de Gasto da Chaleira Elétrica","url":"https://hashino.github.io/ferramentas/tools/gasto-chaleira/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto gasta uma chaleira elétrica por mês."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Gasta uma Chaleira Elétrica</h1>
  <section class="app">
<label for="potencia">Potência da chaleira</label>
    <select id="potencia">
      <option value="1000">1000 W</option>
      <option value="1500" selected>1500 W (mais comum)</option>
      <option value="1850">1850 W</option>
      <option value="2200">2200 W</option>
    </select>
    <label for="minutos">Minutos de uso por dia</label>
    <input type="number" id="minutos" step="1" min="1" value="10">
    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular gasto</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var w = Number(document.getElementById("potencia").value);
  var min = Number(document.getElementById("minutos").value);
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (min <= 0 || tarifa <= 0) { saida.textContent = "Informe os minutos por dia e a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = w * min * 30 / 60 / 1000;
  var mes = kwhMes * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes);
  detalhe.textContent = w + " W × " + min + " min/dia × 30 dias ÷ 60 = " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " kWh/mês\n" +
    "custo: " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " kWh × R$ " + brl(tarifa) + " = R$ " + brl(mes) + "/mês";
});
</script>
</body>
</html>
