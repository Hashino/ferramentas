<body data-footer>
<main>
  <h1>Quanto Gasta com Comida por Mes</h1>
  <section class="app">
    <label for="pessoas">Pessoas na casa</label>
    <input type="number" id="pessoas" step="1" min="1" value="2">
<label for="perfil">Perfil de consumo</label>
    <select id="perfil">
      <option value="450">Enxuto — básico da despensa, tudo em casa</option>
      <option value="700" selected>Médio — carne toda semana, delivery às vezes</option>
      <option value="1000">Largo — marcas conhecidas, delivery frequente</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Math.floor(Number(document.getElementById("pessoas").value));
  var per = Number(document.getElementById("perfil").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 1) { saida.textContent = "Informe o número de pessoas."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * per;
  var nome = document.getElementById("perfil").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "R$ " + brl(total * 0.85) + " a R$ " + brl(total * 1.2) + " por mês";
  detalhe.textContent = n + " pessoa(s), perfil " + nome.toLowerCase() + " (" + brl(per) + "/pessoa)\n" +
    "crianças gastam menos que adultos: ajuste o número pra baixo\n" +
    "delivery e restaurantes entram fora dessa conta\n" +
    "comprar atacado e fazer lista corta de 10% a 20%";
});
</script>
