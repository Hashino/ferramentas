<body data-footer>
<main>
  <h1>Quanto Custa Criar uma Galinha</h1>
  <section class="app">
    <label for="aves">Quantas galinhas</label>
    <input type="number" id="aves" step="1" min="1" value="10">
    <label for="gdia">Ração por ave por dia (g)</label>
    <input type="number" id="gdia" step="10" min="50" value="120">
    <label for="preco">Preço do kg da ração (R$)</label>
    <input type="number" id="preco" step="0.1" min="0.5" value="3.5">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var aves = Math.floor(Number(document.getElementById("aves").value));
  var g = Number(document.getElementById("gdia").value);
  var preco = Number(document.getElementById("preco").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (aves < 1 || g <= 0 || preco <= 0) { saida.textContent = "Preencha aves, ração e preço."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kgMes = aves * g * 30 / 1000;
  var mes = kgMes * preco;
  saida.textContent = "Custo por mês: R$ " + brl(mes) + " (" + kgMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kg de ração)";
  detalhe.textContent = aves + " aves × " + g + " g/dia × 30 dias = " + kgMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kg/mês\n" +
    "× R$ " + brl(preco) + "/kg = R$ " + brl(mes) + "/mês\n" +
    "milho e verduras do quintal reduzem o custo por ave";
});
</script>
