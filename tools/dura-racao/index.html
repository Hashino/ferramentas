<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Dura um Saco de Ração — Calculadora</title>
<meta name="description" content="Calcule quanto tempo dura o saco de ração: gato, cão pequeno, médio ou grande, de 5, 10 ou 15 kg. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/dura-racao/">
<meta property="og:title" content="Quanto Dura um Saco de Ração — Calculadora">
<meta property="og:description" content="Porte do pet × saco de ração: quantos dias dura.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de duração da ração","url":"https://hashino.github.io/ferramentas/tools/dura-racao/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de quanto dura um saco de ração."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Dura um Saco de Racao</h1>
  <section class="app">
<label for="pet">Seu pet</label>
    <select id="pet">
      <option value="90">Gato — ~90 g por dia</option>
      <option value="130">Cão pequeno (até 10 kg) — ~130 g por dia</option>
      <option value="250" selected>Cão médio (10 a 25 kg) — ~250 g por dia</option>
      <option value="400">Cão grande (25 kg ou mais) — ~400 g por dia</option>
    </select>
<label for="saco">Tamanho do saco</label>
    <select id="saco">
      <option value="5">5 kg</option>
      <option value="10">10 kg</option>
      <option value="15" selected>15 kg</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var dia = Number(document.getElementById("pet").value);
  var kg = Number(document.getElementById("saco").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var dias = kg * 1000 / dia;
  var nome = document.getElementById("pet").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "≈ " + br(dias) + " dias (" + br(dias / 30, 1) + " meses) — " +
    br(dia * 30) + " g por mês";
  detalhe.textContent = kg + " kg ÷ " + dia + " g/dia, " + nome.toLowerCase() + "\n" +
    "ração premium rende mais: porção diária menor\n" +
    "filhotes e pets com apetite acentuado comem até 2x mais\n" +
    "guarde em pote fechado, longe da luz: oxida e perde paladar";
});
</script>
</body>
</html>
