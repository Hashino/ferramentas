<body>
<main>
  <h1>Quanto Custa um Cuidador de Idoso</h1>
  <section class="app">
<label for="tipo">Regime de cuidado</label>
    <select id="tipo">
      <option value="150">Diária (8 a 12 horas)</option>
      <option value="2200" selected>Mensal (escala 12×36)</option>
      <option value="4500">24 horas (duas cuidadoras revezando)</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "cuidador de idoso — regime " + nome.toLowerCase() + "\n" +
    "profissional contratada direto custa menos que empresa, mas sem cobertura\n" +
    "registro em carteira (doméstica) soma encargos de 25% a 40%\n" +
    "idoso acamado ou com demência custa mais que acompanhamento leve\n" +
    "exija referências e verifique cursos de cuidador e vacinação";
});
</script>
</body>
</html>
