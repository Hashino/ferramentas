<main>
  <h1>Quanto Custa um Logo</h1>
  <section class="app">
<label for="tipo">Como fazer</label>
    <select id="tipo">
      <option value="70">Gerador online — automático, rápido</option>
      <option value="800" selected>Freelancer — design exclusivo</option>
      <option value="4000">Estúdio — logo + identidade visual</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.5) + " a R$ " + br(med * 2.2);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "gerador: arte parecida com outros clientes, sem exclusividade\n" +
    "freelancer: revisões e arquivos abertos entram a combinar\n" +
    "estúdio: manual de marca, versões e aplicativos incluídos";
});
