<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Harmonizacao Facial</h1>
  <section class="app">
<label for="tipo">Procedimento</label>
    <select id="tipo">
      <option value="900">Botox (uma região)</option>
      <option value="1500" selected>Preenchimento labial ou maçã do rosto</option>
      <option value="6000">Pacote completo de harmonização</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("(")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.8);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "resultado do botox dura 4 a 6 meses; preenchedor, 12 a 18\n" +
    "procure médico (dermato ou cirurgião) com registro no CRM\n" +
    "produtos originais têm lote rastreável — peça para ver\n" +
    "desconfie de preço muito abaixo da faixa: pode ser produto falsificado";
});
</script>
</body>
