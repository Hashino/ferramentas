<body data-footer>
<main>
  <h1>Quanto Custa Podar uma Arvore</h1>
  <section class="app">
<label for="porte">Porte da árvore</label>
    <select id="porte">
      <option value="250">Pequena — até 4 m</option>
      <option value="500" selected>Média — 4 a 8 m</option>
      <option value="1200">Grande — 8 m ou mais / precisa de cordas</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">

    <p>Estime o preço da poda da árvore: pequena, média ou grande, com remoção de galhos, com faixa real. Grátis, na hora.</p>

  </details>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("porte").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("porte").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.6) + " a R$ " + br(med * 1.7);
  detalhe.textContent = "árvore " + nome.toLowerCase() + "\n" +
    "inclui poda e destinação dos galhos; destoca é outro serviço\n" +
    "corte total de árvore nativa pede licença ambiental no município\n" +
    "árvore perto de fiação sobe o preço: precisa de equipe com isolação";
});
</script>
