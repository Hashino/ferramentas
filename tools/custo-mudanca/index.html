<body data-footer>
<main>
  <h1>Quanto Custa uma Mudanca</h1>
  <section class="app">
<label for="quartos">Tamanho da casa</label>
    <select id="quartos">
      <option value="350">Studio / kitnet</option>
      <option value="550" selected>2 quartos</option>
      <option value="800">3 quartos ou mais</option>
    </select>
<label for="dist">Distância</label>
    <select id="dist">
      <option value="1.0" selected>Mesma cidade — carreto</option>
      <option value="2.5">Mesmo estado</option>
      <option value="6.0">Outro estado — interestadual</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o custo da mudança: tamanho da casa e distância, carreto local ou interestadual, com faixa real. Grátis, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../custo-colonoscopia/">Quanto Custa uma Colonoscopia</a> · <a href="../custo-galpao/">Quanto Custa Construir um Galpao</a> · <a href="../custo-fazer-site/">Quanto Custa Fazer um Site</a></p>
  </details>

<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("quartos").value);
  var fator = Number(document.getElementById("dist").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.5);
  detalhe.textContent = document.getElementById("quartos").selectedOptions[0].textContent.split(" ")[0].toLowerCase() +
    ", " + document.getElementById("dist").selectedOptions[0].textContent.split("—")[0].trim().toLowerCase() + "\n" +
    "3º andar sem elevador e escada apertada somam 20% a 40%\n" +
    "mudança interestadual via transportadora custa menos que empresa de mudança\n" +
    "embalagem e montagem/desmontagem de móveis entram à parte";
});
</script>
