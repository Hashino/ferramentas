<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Calorias dos Alimentos — Tabela Grátis</title>
<meta name="description" content="Some as calorias dos alimentos por quantidade: arroz, feijão, frango, ovos, frutas e mais de 70 alimentos comuns. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/calorias-dos-alimentos/">
<meta property="og:title" content="Calculadora de Calorias dos Alimentos — Tabela Grátis">
<meta property="og:description" content="Mais de 70 alimentos comuns: escolha, informe a quantidade e veja as calorias somadas.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de Calorias dos Alimentos","url":"https://hashino.github.io/ferramentas/tools/calorias-dos-alimentos/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Calculadora de calorias dos alimentos: tabela de mais de 70 alimentos comuns por quantidade."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Calculadora de Calorias dos Alimentos</h1>
  <section class="app">
    <label for="alimento">Alimento</label>
    <select id="alimento"></select>
    <label for="gramas">Quantidade (g ou ml)</label>
    <input type="number" id="gramas" min="1" step="1" placeholder="ex.: 150">
    <button id="adicionar">Adicionar</button>
    <ul id="lista" style="list-style:none;padding:0;margin:.75rem 0 0"></ul>
    <div class="resultado" id="resultado" hidden></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
// kcal por 100 g (ou 100 ml) — valores médios de tabelas brasileiras (TACO/USDA)
var FOODS = {
  "Arroz branco cozido": 128, "Arroz integral cozido": 124, "Feijão carioca cozido": 76,
  "Feijão preto cozido": 77, "Lentilha cozida": 116, "Grão-de-bico cozido": 164,
  "Milho verde cozido": 112, "Cuscuz de milho": 113, "Tapioca": 240, "Macarrão cozido": 158,
  "Frango grelhado (peito)": 165, "Frango frito (coxa)": 245, "Carne magra grelhada": 200,
  "Picanha grelhada": 290, "Lombo de porco assado": 215, "Tilápia grelhada": 128,
  "Sardinha": 208, "Atum em conserva (água)": 116, "Camarão cozido": 99, "Ovo frito": 196,
  "Ovo cozido": 155, "Omelete": 154, "Tofu": 76,
  "Leite integral": 61, "Leite desnatado": 35, "Iogurte natural": 61,
  "Queijo mussarela": 280, "Queijo minas": 264, "Requeijão": 290,
  "Pão francês": 300, "Pão integral": 246, "Pão de queijo": 334, "Bolo de chocolate": 371,
  "Biscoito recheado": 480, "Coxinha": 277, "Pastel de carne": 341, "Esfiha": 270,
  "Pizza de mussarela": 266, "Hambúrguer": 250, "Cachorro-quente": 268, "Lasanha de carne": 165,
  "Sushi (peça)": 145, "Batata frita": 312, "Batata cozida": 68, "Mandioca frita": 310,
  "Farofa": 350, "Salada mista sem molho": 20, "Tomate": 15, "Alface": 15, "Cenoura": 34,
  "Brócolis cozido": 25, "Banana": 98, "Maçã": 56, "Laranja": 45, "Mamão": 40, "Manga": 60,
  "Uva": 69, "Melancia": 32, "Abacate": 96, "Morango": 30, "Abacaxi": 50,
  "Chocolate ao leite": 546, "Sorvete de creme": 207, "Refrigerante cola": 41,
  "Suco de laranja": 45, "Cerveja": 43, "Café sem açúcar": 2, "Café com açúcar": 25,
  "Manteiga": 717, "Azeite de oliva": 884, "Óleo de soja": 884, "Açúcar refinado": 387,
  "Mel": 304, "Amendoim torrado": 567, "Castanha de caju": 556
};

var itens = [];
var sel = document.getElementById("alimento");
var lista = document.getElementById("lista");
var saida = document.getElementById("resultado");

Object.keys(FOODS).sort().forEach(function (nome) {
  var o = document.createElement("option");
  o.value = nome;
  o.textContent = nome;
  sel.appendChild(o);
});

function brl(n) { return n.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); }

function render() {
  lista.innerHTML = "";
  var total = 0;
  itens.forEach(function (it, i) {
    total += it.kcal;
    var li = document.createElement("li");
    li.style.cssText = "display:flex;justify-content:space-between;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--border,rgba(128,128,128,.2));font-size:.95rem";
    var txt = document.createElement("span");
    txt.textContent = it.nome + " — " + it.g + " g: " + brl(it.kcal) + " kcal";
    var btn = document.createElement("button");
    btn.textContent = "×";
    btn.setAttribute("aria-label", "Remover " + it.nome);
    btn.style.cssText = "padding:0 .5rem;line-height:1.4";
    btn.addEventListener("click", function () {
      itens.splice(i, 1);
      render();
    });
    li.appendChild(txt);
    li.appendChild(btn);
    lista.appendChild(li);
  });
  if (itens.length) {
    saida.hidden = false;
    saida.textContent = "Total: " + brl(total) + " kcal em " + itens.length + (itens.length === 1 ? " item" : " itens");
  } else {
    saida.hidden = true;
  }
}

document.getElementById("adicionar").addEventListener("click", function () {
  var g = Number(document.getElementById("gramas").value);
  if (g <= 0) return;
  var nome = sel.value;
  itens.push({ nome: nome, g: g, kcal: FOODS[nome] * g / 100 });
  document.getElementById("gramas").value = "";
  render();
});
</script>
</body>
</html>
