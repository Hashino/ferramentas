<body data-footer>
<main>
  <h1>Quanto Custa Pintar uma Casa</h1>
  <section class="app">
    <label for="m2">Metros quadrados de parede</label>
    <input type="number" id="m2" step="5" min="10" value="150">
<label for="tipo">Tipo de superfície</label>
    <select id="tipo">
      <option value="1.0" selected>Paredes internas — 2 demãos</option>
      <option value="1.4">Externa / com massa e selador</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o custo para pintar a casa: metros quadrados de parede, tinta e mão de obra, interna ou externa. Grátis, na hora.</p>
    <p class="relacionadas">Veja também: <a href="../pintar-cabelo/">Quanto Custa Pintar o Cabelo no Salao</a> · <a href="../pintar-portao/">Quanto Custa Pintar um Portao</a> · <a href="../pintar-quarto/">Quanto Custa Pintar um Quarto</a></p>
  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var fator = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 10) { saida.textContent = "Informe os metros quadrados de parede."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var litros = m2 * 2 * fator / 10;
  var tinta = litros * 40;
  var mao = m2 * 15 * fator;
  var total = tinta + mao;
  saida.textContent = "Estimativa: R$ " + br(total * 0.75) + " a R$ " + br(total * 1.35) +
    " (tinta R$ " + br(tinta) + " + mão de obra R$ " + br(mao) + ")";
  detalhe.textContent = br(m2) + " m² → " + br(litros, 0) + " L de tinta + mão de obra\n" +
    "fachada pede textura ou grafiato: pinte o valor\n" +
    "andaime para altura acima de 3 m é aluguel à parte\n" +
    "casa inteira fechada sai mais barato por m²";
});
</script>
