<body data-footer>
<main>
  <h1>Quanto Gasta uma Câmera de Segurança</h1>
  <section class="app">
<label for="potencia">Potência por câmera</label>
    <select id="potencia">
      <option value="5">5 W — câmera Wi-Fi compacta</option>
      <option value="10" selected>10 W — câmera com infravermelho</option>
      <option value="15">15 W — câmera PTZ / externa</option>
    </select>
    <label for="quantidade">Quantas câmeras</label>
    <input type="number" id="quantidade" step="1" min="1" value="4">
    <label for="gravador">DVR/NVR ligado também (W)</label>
    <input type="number" id="gravador" step="5" min="0" value="30">

    <label for="tarifa">Tarifa da sua região (R$/kWh)</label>
    <input type="number" id="tarifa" step="0.01" min="0.1" value="0.95">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Calcule o gasto mensal das câmeras de segurança na conta de luz: potência, quantidade e funcionamento 24 h. Grátis.</p>

  </details>

<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var w = Number(document.getElementById("potencia").value);
  var qtd = Math.floor(Number(document.getElementById("quantidade").value));
  var dvr = Number(document.getElementById("gravador").value) || 0;
  var tarifa = Number(document.getElementById("tarifa").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (qtd < 1 || tarifa <= 0) { saida.textContent = "Informe a quantidade e a tarifa."; return; }
  var brl = function (n) { return n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kwhMes = (w * qtd + dvr) * 24 * 30 / 1000;
  var mes = kwhMes * tarifa;
  saida.textContent = "Custo por mês: R$ " + brl(mes) + " (24 h por dia)";
  detalhe.textContent = w + " W × " + qtd + " câmeras" + (dvr ? " + " + dvr + " W do gravador" : "") + " ligado(s) 24 h\n" +
    "= " + kwhMes.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kWh/mês × R$ " + brl(tarifa) + " = R$ " + brl(mes) + "\n" +
    "o infravermelho noturno eleva o consumo à noite";
});
</script>
