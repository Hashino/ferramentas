<head>

<meta name="description" content="Estime o preço da blindagem do carro: nível III-A ou III, hatch/SUV, com faixa real de mercado. Grátis, sem cadastro.">

<meta property="og:title" content="Quanto Custa Blindar um Carro — Calculadora">
<meta property="og:description" content="Nível × tipo de carro: faixa de preço da blindagem.">

{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de blindagem de carro","url":"https://hashino.github.io/ferramentas/tools/blindar-carro/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa blindar um carro."}

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Blindar um Carro</h1>
  <section class="app">
<label for="nivel">Nível de blindagem</label>
    <select id="nivel">
      <option value="25000" selected>III-A — protege de revólver e pistola</option>
      <option value="45000">III — protege até rifle</option>
    </select>
<label for="cat">Categoria do carro</label>
    <select id="cat">
      <option value="1.0" selected>Hatch / sedã</option>
      <option value="1.2">SUV / picape</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("nivel").value);
  var fator = Number(document.getElementById("cat").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + br(med * 0.8) + " a R$ " + br(med * 1.35);
  detalhe.textContent = "blindagem nível " + document.getElementById("nivel").selectedOptions[0].textContent.split("—")[0].trim() + "\n" +
    "serviço leva 3 a 4 semanas\n" +
    "peso extra consome um pouco mais de combustível\n" +
    "garantia típica: 5 a 10 anos; vidros extras são caros\n" +
    "o seguro sobe: avise a seguradora";
});
</script>
</body>
</html>
