<body data-footer>
<main>
  <h1>Quanto Custa um Telhado por m2</h1>
  <section class="app">
    <label for="m2">Metros quadrados de telhado</label>
    <input type="number" id="m2" step="5" min="10" value="100">
<label for="telha">Tipo de telha</label>
    <select id="telha">
      <option value="150" selected>Cerâmica colonial — R$ 120 a 190/m² instalada</option>
      <option value="95">Fibrocimento — R$ 80 a 115/m² instalada</option>
      <option value="220">Sanduíche térmica — R$ 180 a 260/m² instalada</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m2 = Number(document.getElementById("m2").value);
  var med = Number(document.getElementById("telha").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m2 < 10) { saida.textContent = "Informe os metros quadrados."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = m2 * med;
  saida.textContent = "Estimativa: R$ " + br(total * 0.8) + " a R$ " + br(total * 1.3);
  detalhe.textContent = m2 + " m² × R$ " + br(med) + "/m² médio\n" +
    "inclui estrutura de madeira, telhas e mão de obra\n" +
    "calhas, rufos e cumeeiras somam de 5% a 10%\n" +
    "telhado com águas complexas ou grande altura custa mais";
});
</script>
