<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa uma Caçamba de Entulho — Calculadora</title>
<meta name="description" content="Calcule o custo da caçamba de entulho: tamanho e diárias de locação, com faixa real. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/cacamba-entulho/">
<meta property="og:title" content="Quanto Custa uma Caçamba de Entulho — Calculadora">
<meta property="og:description" content="Tamanho × diárias: faixa de preço da caçamba de entulho.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de caçamba de entulho","url":"https://hashino.github.io/ferramentas/tools/cacamba-entulho/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa uma caçamba de entulho."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa uma Cacamba de Entulho</h1>
  <section class="app">
    <label for="diarias">Quantas diárias</label>
    <input type="number" id="diarias" step="1" min="1" value="3">
<label for="tam">Tamanho da caçamba</label>
    <select id="tam">
      <option value="250">4 m³ — reforma de banheiro/quarto</option>
      <option value="300" selected>5 m³ — o mais pedido</option>
      <option value="400">7 m³ — obra maior</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var d = Math.floor(Number(document.getElementById("diarias").value));
  var med = Number(document.getElementById("tam").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (d < 1) { saida.textContent = "Informe as diárias."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tam").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.75) + " a R$ " + br(med * 1.4) +
    " (" + d + " diárias incluídas no preço base)";
  detalhe.textContent = "caçamba " + nome.toLowerCase() + ", " + d + " diária(s)\n" +
    "diária extra soma R$ 30 a 60\n" +
    "entulho pesado (concreto, terra) tem limite de enchimento\n" +
    "caçamba na rua pode exigir autorização da prefeitura";
});
</script>
</body>
</html>
