<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Limpar Fossa</h1>
  <section class="app">
<label for="tipo">Tipo de imóvel</label>
    <select id="tipo">
      <option value="600" selected>Casa / fossa residencial</option>
      <option value="1200">Comércio / condomínio</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.5) + " a R$ " + br(med * 2);
  detalhe.textContent = "fossa " + nome + "\n" +
    "o preço acompanha as viagens do caminhão até o aterro sanitário\n" +
    "fossa cheia a cada 1 ou 2 anos é o comum em casa\n" +
    "acesso difícil ao tanque soma mão de obra extra\n" +
    "empresa séria emite comprovante de destinação do resíduo";
});
</script>
</body>
