<meta property="og:title" content="Quanto Custa Consertar Geladeira — Estimativa">

<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Consertar Geladeira</h1>
  <section class="app">
<label for="defeito">Qual o problema</label>
    <select id="defeito">
      <option value="300" selected>Não gela — gás, termostato ou resistor</option>
      <option value="250">Acumula gelo na placa — resistor de degelo</option>
      <option value="900">Motor / compressor queimado</option>
      <option value="120">Só visitação e diagnóstico</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("defeito").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("defeito").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.7) + " a R$ " + brl(med * 1.45);
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "a visitação (~R$ 120) costuma ser descontada se você fechar o conserto\n" +
    "compressor novo em geladeira velha nem sempre compensa\n" +
    "peça original custa 30% a 50% mais que paralela";
});
</script>
</body>
</html>
