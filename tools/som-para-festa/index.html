<body data-footer>
<main>
  <h1>Quanto Custa Alugar Som para Festa</h1>
  <section class="app">
<label for="kit">Kit de som</label>
    <select id="kit">
      <option value="400">Simples — caixas + mesa, até 50 pessoas</option>
      <option value="650" selected>Médio — som forte para quintal/salão</option>
      <option value="1200">Kit boate — som + iluminação + fumaça</option>
    </select>
<label for="horas">Duração</label>
    <select id="horas">
      <option value="1.0" selected>Até 4 horas</option>
      <option value="1.4">Até 8 horas</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o aluguel de som para festa: horas de evento, kit simples ou kit boate com iluminação, faixa real. Grátis.</p>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var base = Number(document.getElementById("kit").value);
  var fator = Number(document.getElementById("horas").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = base * fator;
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.6);
  detalhe.textContent = document.getElementById("kit").selectedOptions[0].textContent.split("—")[0].trim().toLowerCase() +
    " (" + document.getElementById("horas").selectedOptions[0].textContent.toLowerCase() + ")\n" +
    "operador incluso em kit maior; pergunte antes\n" +
    "gerador para lugar sem energia soma R$ 300 a 600\n" +
    "montagem e desmontagem entram na diária na maioria das lojas";
});
</script>
