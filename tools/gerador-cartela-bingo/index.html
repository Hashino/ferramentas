<body data-footer>
<main>
  <h1>Gerador de Cartela de Bingo</h1>
  <section class="app">
    <label for="quantidade">Quantas cartelas</label>
    <input type="number" id="quantidade" min="1" max="12" value="4">
    <label for="maximo">Números de 1 até</label>
    <input type="number" id="maximo" min="20" max="99" value="75">
    <label for="dim">Tamanho da cartela</label>
    <select id="dim">
      <option value="3">3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="5" selected>5 × 5</option>
    </select>
    <button id="gerar">Gerar cartelas</button>
    <div id="folha" hidden><div id="area" class="cartelas"></div></div>
    <button id="imprimir" hidden style="margin-top:1rem">Imprimir</button>
  </section>

  </details>

<script>
document.getElementById("gerar").addEventListener("click", function () {
  var q = Math.min(12, Math.max(1, Math.floor(Number(document.getElementById("quantidade").value) || 1)));
  var max = Math.min(99, Math.max(20, Math.floor(Number(document.getElementById("maximo").value) || 75)));
  var dim = Number(document.getElementById("dim").value);
  var area = document.getElementById("area");
  area.innerHTML = "";
  var todas = [];
  for (var k = 0; k < q; k++) {
    var nums = [];
    while (nums.length < dim * dim) {
      var n = 1 + Math.floor(Math.random() * max);
      if (nums.indexOf(n) === -1) nums.push(n);
    }
    var div = document.createElement("div");
    div.className = "cartela";
    var html = "<table>";
    html += "<tr>";
    for (var j = 0; j < dim; j++) {
      var letra = String.fromCharCode(66 + j); // B, I, N, G, O
      html += "<th>" + letra + "</th>";
    }
    html += "</tr>";
    for (var r = 0; r < dim; r++) {
      html += "<tr>";
      for (var c = 0; c < dim; c++) html += "<td>" + nums[r * dim + c] + "</td>";
      html += "</tr>";
    }
    html += "</table><div style='font-size:.75rem;color:var(--muted)'>" + (k + 1) + "</div>";
    div.innerHTML = html;
    area.appendChild(div);
    todas.push(nums);
  }
  document.getElementById("folha").hidden = false;
  document.getElementById("imprimir").hidden = false;
});

document.getElementById("imprimir").addEventListener("click", function () {
  window.print();
});
</script>
