<main>
  <h1>Quanto Custa uma Baba</h1>
  <section class="app">
<label for="tipo">Regime de trabalho</label>
    <select id="tipo">
      <option value="120">Diária (8 horas)</option>
      <option value="1800" selected>Mensal registrada (CLT doméstica)</option>
      <option value="2500">Mora em casa</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.6);
  detalhe.textContent = "babá — " + nome + "\n" +
    "registrada soma encargos (INSS, férias, 13º): use o eSocial doméstico\n" +
    "baby sitter avulsa por evento cobra por hora (R$ 20 a 40)\n" +
    "babá com curso de primeiros socorros e referências custa mais\n" +
    "horas extras e deslocamento devem ficar combinados antes";
});
</script>
