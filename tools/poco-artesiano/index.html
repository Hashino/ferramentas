<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Fazer um Poço Artesiano — Estimativa</title>
<meta name="description" content="Estime o custo do poço artesiano: profundidade e tipo de solo, com faixa de preço por metro perfurado. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/poco-artesiano/">
<meta property="og:title" content="Quanto Custa Fazer um Poço Artesiano — Estimativa">
<meta property="og:description" content="Profundidade × tipo de solo: a faixa de preço da perfuração.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de custo de poço artesiano","url":"https://hashino.github.io/ferramentas/tools/poco-artesiano/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa fazer um poço artesiano."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Fazer um Poco Artesiano</h1>
  <section class="app">
    <label for="metros">Profundidade estimada (m)</label>
    <input type="number" id="metros" step="10" min="20" value="60">
<label for="solo">Tipo de solo</label>
    <select id="solo">
      <option value="220">Areia/terra fofa — ~R$ 180 a 260 por metro</option>
      <option value="320" selected>Solo misto com pedra — ~R$ 260 a 400 por metro</option>
      <option value="450">Rocha / basalto — ~R$ 380 a 550 por metro</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m = Number(document.getElementById("metros").value);
  var pm = Number(document.getElementById("solo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m <= 0) { saida.textContent = "Informe a profundidade."; return; }
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var perfuracao = m * pm;
  var total = perfuracao * 1.2;
  saida.textContent = "Estimativa: R$ " + brl(total * 0.8) + " a R$ " + brl(total * 1.3);
  detalhe.textContent = m + " m × R$ " + brl(pm) + "/m = R$ " + brl(perfuracao) + " de perfuração\n" +
    "+ 20% para revestimento, bomba e instalação elétrica\n" +
    "peça o laudo da água e a outorga do órgão estadual";
});
</script>
</body>
</html>
