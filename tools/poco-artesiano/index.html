<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa um Poço Artesiano — Calculadora</title>
<meta name="description" content="Calcule o custo do poço artesiano por metro perfurado, com faixa real de perfuradoras. Grátis, sem cadastro.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/poco-artesiano/">
<meta property="og:title" content="Quanto Custa um Poço Artesiano — Calculadora">
<meta property="og:description" content="Metros × preço/m: faixa de custo do poço artesiano perfurado.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de custo de poço artesiano","url":"https://hashino.github.io/ferramentas/tools/poco-artesiano/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa um poço artesiano."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa um Poco Artesiano</h1>
  <section class="app">
    <label for="metros">Profundidade estimada (metros)</label>
    <input type="number" id="metros" step="5" min="10" value="60">
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var m = Number(document.getElementById("metros").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (m < 10) { saida.textContent = "Informe a profundidade em metros."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = m * 180;
  saida.textContent = "Perfuração: R$ " + br(med * 0.65) + " a R$ " + br(med * 1.7) +
    " (" + m + " m × R$ 120 a 300/m)";
  detalhe.textContent = m + " metros de perfuração estimados\n" +
    "bomba, encanamento e casa de bombas entram à parte (R$ 2.000 a 8.000)\n" +
    "solo duro (rocha) perfura mais devagar e custa mais\n" +
    "uso que não é doméstico pode exigir outorga do órgão ambiental\n" +
    "perfure só com empresa cadastrada e laudo da água depois";
});
</script>
</body>
</html>
