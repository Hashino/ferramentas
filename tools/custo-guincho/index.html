<body data-footer>
<main>
  <h1>Quanto Custa um Guincho</h1>
  <section class="app">
    <label for="km">Distância do reboque (km)</label>
    <input type="number" id="km" step="5" min="1" value="20">
<label for="veiculo">Veículo</label>
    <select id="veiculo">
      <option value="1.0" selected>Carro ou SUV</option>
      <option value="0.8">Moto</option>
      <option value="1.6">Van / utilitário grande</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
  <details class="explicacao">
    <summary>Como funciona</summary>
    <p>Estime o preço do guincho: distância do reboque, carro ou moto, com faixa real de mercado. Grátis, sem cadastro.</p>
    <p class="relacionadas">Veja também: <a href="../custo-creche/">Quanto Custa Creche Particular por Mes</a> · <a href="../custo-raio-x/">Quanto Custa um Raio-X</a> · <a href="../custo-baba/">Quanto Custa uma Baba</a></p>
  </details>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var km = Number(document.getElementById("km").value);
  var fator = Number(document.getElementById("veiculo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (km < 1) { saida.textContent = "Informe a distância."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var med = (180 + km * 9) * fator;
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.5);
  detalhe.textContent = "bandeira + " + br(km) + " km de reboque\n" +
    "seguradora com assistência 24h cobre o guincho: chame antes de pagar\n" +
    "noite, chuva e madrugada somam 20% a 40%\n" +
    "combine o valor total antes de subir o carro na prancha";
});
</script>
