<body data-footer>
<main>
  <h1>Quanto Custa Trocar uma Fechadura</h1>
  <section class="app">
<label for="tipo">Tipo de fechadura</label>
    <select id="tipo">
      <option value="180">Simples de porta interna — R$ 120 a 280</option>
      <option value="450" selected>Segurança multi-pontos (porta externa) — R$ 300 a 650</option>
      <option value="1200">Eletrônica / digital — R$ 800 a 2.000</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>

<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + brl(med * 0.75) + " a R$ " + brl(med * 1.4);
  detalhe.textContent = "fechadura " + nome.toLowerCase() + "\n" +
    "inclui fechadura nova + troca de segredo + mão de obra do chaveiro\n" +
    "atendimento de emergência (porta trancada) costuma dobrar a visita";
});
</script>
