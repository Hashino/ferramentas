<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa uma Tatuagem — Calculadora por Tamanho</title>
<meta name="description" content="Estime o preço da tatuagem pelo tamanho: minimalista, 10, 20 ou 30 cm, com faixa real de estúdio. Grátis, na hora.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/tatuagem-preco/">
<meta property="og:title" content="Quanto Custa uma Tatuagem — Calculadora por Tamanho">
<meta property="og:description" content="Tamanho da tatuagem: faixa de preço de estúdio por sessão.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Estimativa de preço de tatuagem","url":"https://hashino.github.io/ferramentas/tools/tatuagem-preco/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa uma tatuagem."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa uma Tatuagem</h1>
  <section class="app">
<label for="tamanho">Tamanho da tatuagem</label>
    <select id="tamanho">
      <option value="150">Minimalista até 5 cm</option>
      <option value="300" selected>Pequena — cerca de 10 cm</option>
      <option value="600">Média — cerca de 20 cm</option>
      <option value="1200">Grande — 30 cm ou mais / braço inteiro</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("tamanho").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("tamanho").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "Estimativa: R$ " + br(med * 0.7) + " a R$ " + br(med * 1.5);
  detalhe.textContent = "tatuagem " + nome.toLowerCase() + " (valor por sessão)\n" +
    "realista ou colorida custa 50% a 100% mais\n" +
    "estúdio renomado e artista especializado cobram por hora (R$ 200 a 500)\n" +
    "fechamento ou body suit vira várias sessões";
});
</script>
</body>
</html>
