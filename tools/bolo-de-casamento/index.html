<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto Custa Bolo de Casamento — Calculadora</title>
<meta name="description" content="Calcule o custo do bolo de casamento pelo número de convidados, com faixa real de confeitarias. Grátis.">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/bolo-de-casamento/">
<meta property="og:title" content="Quanto Custa Bolo de Casamento — Calculadora">
<meta property="og:description" content="Convidados × andares: custo estimado do bolo de casamento.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Calculadora de preço de bolo de casamento","url":"https://hashino.github.io/ferramentas/tools/bolo-de-casamento/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"Estimativa de quanto custa bolo de casamento."}
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1801908225638213" crossorigin="anonymous"></script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Bolo de Casamento</h1>
  <section class="app">
    <label for="convidados">Número de convidados</label>
    <input type="number" id="convidados" step="10" min="20" value="100">
<label for="tipo">Estilo do bolo</label>
    <select id="tipo">
      <option value="15" selected>Clássico (um ou dois andares)</option>
      <option value="25">Cenográfico com andar de verdade</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var n = Number(document.getElementById("convidados").value);
  var per = Number(document.getElementById("tipo").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  if (n < 20) { saida.textContent = "Informe o número de convidados."; return; }
  var br = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var total = n * per;
  var nome = document.getElementById("tipo").selectedOptions[0].textContent.toLowerCase();
  saida.textContent = "Estimativa: R$ " + br(total * 0.7) + " a R$ " + br(total * 1.6) +
    " (" + n + " convidados × R$ " + br(per) + "/pessoa)";
  detalhe.textContent = "bolo " + nome + "\n" +
    "o cenográfico não é comido: ele engana e o bolo de verdade é menor\n" +
    "degustação grátis é comum ao fechar com a confeitaria\n" +
    "flores comestíveis e pasta americana aumentam o preço\n" +
    "entrega e montagem no salão somam à parte";
});
</script>
</body>
</html>
