<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
  <h1>Quanto Custa Manter um Cavalo por Mes</h1>
  <section class="app">
<label for="regime">Onde o cavalo fica</label>
    <select id="regime">
      <option value="600">Pasto próprio / sítio — você cuida</option>
      <option value="1500" selected>Pensionato simples — baia + capim</option>
      <option value="2800">Pensionato completo — baia, comida, treino</option>
    </select>
    <button id="calcular">Calcular</button>
    <div class="resultado" id="resultado" hidden></div>
    <div id="detalhe" style="margin-top:.75rem;color:var(--muted);font-size:.95rem;white-space:pre-line"></div>
  </section>
  <div class="ad-slot"></div>
</main>
<script src="../../config.js"></script>
<script src="../../chrome.js"></script>
<script>
document.getElementById("calcular").addEventListener("click", function () {
  var med = Number(document.getElementById("regime").value);
  var saida = document.getElementById("resultado");
  var detalhe = document.getElementById("detalhe");
  saida.hidden = false; detalhe.textContent = "";
  var brl = function (x) { return x.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
  var nome = document.getElementById("regime").selectedOptions[0].textContent.split("—")[0].trim();
  saida.textContent = "R$ " + brl(med * 0.8) + " a R$ " + brl(med * 1.3) + " por mês";
  detalhe.textContent = nome.toLowerCase() + "\n" +
    "fora da mensalidade: ferrageamento (a cada ~40 dias, R$ 150 a 250),\n" +
    "vermifugos, dentista equino e veterinário de emergência\n" +
    "ração e suplemento de esporte somam R$ 300 a 600/mês";
});
</script>
</body>
</html>
