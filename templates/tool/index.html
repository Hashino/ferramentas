<!doctype html>
<!--
  MOLDE DE FERRAMENTA — copie para tools/<slug>/index.html e preencha os tokens {{...}}.
  Regras: vanilla JS sem dependências; funciona offline; a página contém APENAS a
  barra superior, o título e a ferramenta — sem texto explicativo nem FAQ visíveis.
  Tokens: {{SLUG}} {{TOOL_NAME}} {{TITLE}} {{DESCRIPTION}} {{H1}} {{APP_HTML}} {{APP_JS}}
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="https://hashino.github.io/ferramentas/tools/{{SLUG}}/">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"{{TOOL_NAME}}","url":"https://hashino.github.io/ferramentas/tools/{{SLUG}}/","applicationCategory":"UtilityApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"description":"{{DESCRIPTION}}"}
</script>
<script>document.documentElement.setAttribute("data-theme",function(){try{return localStorage.getItem("theme")||"light"}catch(e){return"light"}}());</script>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<div id="stars"></div><div id="stars2"></div><div id="stars3"></div>
<nav class="top-nav"><div class="nav-container">
  <a class="nav-title" href="../../">Ferramentas</a>
  <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema"></button>
</div></nav>
<main>
  <h1>{{H1}}</h1>
  <section class="app">
{{APP_HTML}}
  </section>
  <div class="ad-slot"></div>
</main>
<footer>
  <a href="../../sobre.html">Sobre</a> ·
  <a href="../../privacidade.html">Privacidade</a> ·
  <a href="https://github.com/Hashino/ferramentas">GitHub</a>
</footer>
<script src="../../config.js"></script>
<script src="../../ads.js"></script>
<script src="../../theme.js"></script>
<script>
{{APP_JS}}
</script>
</body>
</html>
